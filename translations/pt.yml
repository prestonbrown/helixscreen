  The cutter is out of alignment — recalibrate with CALIBRATE_CUT_POS: O cortador está desalinhado. Recalibre com CALIBRATE_CUT_POS
  ? The exact stopping point could not be found. The print resumes at the start of the next layer and skips the rest of this one.
  : O ponto exato de parada não foi encontrado. A impressão é retomada no início da próxima camada e pula o restante desta.
  The extruder cannot pull it smoothly. Check the spool for a tangle or knot, and the PTFE tube for a severe bend: O extrusor não consegue puxar com suavidade. Verifique se o carretel está embaraçado ou com nós, e se o tubo PTFE tem uma curva acentuada
