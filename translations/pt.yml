  : O bico montado aquece até 200°C e esfria de novo enquanto o modelo de segurança do aquecedor é ajustado. Mantenha a ventoinha da peça desligada e material inflamável longe do cabeçote. Isso leva vários minutos.
  The nozzle extrudes a few short test moves in a corner, away from the print area, and repeats until it agrees with itself.: 'O bico faz alguns movimentos curtos de teste num canto, longe da área de impressão, e repete até os valores convergirem.'
  "The nozzle hasn't moved since the power went out. Check that it sits just above the top of the print, then resume.": "O bico não se moveu desde a queda de energia. Confira se ele está logo acima do topo da impressão e depois retome."
