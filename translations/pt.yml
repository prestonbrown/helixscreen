  The printer has not answered the cancel yet. It stops once its start sequence finishes.: 'A impressora ainda não respondeu ao cancelamento. Ela para assim que concluir a sequência de início.'
  The printer has not reported its axis limits yet.: 'A impressora ainda não informou os limites dos eixos.'
  The printer has not reported its maximum velocity yet.: 'A impressora ainda não informou a velocidade máxima.'
  ? The printer heats the nozzle, extrudes a few short test moves in a corner of the plate, and measures them itself. It repeats until the readings agree, then reports one number.
  : 'A impressora aquece o bico, faz alguns movimentos curtos de teste num canto da placa e os mede sozinha. Repete até as leituras coincidirem e então informa um único número.'
  The printer homes and sweeps the cutter (about 1 minute). Keep the filament path clear.: A impressora referencia e varre o cortador (cerca de 1 minuto). Mantenha o caminho do filamento livre.
  ? The printer homes, then moves the plate as far from the nozzle as it goes. Some spools are not heat-resistant enough and can deform. Nothing moves from this screen until you confirm the spools are off the bed; Mainsail, macros and prints sent from a slicer are not blocked.

  : A impressora faz o home e depois afasta a mesa do bico o máximo possível. Alguns carretéis não resistem ao calor o suficiente e podem deformar. Nada se move a partir desta tela até você confirmar que os carretéis saíram da mesa; Mainsail, macros e impressões enviadas por um fatiador não são bloqueados.

  The printer homes, then probes each screw position.: "A impressora faz home e depois sonda cada posição de parafuso."
  The printer is not homed. Continuing will home all axes, moving the toolhead. Make sure the bed is clear.: A impressora não fez home. Continuar fará home em todos os eixos, movendo o cabeçote. Certifique-se de que a mesa esteja livre.
  The printer is shut down.: 'A impressora está desligada.'
  ? The printer is waiting for the chamber to reach a temperature, and only an emergency stop and a firmware restart end that wait. The print stops at once and cannot be resumed.
  : 'A impressora aguarda a câmara atingir uma temperatura, e só uma parada de emergência e uma reinicialização do firmware encerram essa espera. A impressão para imediatamente e não pode ser retomada.'
  The printer isn't detecting that any filament is currently loaded. What would you like to do?: A impressora não está detectando nenhum filamento carregado. O que você deseja fazer?
  The printer kept printing after the cancel.: 'A impressora continuou imprimindo após o cancelamento.'
  The printer lost power during a print. It can resume where it left off.: A impressora
    perdeu energia durante uma impressão. Ela pode retomar de onde parou.
  The printer lost power during a print. The resumed layer may not line up exactly.: A impressora perdeu energia durante uma impressão. A camada retomada pode não se alinhar exatamente.
  The printer lost power while printing {}. Resume where it left off?: A impressora perdeu
    energia ao imprimir {}. Retomar de onde parou?
  The printer lost power while printing {}. The resumed layer may not line up exactly.: A impressora perdeu energia ao imprimir {}. A camada retomada pode não se alinhar exatamente.
  The printer moves the toolhead and measures its motors.: 'A impressora move o cabeçote e mede seus motores.'
  The printer no longer has a print to resume.: A impressora não tem mais uma impressão para retomar.
  The printer reads the file up to the last saved position. A large file can take a minute.: A impressora lê o arquivo até a última posição salva. Um arquivo grande pode levar um minuto.
  The printer records lane {} in the toolhead, not this one: 'A impressora registra a lane {} no cabeçote, não esta'
  'The printer refused that port: check the port (Moonraker is usually 7125).': "A impressora recusou essa porta: verifique a porta (o Moonraker costuma usar a 7125)."
  The printer rejected the filament configuration. The print was not started.: A impressora
    rejeitou a configuração do filamento. A impressão não foi iniciada.
  The printer reports measured fan speeds. HelixScreen shows them on the Fans screen.: 'A impressora informa as velocidades medidas das ventoinhas. O HelixScreen as mostra na tela Ventoinhas.'
  The printer reports no lane record, so only clearing the extruder can unload it.: 'A impressora não informa nenhum registro de lane, então só esvaziar o extrusor pode descarregar.'
  The printer swaps between several toolheads. Manage the tools on the filament system screen.: 'A impressora alterna entre vários cabeçotes. Gerencie as ferramentas na tela do sistema de filamento.'
  The printer's firmware chooses where to switch on runout: O firmware da impressora escolhe para onde trocar ao acabar
  The requested position is outside the printer's bounds: 'A posição solicitada está fora dos limites da impressora'
  The right RFID reader in this CFS unit may need service: O leitor RFID direito desta unidade CFS pode precisar de manutenção
  The runout sensor indicates no filament is loaded. Start print anyway?: O sensor
    de fim de filamento indica que não há filamento carregado. Iniciar a impressão
    mesmo assim?
  The saved position is kept. Reconnect or restart the screen to be offered the resume again.: A posição salva é mantida. Reconecte ou reinicie a tela para que a retomada seja oferecida de novo.
  The sensor in this CFS unit cannot be read. Check its connection, or the unit may need service: Não é possível ler o sensor desta unidade CFS. Verifique a conexão, ou a unidade pode precisar de manutenção
  The speed of one fan you choose: A velocidade de uma ventoinha escolhida
  The time, date, and system uptime: Hora, data e tempo ativo
  The timelapse or logs folder overlaps a protected folder, so cleanup is off.: "A pasta de timelapse ou de logs sobrepõe-se a uma pasta protegida, por isso a limpeza está desligada."
  The tool change under way finished, and the tool was not parked: 'A troca de ferramenta em andamento terminou e a ferramenta não foi estacionada'
  The tool change under way finished, and {} was not put back on the carriage: 'A troca de ferramenta em andamento terminou e {} não foi devolvida ao carro'
  The toolhead has filament but no AMS slot reports it loaded. Pull it out manually before printing. Start anyway?: O cabeçote tem filamento, mas nenhum slot AMS o reporta como carregado. Retire-o manualmente antes de imprimir. Iniciar mesmo assim?
  ? The toolhead has filament but no AMS slot reports it loaded. The printer may refuse to load a slot until it is cleared. Start anyway?
  : O cabeçote tem filamento, mas nenhum slot AMS o reporta como carregado. A impressora pode não conseguir carregar um slot até que ele seja esvaziado. Iniciar mesmo assim?
  The toolhead sensor indicates filament is already loaded. Proceed with load anyway?: O
    sensor do cabeçote indica que o filamento já está carregado. Prosseguir com o
    carregamento mesmo assim?
  The toolhead sensor indicates no filament is present. Proceed with unload anyway?: O
    sensor do cabeçote indica que não há filamento presente. Prosseguir com o descarregamento
    mesmo assim?
  The unit is already running another operation. Wait for it to finish, or reset the CFS if it stays stuck: A unidade já está executando outra operação. Aguarde a conclusão, ou reinicie o CFS se ele continuar travado
  The unit reported a fault with no further detail. Restart the printer if it repeats: A unidade relatou uma falha sem mais detalhes. Reinicie a impressora se repetir
  The unit's onboard storage has failed. The CFS mainboard needs replacing: O armazenamento interno da unidade falhou. A placa-mãe do CFS precisa ser substituída
  'The unload did not start: unload by hand, then start again': 'A descarga não começou: descarregue à mão e comece de novo'
  The unload finishes on its own, but the plate will not move.: 'A descarga termina sozinha, mas a mesa não vai se mover.'
  Theme: Tema
  Theme Colors: Cores do Tema
  Theme Preset: Predefinição de Tema
  Theme changes apply after restart.: Alterações de tema aplicam após reiniciar.
  Theme reset to defaults: Tema redefinido para os padrões
  'Theme: ': 'Tema: '
  There is no cycle to stop: 'Não há ciclo para parar'
  ? There is not enough free memory to run this test. Klipper's analysis would run out of memory and leave the printer stuck until it is power-cycled.
  : "Não há memória livre suficiente para este teste. A análise do Klipper ficaria sem memória e deixaria a impressora travada até ser desligada e ligada."
  These readings aren't repeatable, so tuning can't be steered. Check the mechanics first.: "Essas leituras não se repetem, então o ajuste não pode ser guiado. Verifique a mecânica primeiro."
  'These tools have a different filament grade loaded:': 'Estas ferramentas têm um grau de filamento diferente carregado:'
  'These tools have incompatible materials loaded:': 'Estas ferramentas têm materiais
    incompatíveis carregados:'
  'These tools have no filament loaded:': 'Estas ferramentas não têm filamento carregado:'
  'These tools have no matching filament loaded:': 'Estas ferramentas não têm filamento
    correspondente carregado:'
  This .3mf has no sliced plate to print.: 'Este .3mf não tem nenhuma placa fatiada para imprimir.'
  This .3mf has to be converted to G-code before it can be queued. Print it from here instead.: 'Este .3mf precisa ser convertido em G-code antes de entrar na fila. Imprima-o daqui.'
  This .3mf has to be converted to G-code on the printer before it can print.: 'Este .3mf precisa ser convertido em G-code na impressora antes de poder imprimir.'
  This AFC system does not support bypass mode: 'Este sistema AFC não oferece suporte ao modo bypass'
  This CFS firmware exposes no external spool slot: 'Este firmware do CFS não expõe um slot para carretel externo'
  This Happy Hare system does not support bypass mode: 'Este sistema Happy Hare não oferece suporte ao modo bypass'
  This Moonraker version can't hold uploads. Update Moonraker.: "Esta versão do Moonraker não consegue reter envios. Atualize o Moonraker."
  This button controls: Este botão controla
  This calibration uses the paper friction method to set your Z-offset.: Esta calibração
    usa o método de fricção de papel para definir seu Z-offset.
  This cannot be undone.: Isso não pode ser desfeito.
  This channel offers v{}, older than the installed v{}. Anything added since then will be removed.: 'Este canal oferece a v{}, anterior à v{} instalada. Tudo o que foi adicionado desde então será removido.'
  ? "This check runs Klipper's resonance test along each belt path and compares the two responses. Balanced belts give curves of the same shape, with peaks at the same frequencies.\n\nEach sweep takes a few minutes and moves the toolhead; keep clear of the printer while it runs."
  : "Esta verificação executa o teste de ressonância do Klipper ao longo de cada caminho da correia e compara as duas respostas. Correias equilibradas produzem curvas com a mesma forma, com picos nas mesmas frequências.\n\nCada varredura leva alguns minutos e move o cabeçote; mantenha distância da impressora enquanto ela executa."
  This clears every Endless Spool backup. The print will stop on runout until you set up Endless Spool again.: Isso limpa todas as reservas do carretel infinito. A impressão parará ao acabar o filamento até você configurar o carretel infinito novamente.
  This device has no wired network connection. If you turn WiFi off, it can only be turned back on from this screen.: Este dispositivo não tem conexão de rede com fio. Se você desligar o WiFi, só será possível ligá-lo novamente nesta tela.
  ? This device has only {} MB of RAM. Resonance calibration is memory-intensive and can make the printer firmware report a "Timer Too Close" error or restart mid-test. Continue anyway?
  : Este dispositivo tem apenas {} MB de RAM. A calibração de ressonância consome muita memória e pode fazer o firmware da impressora reportar um erro "Timer Too Close" ou reiniciar durante o teste. Continuar mesmo assim?
  ? This device has very little RAM. Resonance calibration is memory-intensive and may cause a "Timer Too Close" error. Continue anyway?
  : Este dispositivo tem muito pouca RAM. A calibração de ressonância consome muita memória e pode causar um erro "Timer Too Close". Continuar mesmo assim?
  This doesn't match the linked Spoolman spool. Add it as a new spool, or update the linked one to match?: Isto não corresponde ao carretel do Spoolman vinculado. Adicionar como um novo carretel ou atualizar o vinculado para corresponder?
  This dryer cannot run while filament from the unit is loaded: 'Este secador não pode funcionar enquanto houver filamento da unidade carregado'
  This feature failed to start. The Moonraker log says why.: "Este recurso não conseguiu iniciar. O log do Moonraker diz o motivo."
  This feature requires different hardware or configuration: Este recurso requer hardware ou configuração diferentes
  This feature stopped. Restart Moonraker to start it again.: "Este recurso parou. Reinicie o Moonraker para iniciá-lo de novo."
  This filament system does not report buffer or flow data.: Este sistema de filamento não reporta dados de buffer ou de fluxo.
  This file prints {0} and {1} through one nozzle. {0} can burn and clog the nozzle at {1} temperatures.: 'Este arquivo imprime {0} e {1} por um único bico. {0} pode queimar e entupir o bico nas temperaturas de {1}.'
  This file prints {0} and {1} together. The chamber and bed heat {1} needs can soften {0} and jam its nozzle.: 'Este arquivo imprime {0} e {1} juntos. O calor da câmara e da mesa de que {1} precisa pode amolecer {0} e entupir seu bico.'
  This file was sliced for {} but {} is loaded.: Este arquivo foi fatiado para {}
    mas {} está carregado.
  This file was sliced for {}, but {} is loaded. It will print slower and hotter than the loaded spool needs.: Este arquivo foi fatiado para {}, mas {} está carregado. A impressão será mais lenta e mais quente do que o carretel carregado precisa.
  This firmware can only switch slots by loading them: 'Este firmware só pode trocar de slot carregando-o'
  ? This installs the HelixScreen helper macros on the printer and adds them to printer.cfg. A print is running, so Klipper restarts after it finishes.
  : 'Isto instala as macros de ajuda do HelixScreen na impressora e as adiciona ao printer.cfg. Uma impressão está em andamento, então o Klipper será reiniciado ao término.'
  This installs the HelixScreen helper macros on the printer, adds them to printer.cfg, and restarts Klipper.: 'Isto instala as macros de ajuda do HelixScreen na impressora, as adiciona ao printer.cfg e reinicia o Klipper.'
  'This is an emergency stop: the printer halts and Klipper restarts.': 'Esta é uma parada de emergência: a impressora para e o Klipper reinicia.'
  This is exactly the data that will be sent: Estes são exatamente os dados que serão
    enviados
  This is what data would be sent if enabled: Estes são os dados que seriam enviados
    se habilitado
  This looks like a {}, but it is set up as a {}: Esta impressora parece uma {}, mas está configurada como {}
  This may take up to 30 seconds: Isso pode levar até 30 segundos
  This needs the plugin's file analysis, which isn't running.: "Isto precisa da análise de arquivos do plugin, que não está em execução."
  This plugin asks for no special permissions.: 'Este plugin não pede permissões especiais.'
  This plugin lets HelixScreen control print start options like bed mesh and QGL.: 'Este plugin permite que o HelixScreen controle opções de início de impressão como malha da mesa e QGL.'
  This print can't be resumed. Restart it, or turn off the bed check if it keeps happening.: 'Esta impressão não pode ser retomada. Reinicie-a ou desligue a verificação da mesa se isso continuar acontecendo.'
  This print does not report layers, so no layer pause can be scheduled.: 'Esta impressão não informa camadas, então não é possível agendar uma pausa em uma camada.'
  This print needs about %.0fg but the spool has about %.0fg remaining. Start anyway?: Esta
    impressão precisa de cerca de %.0fg, mas o carretel tem cerca de %.0fg restantes.
    Iniciar mesmo assim?
  This print never reports layer {}.: 'Esta impressão nunca informa a camada {}.'
  This printer cannot calibrate tool offsets automatically: Esta impressora não consegue calibrar os offsets de ferramenta automaticamente
  This printer fills its gates from Spoolman. HelixScreen cleared its own copy; remove the spool in Spoolman.: Esta impressora preenche seus gates a partir do Spoolman. O HelixScreen limpou a própria cópia; remova a bobina no Spoolman.
  This printer fills its gates from Spoolman. Make color, material and spool changes in Spoolman.: Esta impressora preenche seus gates a partir do Spoolman. Faça alterações de cor, material e bobina no Spoolman.
  This printer has no IFS.: "Esta impressora não tem IFS."
  This printer has no INDX LOAD_FILAMENT macro: "Esta impressora não tem a macro LOAD_FILAMENT do INDX"
  This printer has no automatic unload. Cut the filament at the head and pull it out by hand.: Esta impressora não tem descarga automática. Corte o filamento no cabeçote e retire-o à mão.
  ? This printer looks like a {} ({}% confidence), but it is set up as a {}. A wrong type applies incorrect pre-print options and presets.
  : Esta impressora parece ser uma {} ({}% de confiança), mas está configurada como {}. Um tipo errado aplica opções de pré-impressão e predefinições incorretas.
  "This printer's INDX macros are missing: {}": "Faltam nas macros do INDX desta impressora: {}"
  This printer's Moonraker rejected its API key. Check the key in Settings > Connection.: 'O Moonraker desta impressora rejeitou a chave de API. Verifique a chave em Configurações > Conexão.'
  This printer's Moonraker requires a login. Add its API key in Settings > Connection.: 'O Moonraker desta impressora exige login. Adicione a chave de API em Configurações > Conexão.'
  This printer's network service controls the WiFi radio: O serviço de rede desta impressora controla o rádio WiFi
  This printer's network service manages saved WiFi networks: O serviço de rede desta impressora gerencia as redes WiFi salvas
  This printer's screen has not shared a layout: "A tela desta impressora não compartilhou um layout"
  ? This removes the plugin's Moonraker component and restarts Moonraker. The printer will briefly disconnect. If old phase-tracking lines are still in PRINT_START, they are removed too, with backups kept. A Klipper restart applies that.
  : Isso remove o componente do Moonraker do plugin e reinicia o Moonraker. A impressora será brevemente desconectada. Se ainda houver linhas antigas de rastreamento de fase no PRINT_START, elas também são removidas, mantendo os backups. Um reinício do Klipper aplica isso.
  This replaces the printer's helper macros with the current version and restarts Klipper.: 'Isto substitui as macros de ajuda da impressora pela versão atual e reinicia o Klipper.'
  ? This replaces the printer's helper macros with the current version. A print is running, so Klipper restarts after it finishes.
  : 'Isto substitui as macros de ajuda da impressora pela versão atual. Uma impressão está em andamento, então o Klipper será reiniciado ao término.'
  This replaces this screen's home layout for this printer with the one on the printer's own screen.: "Isso substitui o layout da tela inicial desta tela para esta impressora pelo layout da tela da própria impressora."
  This resume needs a newer version of HelixScreen.: Esta retomada precisa de uma versão mais nova do HelixScreen.
  This slot feeds no tool: 'Este slot não alimenta nenhuma ferramenta'
  This spool's details haven't loaded from Spoolman yet. Try Save again.: 'Os detalhes deste carretel ainda não foram carregados do Spoolman. Toque em Salvar novamente.'
  This system does not support bypass mode: 'Este sistema não oferece suporte ao modo bypass'
  This tool probes each bed screw and tells you how much to adjust.: Esta ferramenta
    sonda cada parafuso da mesa e informa quanto ajustar.
  'This update asks for new permissions:': 'Esta atualização pede novas permissões:'
  'This wait ends only at its temperature: canceling takes an emergency stop and a firmware restart.': 'Esta espera só termina na sua temperatura: cancelar exige uma parada de emergência e uma reinicialização do firmware.'
  ? This will apply the Z-offset to your endstop and restart Klipper to save the configuration.
    The printer will briefly disconnect.
  : Isso aplicará o Z-offset ao seu endstop e reiniciará o Klipper para salvar a configuração.
    A impressora será brevemente desconectada.
  ? This will apply the Z-offset to your probe and restart Klipper to save the configuration.
    The printer will briefly disconnect.
  : Isso aplicará o Z-offset à sua sonda e reiniciará o Klipper para salvar a configuração.
    A impressora será brevemente desconectada.
  ? This will collect system info, logs, settings, and printer data to help diagnose
    issues. No passwords or sensitive data will be included.
  : Isso coletará informações do sistema, logs, configurações e dados da impressora
    para ajudar a diagnosticar problemas. Nenhuma senha ou dado sensível será incluído.
  This will immediately halt all printer operations. The printer will require a restart to resume.: Isso
    interromperá imediatamente todas as operações da impressora. A impressora precisará
    de um reinício para retomar.
  This will remove all custom pages and restore the default widget layout.: Todas
    as páginas personalizadas serão removidas e o layout padrão de widgets será restaurado.
  This will remove all entries from the display.: Isso removerá todas as entradas
    do display.
  This will remove the Spoolman configuration from Moonraker and restart the service.: Isso
    removerá a configuração do Spoolman do Moonraker e reiniciará o serviço.
  This will reset all settings to defaults. This action cannot be undone.: Isso resetará
    todas as configurações para os padrões. Esta ação não pode ser desfeita.
  This will restart Klipper firmware. Any active operations will be interrupted.: O
    firmware Klipper será reiniciado. Operações ativas serão interrompidas.
  This will restart Klipper.: Isso reiniciará o Klipper.
  This will restore the default jog step distances for all three modes.: Isso restaurará as distâncias de passo de movimento padrão para todos os três modos.
  This will save the Z-offset and restart Klipper to write the configuration. The printer will briefly disconnect.: Isso salvará o Z-offset e reiniciará o Klipper para gravar a configuração. A impressora será brevemente desconectada.
  ? This writes the tool offsets to the printer's config and restarts Klipper, which takes a few seconds. Until then they apply only to this session.
  : Isso grava os offsets de ferramenta na configuração da impressora e reinicia o Klipper, o que leva alguns segundos. Até lá, eles valem apenas para esta sessão.
  ? This {0} is set up for {1}, but it looks stock ({2}% confidence). A wrong profile applies incorrect pre-print options and presets.
  : 'Esta {0} está configurada para {1}, mas parece original ({2}% de confiança). Um perfil errado aplica opções de pré-impressão e predefinições incorretas.'
  ? This {0} looks like it has {1} ({2}% confidence), but it is set up as stock. A wrong profile applies incorrect pre-print options and presets.
  : 'Esta {0} parece ter {1} ({2}% de confiança), mas está configurada como original. Um perfil errado aplica opções de pré-impressão e predefinições incorretas.'
  ? This {0} looks like it has {1} ({2}% confidence), but it is set up for {3}. A wrong profile applies incorrect pre-print options and presets.
