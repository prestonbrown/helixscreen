  This .3mf has to be converted to G-code before it can be queued. Print it from here instead.: Ten plik .3mf musi zostać przekonwertowany na G-code, zanim trafi do kolejki. Wydrukuj go stąd.
  ? 'The probe before the print disagrees with the saved bed mesh: a different plate, a different temperature, or debris on the bed.'
  : 'Pomiar przed drukiem nie zgadza się z zapisaną siatką stołu: inna płyta, inna temperatura albo zanieczyszczenia na stole.'
  'The probe never touched the plate: the PEI plate is not placed correctly.': 'Sonda nie dotknęła płyty: płyta PEI nie jest prawidłowo położona.'
  ? 'The probe read as triggered before it started moving: it did not retract, the nozzle is touching the bed, or its signal is inverted.'
  : 'Sonda była wyzwolona, zanim zaczęła się ruszać: nie schowała się, dysza dotyka stołu albo jej sygnał jest odwrócony.'
  The probe was already triggered before the move started.: Sonda była już wyzwolona przed rozpoczęciem ruchu.
  The printer's state could no longer be read, so the remaining steps did not run.: Nie można już odczytać stanu drukarki, więc pozostałe kroki się nie wykonały.
