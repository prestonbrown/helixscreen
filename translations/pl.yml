  ? Klipper stopped reporting progress. Its analysis can run out of memory on small printers and leave Klipper stuck, where a firmware restart cannot reach it. Power-cycle the printer (or restart Klipper over SSH), then try again.
  : Klipper przestał raportować postęp. Na małych drukarkach jego analizie może zabraknąć pamięci i Klipper się zawiesza, a restart firmware go nie obudzi. Wyłącz i włącz drukarkę (albo zrestartuj Klippera przez SSH), potem spróbuj ponownie.
  Klipper stopped reporting progress. Its analysis can run out of memory on small printers; restart Klipper, then try again.: Klipper przestał raportować postęp. Na małych drukarkach jego analizie może zabraknąć pamięci; zrestartuj Klippera i spróbuj ponownie.
  Klipper stopped while the printer was finishing a step, so the remaining steps did not run.: Klipper zatrzymał się, gdy drukarka kończyła krok, więc pozostałe kroki się nie wykonały.
