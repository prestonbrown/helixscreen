  The unit reported a fault with no further detail. Restart the printer if it repeats: Jednostka zgłosiła usterkę bez szczegółów. Jeśli się powtórzy, uruchom ponownie drukarkę
  The unit whose drawing to set: Jednostka, której rysunek ustawić
