  The top cover has been disconnected. To ensure print quality, reconnect the top cover before continuing.: Górna pokrywa została odłączona. Aby zapewnić jakość druku, podłącz ją ponownie przed kontynuacją.
  The tower stopped with an error. Nothing was changed.: Wieża zatrzymała się z błędem. Nic nie zmieniono.
