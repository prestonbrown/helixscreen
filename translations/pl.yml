  Let it cool, lower run_current for {1} or improve the cooling over the drivers, then restart the firmware.: Pozwól mu ostygnąć, obniż run_current dla {1} albo popraw chłodzenie sterowników, a potem uruchom ponownie firmware.
  Let the printer's tensioners set the belts: Pozwól napinaczom drukarki ustawić paski
  ? The printer homes X and Y if needed, then drives the toolhead into the cutter to find its position. Unload the filament first.
  : Drukarka w razie potrzeby bazuje X i Y, a potem wjeżdża głowicą w obcinak, aby znaleźć jego pozycję. Najpierw rozładuj filament.
  ? The printer homes X and Y, moves the toolhead to the middle of the bed and sets each belt with its tensioner. The motors are released when it finishes, so home before moving the printer.
  : Drukarka bazuje X i Y, przesuwa głowicę na środek stołu i ustawia każdy pasek jego napinaczem. Na koniec silniki są zwalniane, więc przed ruchem drukarki wykonaj bazowanie.
  The printer did not say how to pick up this toolhead yet. Try again once its filament system has finished connecting.: Drukarka nie podała jeszcze, jak pobrać tę głowicę. Spróbuj ponownie, gdy jej system filamentu zakończy łączenie.
