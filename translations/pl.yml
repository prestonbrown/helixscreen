  HelixScreen is detecting your display orientation: HelixScreen wykrywa orientację ekranu
  ? HelixScreen removes its [include helix-plr/*.cfg] lines from printer.cfg. A backup is kept beside printer.cfg, and Klipper must restart for it to take effect. A resume then uses the printer's default mesh profile.
  : HelixScreen usuwa swoje linie [include helix-plr/*.cfg] z printer.cfg. Kopia zapasowa jest obok printer.cfg, a zmiana działa po restarcie Klippera. Wznowienie użyje wtedy domyślnego profilu siatki drukarki.
