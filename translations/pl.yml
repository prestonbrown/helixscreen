  This printer's accelerometer measures up to {0:.0f} Hz, so faster ripples are not shown.: Akcelerometr tej drukarki mierzy do {0:.0f} Hz, więc szybsze falowania nie są pokazane.
  This printer's firmware has its own power-loss recovery.: Firmware tej drukarki ma własne odzyskiwanie po zaniku zasilania.
