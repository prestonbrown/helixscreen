  The probe was used before the printer was homed.: Sondy użyto przed zbazowaniem drukarki.
  The queue prints this .3mf's default plate. Print this plate from here instead.: Kolejka drukuje domyślną płytę tego pliku .3mf. Tę płytę wydrukuj stąd.
  The pre-print steps you turned off cannot be applied to this .3mf. Turn them back on to print it.: Kroków przed drukiem, które wyłączono, nie można zastosować do tego pliku .3mf. Włącz je z powrotem, aby go wydrukować.
  Filament Mapping at print start: Mapowanie filamentu przy starcie druku
  Filament Mapping cannot rewrite this .3mf. Print it without remapping.: Mapowanie filamentu nie może przepisać tego pliku .3mf. Wydrukuj go bez zmiany mapowania.
  This .3mf's plates are still loading. Try again in a moment.: Płyty tego pliku .3mf wciąż się wczytują. Spróbuj za chwilę.
  This .3mf has to be converted to G-code on the printer before it can print.: Ten plik .3mf musi zostać przekonwertowany na G-code na drukarce, zanim będzie można go wydrukować.
  This AFC system does not support bypass mode: Ten system AFC nie obsługuje trybu obejścia
  This CFS firmware exposes no external spool slot: To firmware CFS nie udostępnia slotu szpuli zewnętrznej
  This Happy Hare system does not support bypass mode: Ten system Happy Hare nie obsługuje trybu obejścia
  Needs a newer Moonraker to hold uploads.: Wymaga nowszego Moonrakera do przechowywania przesłanych plików.
  This button controls: Ten przycisk steruje
  This calibration uses the paper friction method to set your Z-offset.: Ta kalibracja ustawia offset Z metodą tarcia kartki.
  This cannot be undone.: Tego nie można cofnąć.
  This channel offers v{}, older than the installed v{}. Anything added since then will be removed.: Ten kanał oferuje v{}, starszą niż zainstalowana v{}. Wszystko dodane od tamtej pory zostanie usunięte.
  This check reads the accelerometer directly, so HelixScreen must run on the printer's own computer.: To sprawdzenie czyta akcelerometr bezpośrednio, więc HelixScreen musi działać na komputerze samej drukarki.
  ? 'This check runs Klipper''s resonance test along each belt path and compares the two responses. Balanced belts give curves of the same shape, with peaks at the same frequencies.


    Each sweep takes a few minutes and moves the toolhead; keep clear of the printer while it runs.'
  : 'To sprawdzenie wykonuje test rezonansu Klippera wzdłuż ścieżki każdego pasa i porównuje obie odpowiedzi. Zrównoważone pasy dają krzywe o tym samym kształcie, ze szczytami przy tych samych częstotliwościach.


    Każde przemiatanie trwa kilka minut i porusza głowicą; trzymaj się z dala od drukarki podczas pracy.'
  This clears every Endless Spool backup. The print will stop on runout until you set up Endless Spool again.: To usuwa wszystkie zapasy Nieskończonej szpuli. Wydruk zatrzyma się po skończeniu filamentu, dopóki ponownie nie skonfigurujesz Nieskończonej szpuli.
  ? This cold pull uses the filament loaded in this toolhead. The extruder and the top of its filament path must be reachable by hand.
  : To zimne wyciąganie używa filamentu załadowanego w tej głowicy. Ekstruder i górna część ścieżki filamentu muszą być dostępne ręką.
  This device has no wired network connection. If you turn WiFi off, it can only be turned back on from this screen.: To urządzenie nie ma przewodowego połączenia sieciowego. Jeśli wyłączysz WiFi, włączysz je z powrotem tylko z tego ekranu.
  ? This device has only {} MB of RAM. Resonance calibration is memory-intensive and can make the printer firmware report a "Timer Too Close" error or restart mid-test. Continue anyway?
  : To urządzenie ma tylko {} MB RAM. Kalibracja rezonansu zużywa dużo pamięci i może spowodować błąd firmware „Timer Too Close” lub restart w trakcie testu. Kontynuować mimo to?
  ? This device has very little RAM. Resonance calibration is memory-intensive and may cause a "Timer Too Close" error. Continue anyway?
  : To urządzenie ma bardzo mało RAM. Kalibracja rezonansu zużywa dużo pamięci i może spowodować błąd „Timer Too Close”. Kontynuować mimo to?
  This doesn't match the linked Spoolman spool. Add it as a new spool, or update the linked one to match?: To nie zgadza się z powiązaną szpulą Spoolman. Dodać jako nową szpulę czy zaktualizować powiązaną?
  This doesn't match the linked Spoolman spool. Update it in Spoolman, or unlink and keep it on this slot?: To nie zgadza się z powiązaną szpulą Spoolman. Zaktualizować ją w Spoolman czy odłączyć i zostawić w tym slocie?
  This dryer cannot run while filament from the unit is loaded: Ta suszarka nie może działać, gdy załadowany jest filament z jednostki
  Failed to start. See the Moonraker log.: Nie udało się uruchomić. Zobacz log Moonrakera.
