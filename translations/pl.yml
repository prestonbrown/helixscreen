  ? A 0.2 mm nozzle can't print every filament, including PA, PC, TPU and carbon- or glass-filled types. If this head has one of them loaded, the printer clears its filament info and you'll need to set it again.
  : Dysza 0,2 mm nie wydrukuje każdego filamentu, m.in. PA, PC, TPU oraz z wypełnieniem węglowym lub szklanym. Jeśli ta głowica ma załadowany któryś z nich, drukarka wyczyści informacje o filamencie i trzeba będzie ustawić je ponownie.
  A buzzer or speaker for alerts and sounds. Set what plays in the sound settings.: Brzęczyk lub głośnik do alertów i dźwięków. Co ma grać, ustawisz w ustawieniach dźwięku.
  A camera Moonraker streams. Add the camera widget to the home screen to watch it, and see it during a print.: Kamera, którą streamuje Moonraker. Dodaj widżet kamery na ekran główny, aby ją oglądać, także w trakcie druku.
  A delta printer can't home X and Y without moving Z, so a print can't be resumed.: Drukarka delta nie zbazuje X i Y bez ruchu Z, więc wydruku nie da się wznowić.
  A fan that pulls the enclosure air through a filter. Control it on the chamber temperature screen.: Wentylator, który przetłacza powietrze z obudowy przez filtr. Sterujesz nim na ekranie temperatury komory.
  A few minutes, nearly all of it heating. You judge nothing by eye.: Kilka minut, prawie w całości nagrzewanie. Nic nie oceniasz na oko.
  A folder name in moonraker.conf is unsafe.: Nazwa folderu w moonraker.conf jest niebezpieczna.
  A heat soak macro is set up on the printer. HelixScreen detects it but does not run it.: Na drukarce jest makro wygrzewania (heat soak). HelixScreen je wykrywa, ale nie uruchamia.
  A heater that warms the air inside the enclosure. Set its temperature on the chamber temperature screen.: Grzałka, która ogrzewa powietrze w obudowie. Temperaturę ustawisz na ekranie temperatury komory.
  A height map of the bed that Klipper uses to make up for an uneven surface. View and calibrate it on the Bed Mesh screen.: Mapa wysokości stołu, którą Klipper kompensuje nierówną powierzchnię. Podgląd i kalibracja na ekranie Siatka stołu.
  A left, B right: A po lewej, B po prawej
  A lower, B upper: A niżej, B wyżej
  'A macro printed stray template text ''{}'': check its Jinja tags': 'Makro wypisało zbędny tekst szablonu „{}”: sprawdź jego znaczniki Jinja'
  A macro that wipes the nozzle. HelixScreen can run it before a print from the pre-print options.: Makro wycierające dyszę. HelixScreen może je uruchomić przed drukiem z opcji przed drukiem.
  ? A material preset sets the bed and chamber along with the nozzle; off, it heats only the nozzle. A preheat macro that handles heating sets whatever heaters it sets
  : Preset materiału ustawia stół i komorę razem z dyszą; wyłączony grzeje tylko dyszę. Makro podgrzewania, które obsługuje grzanie, ustawia te grzałki, które samo ustawia
