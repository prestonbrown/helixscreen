  The running step stops at once and the printer restarts, which also drops the results of the steps that finished.: Bieżący krok zatrzyma się natychmiast i drukarka się zrestartuje, co usunie też wyniki zakończonych kroków.
  The running step stops at once and the printer restarts.: Bieżący krok zatrzyma się natychmiast i drukarka się zrestartuje.
  The running step stops. The steps that finished keep their results.: Bieżący krok się zatrzyma. Zakończone kroki zachowają wyniki.
  The runout sensor indicates no filament is loaded. Start print anyway?: Czujnik końca filamentu wskazuje brak filamentu. Rozpocząć druk mimo to?
  The runout sensor reads empty, so the print did not start.: Czujnik końca filamentu pokazuje brak filamentu, więc druk się nie rozpoczął.
  The saved position is kept. Reconnect or restart the screen to be offered the resume again.: Zapisana pozycja zostaje zachowana. Połącz ponownie lub zrestartuj ekran, aby ponownie zobaczyć propozycję wznowienia.
  The screen will lose its connection to the printer for a few seconds.: Ekran straci połączenie z drukarką na kilka sekund.
  The sensor in this CFS unit cannot be read. Check its connection, or the unit may need service: Nie można odczytać czujnika w tej jednostce CFS. Sprawdź jego połączenie; jednostka może wymagać serwisu
  'The shell could not start: {}': 'Nie udało się uruchomić powłoki: {}'
