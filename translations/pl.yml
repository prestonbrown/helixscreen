  HelixScreen Macros: Makra HelixScreen
  ? HelixScreen adds [include helix-plr/*.cfg] to printer.cfg, so a resume reloads the mesh the print started with. A backup is kept beside printer.cfg, and Klipper must restart for it to take effect.
  : HelixScreen dodaje [include helix-plr/*.cfg] do printer.cfg, aby wznowienie wczytywało siatkę, z którą zaczął się druk. Kopia zapasowa jest obok printer.cfg, a zmiana działa po restarcie Klippera.
