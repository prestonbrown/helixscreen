  : To zainstaluje makra pomocnicze HelixScreen na drukarce i doda je do printer.cfg. Trwa wydruk, więc Klipper zrestartuje się po jego zakończeniu.
  This installs the HelixScreen helper macros on the printer, adds them to printer.cfg, and restarts Klipper.: To zainstaluje makra pomocnicze HelixScreen na drukarce, doda je do printer.cfg i zrestartuje Klippera.
