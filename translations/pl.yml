  This printer fills its gates from Spoolman. HelixScreen cleared its own copy; remove the spool in Spoolman.: Ta drukarka wypełnia gate'y ze Spoolman. HelixScreen usunął swoją kopię; usuń szpulę w Spoolman.
  This printer fills its gates from Spoolman. Make color, material and spool changes in Spoolman.: Ta drukarka wypełnia gate'y ze Spoolman. Zmiany koloru, materiału i szpuli rób w Spoolman.
