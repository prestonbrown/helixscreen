  The test tower is not in the printer's config yet.: Wieży testowej nie ma jeszcze w konfiguracji drukarki.
  The thermocouple or PT100 amplifier reported a fault or a reading out of range.: Wzmacniacz termopary lub PT100 zgłosił usterkę albo odczyt poza zakresem.
