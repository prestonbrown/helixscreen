  This printer's gantry drops when the power is cut, so a print can't be resumed.: Brama tej drukarki opada po odcięciu zasilania, więc nie można wznowić wydruku.
  This printer's homing override homes Z along with X and Y, so a print can't be resumed.: Nadpisanie bazowania tej drukarki bazuje Z razem z X i Y, więc nie można wznowić wydruku.
  This printer's homing override sets the Z position when it homes X and Y, so a print can't be resumed.: Nadpisanie bazowania tej drukarki ustawia pozycję Z przy bazowaniu X i Y, więc nie można wznowić wydruku.
  This printer's homing override runs commands that may move Z, so a print can't be resumed.: Nadpisanie bazowania tej drukarki wykonuje polecenia, które mogą ruszyć Z, więc nie można wznowić wydruku.
