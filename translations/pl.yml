  The toolhead on the carriage is not the one the printer expected.: Głowica na wózku nie jest tą, której oczekiwała drukarka.
  ? The toolhead runs back and forth at speeds from 20 to 300 mm/s while the accelerometer measures how hard each motor shakes. It takes about {0} minutes and it is loud. The speeds that shake most are the ones to keep your outer walls away from.
  : Głowica jeździ tam i z powrotem z prędkościami od 20 do 300 mm/s, a akcelerometr mierzy, jak mocno drga każdy silnik. Trwa to około {0} minut i jest głośne. Prędkości z największymi drganiami to te, których należy unikać dla ścian zewnętrznych.
  The toolhead sensor indicates filament is already loaded. Proceed with load anyway?: Czujnik głowicy wskazuje, że filament jest już załadowany. Mimo to kontynuować ładowanie?
  The toolhead sensor indicates no filament is present. Proceed with unload anyway?: Czujnik głowicy wskazuje brak filamentu. Mimo to kontynuować rozładowanie?
  The toolhead sensor went empty, and no other lane holds the same type and color, or backup is off.: Czujnik głowicy pokazuje brak filamentu, a żaden inny tor nie ma tego samego typu i koloru albo zapas jest wyłączony.
  The toolhead this lane loads into: Głowica, do której ładuje ten tor
