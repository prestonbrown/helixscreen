  : To zbierze informacje o systemie, logi, ustawienia i dane drukarki, aby pomóc zdiagnozować problemy. Hasła ani dane wrażliwe nie zostaną dołączone.
  This will immediately halt all printer operations. The printer will require a restart to resume.: To natychmiast zatrzyma wszystkie operacje drukarki. Do wznowienia drukarka będzie wymagać restartu.
