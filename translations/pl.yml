  Clear the plate and load {}. The firmware prints its tower in the middle of the bed while it sweeps {}.: Opróżnij płytę i załaduj {}. Firmware drukuje wieżę na środku stołu, zmieniając {}.
  Clear the plate and load {}. The tower prints in the middle of the bed.: Opróżnij płytę i załaduj {}. Wieża drukuje się na środku stołu.
