  Clean the docks and the pogo pins, then reset the maintenance counter.: Wyczyść doki i piny pogo, potem wyzeruj licznik konserwacji.
  Clean the nozzle and the calibration target, check the belts, then rerun the calibration.: Wyczyść dyszę i cel kalibracji, sprawdź paski, potem powtórz kalibrację.
  Clean the nozzle and the calibration target, then home again. If it repeats, run the home-origin calibration.: Wyczyść dyszę i cel kalibracji, potem zbazuj ponownie. Jeśli się powtarza, uruchom kalibrację pozycji początkowej.
  Clean the nozzle and the plate, check nothing touches the nozzle, then retry.: Wyczyść dyszę i płytę, sprawdź, czy nic nie dotyka dyszy, potem ponów.
  Clean the nozzle tip and the build plate, then run the calibration again.: Wyczyść czubek dyszy i płytę roboczą, potem uruchom kalibrację ponownie.
  Clean the nozzle, then resume.: Wyczyść dyszę, potem wznów.
  Clean the nozzle, tighten the probe mount, lower the probing speed, or allow more retries (samples_tolerance_retries).: Wyczyść dyszę, dokręć mocowanie sondy, zmniejsz prędkość pomiaru albo zezwól na więcej powtórzeń (samples_tolerance_retries).
  Clean the plate and run a new bed mesh, or let ZMOD measure before each print (SAVE_ZMOD_DATA MESH_TEST).: Wyczyść płytę i zmierz nową siatkę stołu albo pozwól ZMOD mierzyć przed każdym drukiem (SAVE_ZMOD_DATA MESH_TEST).
  Clean the pogo pins on the toolhead and the carriage, seat the toolhead again, then retry.: Wyczyść piny pogo na głowicy i karetce, osadź głowicę ponownie, potem ponów.
