  The HelixPrint plugin has to come from your printer's firmware, which manages HelixScreen's software.: Wtyczka HelixPrint musi pochodzić z firmware drukarki, które zarządza oprogramowaniem HelixScreen.
  The HelixPrint plugin is managed by your printer's firmware.: Wtyczką HelixPrint zarządza firmware drukarki.
  The IFS state file can't be read.: Nie można odczytać pliku stanu IFS.
  The Moonraker timelapse plugin is installed. Set how it records in the timelapse settings.: Wtyczka timelapse Moonrakera jest zainstalowana. Ustaw sposób nagrywania w ustawieniach timelapse.
  The PEI sheet is still on the bed. Take it off, then tap Next.: Płyta PEI jest nadal na stole. Zdejmij ją, potem dotknij Dalej.
  The Spoolman spool currently loaded: Aktualnie załadowana szpula Spoolman
  ? The animated screensaver has been turned off on this device to prevent it from interfering with prints. You can re-enable it in Settings > Display.
  : Animowany wygaszacz został wyłączony na tym urządzeniu, aby nie zakłócał wydruków. Możesz go włączyć ponownie w Ustawienia > Wyświetlacz.
  The bed and nozzle heat together before anything moves, so the print re-grips and the nozzle lets go of it.: Stół i dysza grzeją się razem przed jakimkolwiek ruchem, więc wydruk ponownie przywiera, a dysza go puszcza.
  The bed has cooled. Take the spools off the plate, then confirm.: Stół ostygł. Zdejmij szpule z płyty, potem potwierdź.
  The bed is too small for settling laps.: Stół jest za mały na okrążenia układania.
  The bed heater. Set its temperature and watch its graph on the bed temperature screen.: Grzałka stołu. Ustaw jej temperaturę i obserwuj wykres na ekranie temperatury stołu.
  The bed is too small for the test tower, or its size is unknown.: Stół jest za mały na wieżę testową albo jego rozmiar jest nieznany.
  The bed turns off. The spools stay latched on the bed until you confirm they are off.: Stół się wyłącza. Szpule pozostają zatrzaśnięte na stole, dopóki nie potwierdzisz, że są zdjęte.
  The bed was reported dirty, so this print cannot resume.: Stół zgłoszono jako brudny, więc ten wydruk nie może być wznowiony.
  The buffer may be disconnected, stuck, or faulty. Check it before retrying: Bufor może być odłączony, zablokowany lub uszkodzony. Sprawdź go przed ponowną próbą
  The buffer saw no movement for 16 seconds. Check for a blockage between the CFS and the extruder, or a stuck buffer: Bufor nie wykrył ruchu przez 16 sekund. Sprawdź, czy nie ma blokady między CFS a ekstruderem albo zablokowanego bufora
  ? The camera thought it saw something on the bed, so the printer stopped before printing. If the bed is clear, it was a false alarm.
  : Kamera uznała, że coś leży na stole, więc drukarka zatrzymała się przed drukiem. Jeśli stół jest pusty, był to fałszywy alarm.
  'The carriage was not put back: check which tool is mounted': 'Wózek nie został odstawiony: sprawdź, które narzędzie jest zamontowane'
  The chamber heater can run a filament drying cycle. Start one from the drying dialog.: Grzałka komory może wykonać cykl suszenia filamentu. Uruchom go z okna suszenia.
  The chamber temperature is too high. This may cause extruder clogging. Continue printing?: Temperatura komory jest za wysoka. Może to zatkać ekstruder. Kontynuować druk?
  The chamber wait already ended; nothing was stopped.: Oczekiwanie na komorę już się zakończyło; nic nie zatrzymano.
  ? The change takes effect after Klipper restarts. This will restart Klipper firmware. Any active operations will be interrupted.
  : Zmiana zadziała po restarcie Klippera. Firmware Klipper zostanie zrestartowany. Trwające operacje zostaną przerwane.
  The connection to Klipper was lost: Utracono połączenie z Klipperem
  The controller boards Klipper runs on. See their load in the system settings.: Płyty sterujące, na których działa Klipper. Ich obciążenie zobaczysz w ustawieniach systemu.
  The cutter blade didn't return — check for filament wrapped around the cutting mechanism: Ostrze obcinaka nie wróciło — sprawdź, czy filament nie owinął się wokół mechanizmu cięcia
  The cutter is out of alignment — recalibrate with CALIBRATE_CUT_POS: Obcinak jest rozkalibrowany — skalibruj ponownie poleceniem CALIBRATE_CUT_POS
  ? The exact stopping point could not be found. The print resumes at the start of the next layer and skips the rest of this one.
  : Nie udało się ustalić dokładnego miejsca zatrzymania. Wydruk wznowi się od początku następnej warstwy, pomijając resztę bieżącej.
  The extruder cannot pull it smoothly. Check the spool for a tangle or knot, and the PTFE tube for a severe bend: Ekstruder nie może go płynnie wciągać. Sprawdź, czy szpula nie jest splątana lub zasupłana, a rurka PTFE mocno zagięta
  ? The filament did not reach the nozzle. The CFS reported no error, but the toolhead sensor still sees no filament. Check that the spool is seated and the path is clear, then try again.
  : Filament nie dotarł do dyszy. CFS nie zgłosił błędu, ale czujnik głowicy nadal nie widzi filamentu. Sprawdź, czy szpula jest osadzona i ścieżka drożna, potem spróbuj ponownie.
  The filament may not have fully retracted — try again or manually pull: Filament mógł nie zostać w pełni cofnięty — spróbuj ponownie lub wyciągnij ręcznie
  The filament system needs attention: System filamentu wymaga uwagi
  The filament system reported an error: System filamentu zgłosił błąd
  The gap didn't close (moved {:.1f} Hz). Try a bigger turn.: Różnica się nie zmniejszyła (przesunięcie {:.1f} Hz). Spróbuj większego obrotu.
  The gap grew after loosening {0}. Check you turned {0}'s tensioner.: Różnica wzrosła po poluzowaniu {0}. Sprawdź, czy kręcisz napinaczem {0}.
  The gap grew after tightening {0}. Check you turned {0}'s tensioner.: Różnica wzrosła po dokręceniu {0}. Sprawdź, czy kręcisz napinaczem {0}.
  The gap is not closing. Something besides tension may be shaping it.: Różnica się nie zmniejsza. Coś poza napięciem może na nią wpływać.
  The heated bed and enclosure can dry spools placed on the bed. Start a cycle from the bed drying dialog.: Podgrzewany stół i obudowa mogą suszyć szpule położone na stole. Uruchom cykl z okna suszenia na stole.
  The heater can't be changed while the printer is waiting.: Nie można zmienić grzałki, gdy drukarka czeka.
  The heater did not accept the printer's credentials.: Grzałka nie przyjęła danych uwierzytelniających drukarki.
  The heater didn't accept the command.: Grzałka nie przyjęła polecenia.
  The heater hasn't answered yet. Still trying.: Grzałka jeszcze nie odpowiedziała. Nadal próbuję.
  The heater is inhibited.: Grzałka jest zablokowana.
  The heater reports a fault.: Grzałka zgłasza usterkę.
  'The heater reports a fault: {}.': 'Grzałka zgłasza usterkę: {}.'
  The heater took the target.: Grzałka przyjęła temperaturę docelową.
  The heater was turned off at the heater.: Grzałka została wyłączona na samej grzałce.
  The heater will cycle on and off several times.: Grzałka będzie się kilka razy włączać i wyłączać.
  The helper macros are installed and activate after Klipper restarts.: Makra pomocnicze są zainstalowane i zadziałają po restarcie Klippera.
  The lane forgets this spool. The filament itself stays where it is.: Tor zapomina tę szpulę. Sam filament zostaje na miejscu.
  The lane settings weren't changed, and the spool wasn't saved. Press Save to save the spool.: Ustawień toru nie zmieniono, a szpuli nie zapisano. Naciśnij Zapisz, aby zapisać szpulę.
  The lane settings weren't changed.: Ustawień toru nie zmieniono.
  The lane that takes over when this one runs out: Tor, który przejmuje druk, gdy ten się skończy
  The latch opens and {} can drop. Hold it before you continue, then put it in its dock.: Zatrzask się otworzy i {} może spaść. Przytrzymaj ją, zanim przejdziesz dalej, potem odłóż do doku.
  The left RFID reader in this CFS unit may need service: Lewy czytnik RFID w tej jednostce CFS może wymagać serwisu
  The linked spool says {}.: Powiązana szpula to {}.
  The loaded slot is not known yet: Załadowany slot nie jest jeszcze znany
  ? The loaded spool is {}, but this file was sliced for {}. Filled filament runs at a lower flow rate and needs a hardened nozzle.
  : Załadowana szpula to {}, a plik pokrojono dla {}. Filament z wypełniaczem drukuje się z mniejszym przepływem i wymaga utwardzonej dyszy.
  The message your printer's macros show (M117): Komunikat wyświetlany przez makra drukarki (M117)
  The nozzle extrudes a few short test moves in a corner, away from the print area, and repeats until it agrees with itself.: Dysza wykonuje kilka krótkich ruchów testowych w rogu, z dala od obszaru druku, i powtarza je, aż wyniki będą zgodne.
  The nozzle hasn't moved since the power went out. Check that it sits just above the top of the print, then resume.: Dysza nie ruszyła się od zaniku zasilania. Sprawdź, czy jest tuż nad górą wydruku, potem wznów.
  The nozzle is clear of the print: Dysza jest z dala od wydruku
  ? The nozzle is hot. Brush it clean with the wire brush that came with the printer and keep the docking position clean, then tap Next.
  : Dysza jest gorąca. Oczyść ją drucianą szczotką dołączoną do drukarki i utrzymuj miejsce dokowania w czystości, potem dotknij Dalej.
  The nozzle is lifted clear of the print and X and Y are homed. Resuming lowers it back to the height it stopped at.: Dysza jest uniesiona nad wydrukiem, a X i Y są zbazowane. Wznowienie opuści ją do wysokości, na której się zatrzymała.
  The part on the bed is too tall to clear. Remove it, then tap Cleared.: Część na stole jest za wysoka, by ją ominąć. Zdejmij ją, potem dotknij Usunięto.
  ? The peak of {0} left the zone. Check that only {1}'s tensioner was turned. Not sure which is which? Tap the pencil to identify the belts.
  : Szczyt {0} wyszedł poza strefę. Sprawdź, czy kręcono tylko napinaczem {1}. Nie wiesz, który jest który? Dotknij ołówka, aby rozpoznać pasy.
  The peak of {} moved out of the zone. Widening it.: Szczyt {} wyszedł poza strefę. Poszerzam ją.
  The plate and the spools are still hot. Use gloves.: Płyta i szpule są nadal gorące. Użyj rękawic.
  The plate finishes its current move, but drying will not start.: Płyta dokończy bieżący ruch, ale suszenie się nie rozpocznie.
  The plugin can't reach the camera, so this screen takes the photos.: Wtyczka nie ma dostępu do kamery, więc zdjęcia robi ten ekran.
  The plugin can't save its recovery data to disk.: Wtyczka nie może zapisać danych odzyskiwania na dysk.
  The plugin is turned off in moonraker.conf.: Wtyczka jest wyłączona w moonraker.conf.
  The print ended before any layer was printed. Nothing was changed.: Wydruk zakończył się przed wydrukowaniem jakiejkolwiek warstwy. Nic nie zmieniono.
  The print is canceled and you pick the best band from what has printed so far.: Wydruk zostanie anulowany, a ty wybierzesz najlepsze pasmo z tego, co już się wydrukowało.
  The print is on its last layer.: Wydruk jest na ostatniej warstwie.
  ? The print is paused. Changing tools now moves the toolhead and swaps the filament at the nozzle. Resume the print once the change finishes.
  : Wydruk jest wstrzymany. Zmiana narzędzia teraz przesunie głowicę i wymieni filament w dyszy. Wznów wydruk po zakończeniu zmiany.
  The print is still stuck to the bed: Wydruk jest nadal przyklejony do stołu
  The print is waiting for the chamber, but the heater is not heating.: Wydruk czeka na komorę, ale grzałka nie grzeje.
  The printable size in millimeters (X × Y × Z), from the axis limits in the printer's Klipper config.: Obszar roboczy w milimetrach (X × Y × Z), z limitów osi w konfiguracji Klippera drukarki.
  The printer applied this value and keeps it for this tool.: Drukarka zastosowała tę wartość i zachowuje ją dla tego narzędzia.
  The printer can draw a priming line before a print. HelixScreen offers it in the pre-print options.: Drukarka może narysować linię wstępną przed drukiem. HelixScreen oferuje to w opcjach przed drukiem.
  The printer can measure each tool's offset automatically. Run it on the tool offset calibration screen.: Drukarka może automatycznie zmierzyć offset każdego narzędzia. Uruchom to na ekranie kalibracji offsetów narzędzi.
  The printer can measure pressure advance on its own. Run it on the PA calibration screen.: Drukarka może sama zmierzyć pressure advance. Uruchom to na ekranie kalibracji PA.
  The printer can pause at a chosen layer, for a filament swap or an insert. Set the layer from the print preview.: Drukarka może zatrzymać się na wybranej warstwie, aby wymienić filament lub włożyć wkładkę. Ustaw warstwę w podglądzie wydruku.
  The printer could not work out where to resume.: Drukarka nie ustaliła, skąd wznowić.
  The printer did not change its bed check: Drukarka nie zmieniła sprawdzania stołu
  'The printer did not change its bed check: {}': 'Drukarka nie zmieniła sprawdzania stołu: {}'
  'The printer did not confirm the print started ({}). It may still start: check the printer before starting it again.': 'Drukarka nie potwierdziła rozpoczęcia druku ({}). Może jeszcze wystartować: sprawdź drukarkę, zanim uruchomisz go ponownie.'
  The printer did not reset the filter: Drukarka nie zresetowała filtra
  The printer extrudes in a corner and repeats until the readings agree. You do not judge anything by eye.: Drukarka wytłacza w rogu i powtarza, aż odczyty będą zgodne. Niczego nie oceniasz na oko.
  The printer finishes this measurement on its own.: Drukarka sama dokończy ten pomiar.
  The printer halted this print and cannot resume it. Restart from the beginning?: Drukarka przerwała ten wydruk i nie może go wznowić. Zacząć od początku?
  The printer has not answered the cancel yet. It stops once its start sequence finishes.: Drukarka jeszcze nie odpowiedziała na anulowanie. Zatrzyma się po zakończeniu sekwencji startowej.
  The printer has not reported its axis limits yet.: Drukarka nie podała jeszcze limitów osi.
  The printer has not reported its maximum velocity yet.: Drukarka nie podała jeszcze maksymalnej prędkości.
  ? The printer heats the nozzle, extrudes a few short test moves in a corner of the plate, and measures them itself. It repeats until the readings agree, then reports one number.
  : Drukarka grzeje dyszę, wykonuje kilka krótkich ruchów testowych w rogu płyty i sama je mierzy. Powtarza, aż odczyty będą zgodne, potem podaje jedną liczbę.
  The printer homes and sweeps the cutter (about 1 minute). Keep the filament path clear.: Drukarka bazuje i przemiata obcinak (około 1 minuty). Utrzymuj ścieżkę filamentu drożną.
  ? The printer homes, then moves the plate as far from the nozzle as it goes. Some spools are not heat-resistant enough and can deform. Nothing moves from this screen until you confirm the spools are off the bed; Mainsail, macros and prints sent from a slicer are not blocked.
  : Drukarka bazuje, potem odsuwa płytę maksymalnie od dyszy. Niektóre szpule nie są wystarczająco odporne na ciepło i mogą się odkształcić. Z tego ekranu nic się nie poruszy, dopóki nie potwierdzisz, że szpule są zdjęte ze stołu; Mainsail, makra i wydruki wysłane ze slicera nie są blokowane.
  The printer homes, then probes each screw position.: Drukarka bazuje, potem mierzy każdą pozycję śruby.
  The printer is not homed. Continuing will home all axes, moving the toolhead. Make sure the bed is clear.: Drukarka nie jest zbazowana. Kontynuacja zbazuje wszystkie osie, poruszając głowicą. Upewnij się, że stół jest pusty.
  The printer is not ready.: Drukarka nie jest gotowa.
  The printer is shut down.: Drukarka jest wyłączona.
  ? The printer is waiting for the chamber to reach a temperature, and only an emergency stop and a firmware restart end that wait. The print stops at once and cannot be resumed.
  : Drukarka czeka, aż komora osiągnie temperaturę, a to oczekiwanie kończy tylko zatrzymanie awaryjne i restart firmware. Wydruk zatrzyma się natychmiast i nie będzie można go wznowić.
  The printer isn't detecting that any filament is currently loaded. What would you like to do?: Drukarka nie wykrywa załadowanego filamentu. Co chcesz zrobić?
  The printer kept printing after the cancel.: Drukarka drukowała dalej po anulowaniu.
  The printer lost power during a print. It can resume where it left off.: Drukarka straciła zasilanie podczas druku. Może wznowić od miejsca przerwania.
  The printer lost power during a print. The resumed layer may not line up exactly.: Drukarka straciła zasilanie podczas druku. Wznowiona warstwa może nie pasować idealnie.
  The printer lost power while printing {}. Resume where it left off?: Drukarka straciła zasilanie podczas drukowania {}. Wznowić od miejsca przerwania?
  The printer lost power while printing {}. The resumed layer may not line up exactly.: Drukarka straciła zasilanie podczas drukowania {}. Wznowiona warstwa może nie pasować idealnie.
  The printer moves the toolhead and measures its motors.: Drukarka porusza głowicą i mierzy jej silniki.
  The printer no longer has a print to resume.: Drukarka nie ma już wydruku do wznowienia.
  The printer reads the file up to the last saved position. A large file can take a minute.: Drukarka czyta plik do ostatniej zapisanej pozycji. Duży plik może zająć minutę.
  The printer records lane {} in the toolhead, not this one: Drukarka zapisuje w głowicy tor {}, nie ten
  'The printer refused that port: check the port (Moonraker is usually 7125).': 'Drukarka odrzuciła ten port: sprawdź port (Moonraker zwykle 7125).'
  The printer rejected the filament configuration. The print was not started.: Drukarka odrzuciła konfigurację filamentu. Wydruku nie rozpoczęto.
  The printer reports measured fan speeds. HelixScreen shows them on the Fans screen.: Drukarka zgłasza zmierzone prędkości wentylatorów. HelixScreen pokazuje je na ekranie Wentylatory.
  The printer reports no lane record, so only clearing the extruder can unload it.: Drukarka nie zgłasza zapisu torów, więc rozładować można tylko czyszcząc ekstruder.
  'The printer requires an encrypted connection, but it rejected the encrypted job: HTTP {} {}': 'Drukarka wymaga szyfrowanego połączenia, ale odrzuciła zaszyfrowane zadanie: HTTP {} {}'
  The printer requires an encrypted connection, but the encrypted connection to {}:{} failed: Drukarka wymaga szyfrowanego połączenia, ale szyfrowane połączenie z {}:{} nie powiodło się
  ? The printer restarts with the Snapmaker screen, and HelixScreen no longer starts. Your HelixScreen settings stay on the printer; run the installer again to come back.
  : Drukarka uruchomi się z ekranem Snapmakera, a HelixScreen nie będzie startować. Ustawienia HelixScreen zostają na drukarce; uruchom instalator ponownie, aby wrócić.
  The printer swaps between several toolheads. Manage the tools on the filament system screen.: Drukarka przełącza się między kilkoma głowicami. Zarządzaj narzędziami na ekranie systemu filamentu.
  The printer's firmware chooses where to switch on runout: Firmware drukarki wybiera, na co przełączyć po skończeniu filamentu
  The requested position is outside the printer's bounds: Żądana pozycja jest poza zakresem drukarki
  The right RFID reader in this CFS unit may need service: Prawy czytnik RFID w tej jednostce CFS może wymagać serwisu
  The runout sensor indicates no filament is loaded. Start print anyway?: Czujnik końca filamentu wskazuje brak filamentu. Rozpocząć druk mimo to?
  The saved position is kept. Reconnect or restart the screen to be offered the resume again.: Zapisana pozycja zostaje zachowana. Połącz ponownie lub zrestartuj ekran, aby ponownie zobaczyć propozycję wznowienia.
  The screen will lose its connection to the printer for a few seconds.: Ekran straci połączenie z drukarką na kilka sekund.
  The sensor in this CFS unit cannot be read. Check its connection, or the unit may need service: Nie można odczytać czujnika w tej jednostce CFS. Sprawdź jego połączenie; jednostka może wymagać serwisu
  The speed of one fan you choose: Prędkość wybranego wentylatora
  The time, date, and system uptime: Godzina, data i czas pracy systemu
  The timelapse or logs folder overlaps a protected folder, so cleanup is off.: Folder timelapse lub logów pokrywa się z folderem chronionym, więc czyszczenie jest wyłączone.
  Timelapse frames start after Klipper restarts.: Klatki timelapse zaczną się po restarcie Klippera.
  Timelapse or logs folder overlaps a protected one.: Folder timelapse lub logów pokrywa się z chronionym.
  The timelapse plugin is installed. Making videos also needs ffmpeg, which is not installed on this printer.: Wtyczka timelapse jest zainstalowana. Do tworzenia filmów potrzebny jest też ffmpeg, którego nie ma na tej drukarce.
  The tool change under way finished, and the tool was not parked: Trwająca zmiana narzędzia się zakończyła, a narzędzie nie zostało odstawione
  The tool change under way finished, and {} was not put back on the carriage: Trwająca zmiana narzędzia się zakończyła, a {} nie wróciło na wózek
  The toolhead has filament but no AMS slot reports it loaded. Pull it out manually before printing. Start anyway?: Głowica ma filament, ale żaden slot AMS nie zgłasza go jako załadowanego. Wyciągnij go ręcznie przed drukiem. Rozpocząć mimo to?
  ? The toolhead has filament but no AMS slot reports it loaded. The printer may refuse to load a slot until it is cleared. Start anyway?
  : Głowica ma filament, ale żaden slot AMS nie zgłasza go jako załadowanego. Drukarka może odmówić załadowania slotu, dopóki go nie usuniesz. Rozpocząć mimo to?
  The toolhead is not homed, so this would home into the print: Głowica nie jest zbazowana, więc bazowanie uderzyłoby w wydruk
  The toolhead may still be at the chute. Move it away before printing.: Głowica może być nadal przy zsypie. Odsuń ją przed drukiem.
  The toolhead sensor indicates filament is already loaded. Proceed with load anyway?: Czujnik głowicy wskazuje, że filament jest już załadowany. Mimo to kontynuować ładowanie?
  The toolhead sensor indicates no filament is present. Proceed with unload anyway?: Czujnik głowicy wskazuje brak filamentu. Mimo to kontynuować rozładowanie?
  The toolhead this lane loads into: Głowica, do której ładuje ten tor
  The top cover has been disconnected. To ensure print quality, reconnect the top cover before continuing.: Górna pokrywa została odłączona. Aby zapewnić jakość druku, podłącz ją ponownie przed kontynuacją.
  The unit is already running another operation. Wait for it to finish, or reset the CFS if it stays stuck: Jednostka wykonuje już inną operację. Poczekaj, aż skończy, albo zresetuj CFS, jeśli się zawiesi
  The unit reported a fault with no further detail. Restart the printer if it repeats: Jednostka zgłosiła usterkę bez szczegółów. Jeśli się powtórzy, uruchom ponownie drukarkę
  The unit's onboard storage has failed. The CFS mainboard needs replacing: Pamięć wewnętrzna jednostki uległa awarii. Płyta główna CFS wymaga wymiany
  'The unload did not start: unload by hand, then start again': 'Rozładowanie się nie rozpoczęło: rozładuj ręcznie, potem zacznij ponownie'
  The unload finishes on its own, but the plate will not move.: Rozładowanie zakończy się samo, ale płyta się nie ruszy.
  Theme: Motyw
  Theme Colors: Kolory motywu
  Theme Preset: Ustawienie motywu
  Theme changes apply after restart.: Zmiany motywu zadziałają po restarcie.
  Theme reset to defaults: Przywrócono domyślny motyw
