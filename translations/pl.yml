  : Makro startowe tej drukarki ustawia offset Z dla każdego materiału, więc zapisanie go w sondzie zastosowałoby go dwukrotnie. Włącz Ustawienia > Drukowanie > Offset Z według materiału, aby zapisać go dla materiału wydruku.
  This printer's travel or settings cannot hold the test moves.: Zakres ruchu lub ustawienia tej drukarki nie pozwalają na ruchy testowe.
  ? This removes the plugin's Moonraker component and restarts Moonraker. The printer will briefly disconnect. If old phase-tracking lines are still in PRINT_START, they are removed too, with backups kept. A Klipper restart applies that.
