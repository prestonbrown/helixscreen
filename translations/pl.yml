  ? 'Klipper does not know the setting ''{1}'' in section [{2}]: a typo, an option renamed in a Klipper update, or an option from another firmware.'
  : 'Klipper nie zna ustawienia „{1}” w sekcji [{2}]: literówka, opcja przemianowana w aktualizacji Klippera albo opcja z innego firmware.'
