  'Klipper could not load a module the configuration asks for: a plugin that is not installed, or a section defined twice.': 'Klipper nie wczytał modułu, którego wymaga konfiguracja: niezainstalowana wtyczka albo sekcja zdefiniowana dwa razy.'
  Klipper could not load its configuration. Fix the setting below in the printer's config files, then restart Klipper.: Klipper nie wczytał konfiguracji. Popraw poniższe ustawienie w plikach konfiguracji drukarki, potem uruchom ponownie Klippera.
