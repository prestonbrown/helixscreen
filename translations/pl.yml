  'The {1} motor skipped steps or stalled: the toolhead hit the print, or a belt slipped.': 'Silnik {1} zgubił kroki lub utknął: głowica uderzyła w wydruk albo pas się ześlizgnął.'
  The {1} sensor read {2} °C, outside its allowed range of {3} to {4} °C, so the firmware stopped every heater to be safe.: Czujnik {1} odczytał {2} °C, poza dozwolonym zakresem od {3} do {4} °C, więc firmware dla bezpieczeństwa wyłączyło wszystkie grzałki.
  Theme: Motyw
  Theme Colors: Kolory motywu
