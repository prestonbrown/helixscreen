  ? This removes the plugin's Moonraker component and restarts Moonraker. The printer will briefly disconnect. If old phase-tracking lines are still in PRINT_START, they are removed too, with backups kept. A Klipper restart applies that.
  : To usunie komponent Moonrakera wtyczki i zrestartuje Moonrakera. Drukarka na chwilę się rozłączy. Jeśli w PRINT_START są jeszcze stare linie śledzenia faz, też zostaną usunięte, z zachowaniem kopii zapasowych. Zadziała to po restarcie Klippera.
  This replaces the printer's helper macros with the current version and restarts Klipper.: To zastąpi makra pomocnicze drukarki bieżącą wersją i zrestartuje Klippera.
