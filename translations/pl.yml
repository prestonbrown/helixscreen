  Clear the bed and the nozzle, then restart the firmware.: Opróżnij stół i dyszę, potem uruchom ponownie firmware.
  Clear the bed and the nozzle, then try again.: Opróżnij stół i dyszę, potem spróbuj ponownie.
  Clear the clog in head T{1} (a cold pull works), then resume.: Usuń zator w głowicy T{1} (pomaga zimne wyciąganie), potem wznów.
