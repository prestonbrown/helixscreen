  Thanks! Anonymous usage data helps improve HelixScreen.: Dziękujemy! Anonimowe dane użycia pomagają ulepszać HelixScreen.
  That file command cannot run here.: Tego polecenia pliku nie można tu wykonać.
  That print is no longer paused: Ten wydruk nie jest już wstrzymany
  That reading jumped too far to trust. Re-measure without turning.: Ten odczyt skoczył za mocno, by mu ufać. Zmierz ponownie bez kręcenia.
  That setting cannot be changed while a print is running: Tego ustawienia nie można zmienić podczas druku
  That slot cannot stand in for this one: Ten slot nie może zastąpić tego
  That tool is already loaded: To narzędzie jest już załadowane
  That toolhead can no longer take over the print: Ta głowica nie może już przejąć wydruku
  That turn didn't register yet. Loosen {0} a little more.: Ten obrót jeszcze nie został wykryty. Poluzuj {0} trochę bardziej.
  That turn didn't register yet. Loosen {0} one more full turn.: Ten obrót jeszcze nie został wykryty. Poluzuj {0} o jeszcze jeden pełny obrót.
  That turn didn't register yet. Tighten {0} a little more.: Ten obrót jeszcze nie został wykryty. Dokręć {0} trochę bardziej.
  That turn didn't register yet. Tighten {0} one more full turn.: Ten obrót jeszcze nie został wykryty. Dokręć {0} o jeszcze jeden pełny obrót.
  The ACE pushes the loaded filament along with the extruder. The driver turns Feed Assist on after a load: ACE pcha załadowany filament razem z ekstruderem. Sterownik włącza Feed Assist po załadowaniu
  The ACE state can't be read.: Nie można odczytać stanu ACE.
  ? 'The BLTouch pin did not report the state the firmware expected: a bent or stuck pin, a self-test fault (blinking red), loose wiring, or a clone that needs its touch-mode options.'
  : 'Pin BLTouch nie zgłosił stanu oczekiwanego przez firmware: wygięty lub zablokowany pin, błąd autotestu (miga na czerwono), luźne okablowanie albo klon wymagający opcji trybu touch.'
  The Box dryer is not heating: Suszarka Boxa nie grzeje
  The Box's filament state is wrong: Stan filamentu w Boxie jest błędny
  'The Box''s motion sensor saw no movement while feeding: the spool is tangled or wound over itself.': 'Czujnik ruchu Boxa nie wykrył ruchu podczas podawania: szpula jest splątana lub nawinięta na siebie.'
  The Box's self-check failed: Autotest Boxa nieudany
  The CFS odometer hardware is faulty and needs repair or replacement: Licznik drogi CFS jest uszkodzony i wymaga naprawy lub wymiany
  The CFS ran out of filament in {}. Printing continues on what is left in the tube.: W CFS skończył się filament w {}. Druk trwa dalej na tym, co zostało w rurce.
  The CFS ran out of filament. Printing continues on what is left in the tube.: W CFS skończył się filament. Druk trwa dalej na tym, co zostało w rurce.
  The DNS server is not a valid address.: Serwer DNS nie jest prawidłowym adresem.
  ? The HelixPrint plugin enables fast G-code modifications directly on your printer—like skipping bed mesh for quick reprints.
  : Wtyczka HelixPrint pozwala szybko modyfikować G-code bezpośrednio na drukarce — np. pominąć siatkę stołu przy szybkich powtórkach.
  The HelixPrint plugin has to come from your printer's firmware, which manages HelixScreen's software.: Wtyczka HelixPrint musi pochodzić z firmware drukarki, które zarządza oprogramowaniem HelixScreen.
  The HelixPrint plugin is managed by your printer's firmware.: Wtyczką HelixPrint zarządza firmware drukarki.
  The HelixPrint plugin moves old PRINT_START calls to the hidden names.: Wtyczka HelixPrint przenosi stare wywołania PRINT_START na ukryte nazwy.
  'The IFS board did not reply in time: a cable problem, a board that hung, or the native screen using the same port.': 'Płyta IFS nie odpowiedziała na czas: problem z kablem, zawieszona płyta albo natywny ekran używający tego samego portu.'
  The IFS board reported a driver error on every retry.: Płyta IFS zgłosiła błąd sterownika przy każdej próbie.
  The IFS did not answer: IFS nie odpowiedział
  The IFS did not finish moving filament: IFS nie dokończył przesuwania filamentu
  ? 'The IFS did not reach the state it was waiting for in time, so the filament is not moving: usually a jam in that lane''s tube or at the toolhead entry.'
  : 'IFS nie osiągnął na czas oczekiwanego stanu, więc filament się nie porusza: zwykle zator w rurce tego toru lub na wejściu głowicy.'
  ? 'The IFS motion sensor saw no filament movement while printing: a tangled spool, a kinked tube, the wrong slot recorded as loaded, or old filament still in the head.'
  : 'Czujnik ruchu IFS nie wykrył ruchu filamentu podczas druku: splątana szpula, zagięta rurka, błędnie zapisany załadowany slot albo stary filament wciąż w głowicy.'
  The IFS state file can't be read.: Nie można odczytać pliku stanu IFS.
  The IP address cannot be the subnet's network or broadcast address.: Adres IP nie może być adresem sieci ani rozgłoszeniowym podsieci.
  The IP address is not a valid address.: Adres IP nie jest prawidłowym adresem.
  The Moonraker timelapse plugin is installed. Set how it records in the timelapse settings.: Wtyczka timelapse Moonrakera jest zainstalowana. Ustaw sposób nagrywania w ustawieniach timelapse.
  The PEI sheet is still on the bed. Take it off, then tap Next.: Płyta PEI jest nadal na stole. Zdejmij ją, potem dotknij Dalej.
  ? 'The QIDI Box dryer could not reach its target: an open lid, a failed heater or a cold room. Only the dryer stopped; the print goes on.'
  : 'Suszarka QIDI Box nie osiągnęła temperatury: otwarta pokrywa, uszkodzona grzałka albo zimne pomieszczenie. Zatrzymała się tylko suszarka; wydruk trwa dalej.'
  The Spoolman spool currently loaded: Aktualnie załadowana szpula Spoolman
  The Z offset paper test. Stay at the printer.: Test offsetu Z z kartką. Zostań przy drukarce.
  The accelerometer did not respond as expected, usually from a loose cable.: Akcelerometr nie odpowiedział zgodnie z oczekiwaniem, zwykle z powodu luźnego kabla.
  The accelerometer is attached: Akcelerometr jest podłączony
  The accelerometer stopped answering in the middle of a measurement.: Akcelerometr przestał odpowiadać w trakcie pomiaru.
  The active tool has no nozzle heater.: Aktywne narzędzie nie ma grzałki dyszy.
  ? The animated screensaver has been turned off on this device to prevent it from interfering with prints. You can re-enable it in Settings > Display.
  : Animowany wygaszacz został wyłączony na tym urządzeniu, aby nie zakłócał wydruków. Możesz go włączyć ponownie w Ustawienia > Wyświetlacz.
  The automatic feeding setting could not be applied.: Nie udało się zastosować ustawienia automatycznego podawania.
  ? 'The axis moved its full travel without {1} triggering: an unplugged or broken switch, a wrong pin or inverted signal, a sensorless homing threshold set too low, or a probe that did not deploy.'
  : 'Oś przejechała cały zakres bez wyzwolenia {1}: odłączony lub uszkodzony wyłącznik, zły pin lub odwrócony sygnał, za niski próg bazowania bezczujnikowego albo sonda, która się nie wysunęła.'
  The bed and nozzle heat together before anything moves, so the print re-grips and the nozzle lets go of it.: Stół i dysza grzeją się razem przed jakimkolwiek ruchem, więc wydruk ponownie przywiera, a dysza go puszcza.
  The bed check found the plate dirty or occupied.: Sprawdzenie stołu wykazało brudną lub zajętą płytę.
  The bed did not heat at the expected rate.: Stół nie grzał się w oczekiwanym tempie.
  The bed has cooled. Take the spools off the plate, then confirm.: Stół ostygł. Zdejmij szpule z płyty, potem potwierdź.
  The bed is clear: Stół jest pusty
  The bed is hot: Stół jest gorący
  The bed is not heating: Stół nie grzeje
  The bed is too far out of level for automatic compensation.: Stół jest zbyt krzywy dla automatycznej kompensacji.
  The bed is too small for settling laps.: Stół jest za mały na okrążenia układania.
  The bed heater. Set its temperature and watch its graph on the bed temperature screen.: Grzałka stołu. Ustaw jej temperaturę i obserwuj wykres na ekranie temperatury stołu.
  The bed is too small for the test tower, or its size is unknown.: Stół jest za mały na wieżę testową albo jego rozmiar jest nieznany.
  The bed mesh profile '{1}' was never saved on this printer.: Profil siatki stołu „{1}” nigdy nie został zapisany na tej drukarce.
  The bed no longer matches the saved mesh: Stół nie odpowiada już zapisanej siatce
  The bed temperature asked for is outside the allowed range.: Żądana temperatura stołu jest poza dozwolonym zakresem.
  'The bed temperature reading is out of range: its sensor is loose or damaged.': 'Odczyt temperatury stołu poza zakresem: czujnik jest luźny lub uszkodzony.'
  The bed turns off. The spools stay latched on the bed until you confirm they are off.: Stół się wyłącza. Szpule pozostają zatrzaśnięte na stole, dopóki nie potwierdzisz, że są zdjęte.
  The bed was reported dirty, so this print cannot resume.: Stół zgłoszono jako brudny, więc ten wydruk nie może być wznowiony.
  The bed's load cell read {1} g, above the {2} g limit, at Z {3}, and the printer shut down to protect itself.: Czujnik nacisku stołu odczytał {1} g, powyżej limitu {2} g, na Z {3}, i drukarka wyłączyła się dla ochrony.
  ? 'The bed''s load cell read {1} g, above the {2} g limit, at Z {3}: the nozzle is dragging on the part, a part came loose, or the print warped. The print paused.'
  : 'Czujnik nacisku stołu odczytał {1} g, powyżej limitu {2} g, na Z {3}: dysza ociera o model, część się oderwała albo wydruk się wypaczył. Wydruk wstrzymano.'
  The board rebooted by itself, usually from a dip in its power supply or a short on a fan or heater wire.: Płyta zrestartowała się sama, zwykle przez spadek napięcia zasilania albo zwarcie na przewodzie wentylatora lub grzałki.
  The buffer may be disconnected, stuck, or faulty. Check it before retrying: Bufor może być odłączony, zablokowany lub uszkodzony. Sprawdź go przed ponowną próbą
  The buffer saw no movement for 16 seconds. Check for a blockage between the CFS and the extruder, or a stuck buffer: Bufor nie wykrył ruchu przez 16 sekund. Sprawdź, czy nie ma blokady między CFS a ekstruderem albo zablokowanego bufora
  The build plate should be on the bed but reads as removed.: Płyta robocza powinna być na stole, ale jest odczytywana jako zdjęta.
  The calibration was asked for with invalid settings.: Kalibracja została zlecona z nieprawidłowymi ustawieniami.
  The camera did not confirm that timelapse recording started.: Kamera nie potwierdziła rozpoczęcia nagrywania timelapse.
  The camera saw filament stuck to the nozzle.: Kamera wykryła filament przyklejony do dyszy.
  The camera saw material where it should not be.: Kamera wykryła materiał tam, gdzie nie powinno go być.
  The camera saw the print come loose or filament extruding into the air.: Kamera wykryła, że wydruk się oderwał lub filament jest wytłaczany w powietrze.
  ? The camera thought it saw something on the bed, so the printer stopped before printing. If the bed is clear, it was a false alarm.
  : Kamera uznała, że coś leży na stole, więc drukarka zatrzymała się przed drukiem. Jeśli stół jest pusty, był to fałszywy alarm.
  'The carriage was not put back: check which tool is mounted': 'Wózek nie został odstawiony: sprawdź, które narzędzie jest zamontowane'
  The chamber did not cool down in time.: Komora nie ostygła na czas.
  The chamber heater can run a filament drying cycle. Start one from the drying dialog.: Grzałka komory może wykonać cykl suszenia filamentu. Uruchom go z okna suszenia.
  The chamber temperature is too high. This may cause extruder clogging. Continue printing?: Temperatura komory jest za wysoka. Może to zatkać ekstruder. Kontynuować druk?
  'The chamber temperature reading is out of range: its sensor is loose or damaged.': 'Odczyt temperatury komory poza zakresem: czujnik jest luźny lub uszkodzony.'
  The chamber wait already ended; nothing was stopped.: Oczekiwanie na komorę już się zakończyło; nic nie zatrzymano.
  The chamber's circulation fan is on but reads no speed.: Wentylator cyrkulacji komory jest włączony, ale nie odczytuje prędkości.
  ? The change takes effect after Klipper restarts. This will restart Klipper firmware. Any active operations will be interrupted.
  : Zmiana zadziała po restarcie Klippera. Firmware Klipper zostanie zrestartowany. Trwające operacje zostaną przerwane.
  'The change was not applied: the current settings could not be saved for a revert.': 'Zmiany nie zastosowano: nie udało się zapisać bieżących ustawień do przywrócenia.'
  ? The configuration includes or opens a file that is not there, often the include line a removed plugin left behind. Klipper's message names the file.
  : Konfiguracja dołącza lub otwiera nieistniejący plik, często linię include pozostawioną przez usuniętą wtyczkę. Komunikat Klippera podaje nazwę pliku.
  The configuration names pin '{1}', which board '{2}' does not have.: Konfiguracja wskazuje pin „{1}”, którego płyta „{2}” nie ma.
  The configuration needs a missing module: Konfiguracja wymaga brakującego modułu
  The connection to Klipper was lost: Utracono połączenie z Klipperem
  ? The controller board could not keep up with the step rate it was asked for, usually because high microsteps meet a high speed, or the host stalled.
  : Płyta sterująca nie nadążyła z żądaną częstotliwością kroków, zwykle przez wysokie mikrokroki przy dużej prędkości albo zawieszenie hosta.
  The controller boards Klipper runs on. See their load in the system settings.: Płyty sterujące, na których działa Klipper. Ich obciążenie zobaczysz w ustawieniach systemu.
  The curve draws in as the axis sweeps: Krzywa rysuje się w trakcie przemiatania osi
  The cutter blade didn't return — check for filament wrapped around the cutting mechanism: Ostrze obcinaka nie wróciło — sprawdź, czy filament nie owinął się wokół mechanizmu cięcia
  The cutter is out of alignment — recalibrate with CALIBRATE_CUT_POS: Obcinak jest rozkalibrowany — skalibruj ponownie poleceniem CALIBRATE_CUT_POS
  The drawing shown for this unit. Automatic uses what the system reports: Rysunek pokazywany dla tej jednostki. Automatycznie używa tego, co zgłasza system
  The driver for {1} got too hot, usually from a run current set too high or too little cooling over the drivers.: Sterownik {1} za bardzo się nagrzał, zwykle przez za wysoki prąd pracy albo słabe chłodzenie sterowników.
  The driver for {1} reported an error, and the firmware stopped the printer.: Sterownik {1} zgłosił błąd i firmware zatrzymało drukarkę.
  'The driver for {1} saw a short in the motor wiring: a damaged motor cable, connector or motor, or a failed driver.': 'Sterownik {1} wykrył zwarcie w okablowaniu silnika: uszkodzony kabel, złącze lub silnik albo uszkodzony sterownik.'
  ? 'The driver for {1} saw its motor power drop or reset while the board kept running: the motor power supply is off, an emergency-stop relay is open, or a power connector is loose.'
  : 'Sterownik {1} wykrył spadek lub reset zasilania silnika przy działającej płycie: zasilacz silników jest wyłączony, przekaźnik zatrzymania awaryjnego otwarty albo złącze zasilania luźne.'
  The emergency stop was pressed on a screen or in a web interface, and the printer shut down.: Naciśnięto zatrzymanie awaryjne na ekranie lub w interfejsie WWW i drukarka się wyłączyła.
  ? The exact stopping point could not be found. The print resumes at the start of the next layer and skips the rest of this one.
  : Nie udało się ustalić dokładnego miejsca zatrzymania. Wydruk wznowi się od początku następnej warstwy, pomijając resztę bieżącej.
  The extruder cannot pull it smoothly. Check the spool for a tangle or knot, and the PTFE tube for a severe bend: Ekstruder nie może go płynnie wciągać. Sprawdź, czy szpula nie jest splątana lub zasupłana, a rurka PTFE mocno zagięta
  'The extruder is pulling but the feeder is not turning: the filament is tangled or stuck between the spool and the head.': 'Ekstruder ciągnie, ale podajnik się nie obraca: filament jest splątany lub zablokowany między szpulą a głowicą.'
  The fan was turned on, but its speed sensor reads 0 RPM.: Wentylator włączono, ale jego czujnik prędkości pokazuje 0 RPM.
  The feeder could not pull the filament in.: Podajnik nie mógł wciągnąć filamentu.
  The feeder motor did not turn while pulling the filament in.: Silnik podajnika nie obracał się podczas wciągania filamentu.
  The feeder motor stalled while pushing the filament to the head.: Silnik podajnika utknął podczas pchania filamentu do głowicy.
  The feeder pushed more filament than the path holds, and it never reached the head.: Podajnik wypchnął więcej filamentu, niż mieści ścieżka, a filament nie dotarł do głowicy.
  The feeder turned, but the filament did not move with it.: Podajnik się obracał, ale filament nie przesuwał się razem z nim.
  The filament could not be pulled out of the head.: Nie udało się wyciągnąć filamentu z głowicy.
  The filament did not reach the head in time.: Filament nie dotarł do głowicy na czas.
  ? The filament did not reach the nozzle. The CFS reported no error, but the toolhead sensor still sees no filament. Check that the spool is seated and the path is clear, then try again.
  : Filament nie dotarł do dyszy. CFS nie zgłosił błędu, ale czujnik głowicy nadal nie widzi filamentu. Sprawdź, czy szpula jest osadzona i ścieżka drożna, potem spróbuj ponownie.
  The filament left the slot: Filament wyszedł ze slotu
  ? The filament may have snapped or the feed tube come loose. Clear any broken piece and seat the tube at both ends, then load the head again.
  : Filament mógł pęknąć albo rurka podająca się poluzowała. Usuń urwany kawałek, osadź rurkę na obu końcach, potem załaduj głowicę ponownie.
  The filament may not have fully retracted — try again or manually pull: Filament mógł nie zostać w pełni cofnięty — spróbuj ponownie lub wyciągnij ręcznie
  The filament ran out or slipped out of the feeder during the load.: Filament skończył się lub wysunął z podajnika podczas ładowania.
  The filament reached the nozzle, but purging it failed.: Filament dotarł do dyszy, ale płukanie nie powiodło się.
  The filament sensor reads empty.: Czujnik filamentu pokazuje brak filamentu.
  'The filament sensor saw the filament stop: the spool is empty, or the filament is not moving.': 'Czujnik filamentu wykrył zatrzymanie filamentu: szpula jest pusta albo filament się nie porusza.'
  The filament sensor still reads empty, so the firmware refused to resume.: Czujnik filamentu nadal pokazuje brak filamentu, więc firmware odmówiło wznowienia.
  The filament stopped moving on its way to the head.: Filament przestał się przesuwać w drodze do głowicy.
  The filament system needs attention: System filamentu wymaga uwagi
  The filament system reported an error: System filamentu zgłosił błąd
  The file asks for more extrusion than the head allows.: Plik wymaga większej ekstruzji, niż pozwala głowica.
  The file contains G2 and G3 arc moves, which this firmware refuses.: Plik zawiera ruchy łukowe G2 i G3, których to firmware nie obsługuje.
  The file could not be read part way through the print.: Nie udało się odczytać pliku w trakcie druku.
  The file is missing, renamed or damaged.: Plik nie istnieje, ma zmienioną nazwę lub jest uszkodzony.
  The file list could not be read from storage.: Nie udało się odczytać listy plików z pamięci.
  The file uses an arc move the printer does not support.: Plik używa ruchu łukowego nieobsługiwanego przez drukarkę.
  The file uses arc moves: Plik używa ruchów łukowych
  The file uses inches (G20).: Plik używa cali (G20).
  The file was sliced for a different nozzle size than one the print uses.: Plik pokrojono dla innego rozmiaru dyszy niż używany w wydruku.
  The file was sliced for a different nozzle type than the one installed.: Plik pokrojono dla innego typu dyszy niż zainstalowana.
  The file's checksum does not match its contents, so the upload was corrupted. The print was canceled.: Suma kontrolna pliku nie zgadza się z zawartością, więc przesyłanie zostało uszkodzone. Wydruk anulowano.
  ? The firmware could not read or write the driver for {1}. Motor power being off (UART drivers need it), a driver not seated or a wrong pin in the configuration can cause it.
  : Firmware nie mogło odczytać ani zapisać sterownika {1}. Przyczyną może być wyłączone zasilanie silników (sterowniki UART go potrzebują), nieosadzony sterownik albo zły pin w konfiguracji.
  ? The firmware's pressure advance tower needs a [pa_test] section in printer.cfg. HelixScreen adds it with a backup and restarts Klipper.
  : Wieża pressure advance firmware wymaga sekcji [pa_test] w printer.cfg. HelixScreen doda ją z kopią zapasową i zrestartuje Klippera.
  The firmware's test tower is not in the printer's config. Adding it writes one section and restarts Klipper.: Wieży testowej firmware nie ma w konfiguracji drukarki. Dodanie jej zapisze jedną sekcję i zrestartuje Klippera.
  ? The gantry needs a {1} mm correction, more than the {2} mm allowed. It is far out of level (after a crash, or sagging while powered off), or the probe points or the Z motor order are wrong.
  : Brama wymaga korekty {1} mm, więcej niż dozwolone {2} mm. Jest mocno przekrzywiona (po kolizji lub opadnięciu po wyłączeniu zasilania) albo punkty pomiaru lub kolejność silników Z są błędne.
  The gap didn't close (moved {:.1f} Hz). Try a bigger turn.: Różnica się nie zmniejszyła (przesunięcie {:.1f} Hz). Spróbuj większego obrotu.
  The gap grew after loosening {0}. Check you turned {0}'s tensioner.: Różnica wzrosła po poluzowaniu {0}. Sprawdź, czy kręcisz napinaczem {0}.
  The gap grew after tightening {0}. Check you turned {0}'s tensioner.: Różnica wzrosła po dokręceniu {0}. Sprawdź, czy kręcisz napinaczem {0}.
  The gap is not closing. Something besides tension may be shaping it.: Różnica się nie zmniejsza. Coś poza napięciem może na nią wpływać.
  The gateway cannot be the printer's own address.: Brama sieciowa nie może być adresem samej drukarki.
  The gateway cannot be the subnet's network or broadcast address.: Brama sieciowa nie może być adresem sieci ani rozgłoszeniowym podsieci.
  The gateway is not a valid address.: Brama sieciowa nie jest prawidłowym adresem.
  The gateway is not on the same subnet as the IP address.: Brama sieciowa nie jest w tej samej podsieci co adres IP.
  The head did not go back into its dock.: Głowica nie wróciła do doku.
  The head on the carriage does not read as properly picked up, so it was not parked.: Głowica na wózku nie jest odczytywana jako poprawnie pobrana, więc nie została odstawiona.
  The head to pick up does not read as docked.: Głowica do pobrania nie jest odczytywana jako zadokowana.
  ? 'The head''s extruder never gripped the filament: after several tries, with the nozzle cleaned between them, no movement registered at the nozzle.'
  : 'Ekstruder głowicy nie chwycił filamentu: po kilku próbach, z czyszczeniem dyszy pomiędzy nimi, nie wykryto ruchu przy dyszy.'
  'The head''s filament sensor sees no filament: the spool ran out, or the filament broke before the head.': 'Czujnik filamentu głowicy nie widzi filamentu: szpula się skończyła albo filament pękł przed głowicą.'
  The head's nozzle sensor gives no reading, or one outside its normal range.: Czujnik dyszy głowicy nie daje odczytu albo daje odczyt poza normalnym zakresem.
  The heated bed and enclosure can dry spools placed on the bed. Start a cycle from the bed drying dialog.: Podgrzewany stół i obudowa mogą suszyć szpule położone na stole. Uruchom cykl z okna suszenia na stole.
  The heater can't be changed while the printer is waiting.: Nie można zmienić grzałki, gdy drukarka czeka.
  The heater did not accept the printer's credentials.: Grzałka nie przyjęła danych uwierzytelniających drukarki.
  ? The heater did not warm up as fast as expected, or its temperature stayed below the target for too long. A loose heater or thermistor, a fan blowing on the heater block or a missing silicone sock can cause it.
  : Grzałka nie nagrzała się tak szybko, jak oczekiwano, albo jej temperatura zbyt długo była poniżej celu. Przyczyną może być luźna grzałka lub termistor, wentylator dmuchający na blok grzejny albo brak silikonowej skarpety.
  The heater didn't accept the command.: Grzałka nie przyjęła polecenia.
  The heater hasn't answered yet. Still trying.: Grzałka jeszcze nie odpowiedziała. Nadal próbuję.
  The heater is inhibited.: Grzałka jest zablokowana.
  The heater reports a fault.: Grzałka zgłasza usterkę.
  'The heater reports a fault: {}.': 'Grzałka zgłasza usterkę: {}.'
  The heater took the target.: Grzałka przyjęła temperaturę docelową.
  The heater was turned off at the heater.: Grzałka została wyłączona na samej grzałce.
  The heater will cycle on and off several times.: Grzałka będzie się kilka razy włączać i wyłączać.
  The helper macros are installed and activate after Klipper restarts.: Makra pomocnicze są zainstalowane i zadziałają po restarcie Klippera.
  ? 'The host computer did not send moves to the controller board in time, usually because it is overloaded: high CPU or swap use, a slow SD card, an unstable power supply, or a webcam stream.'
  : 'Komputer hosta nie wysłał ruchów do płyty sterującej na czas, zwykle z powodu przeciążenia: wysokie użycie CPU lub swapu, wolna karta SD, niestabilny zasilacz albo stream z kamery.'
  ? 'The host heard nothing from this board for several seconds: a loose or failed USB or CAN cable, the board losing power, or a CAN bus without termination.'
  : 'Host nie otrzymał nic od tej płyty przez kilka sekund: luźny lub uszkodzony kabel USB lub CAN, utrata zasilania płyty albo magistrala CAN bez terminacji.'
  'The label didn''t print: {}': 'Etykieta się nie wydrukowała: {}'
  The lane forgets this spool. The filament itself stays where it is.: Tor zapomina tę szpulę. Sam filament zostaje na miejscu.
  The lane settings weren't changed, and the spool wasn't saved. Press Save to save the spool.: Ustawień toru nie zmieniono, a szpuli nie zapisano. Naciśnij Zapisz, aby zapisać szpulę.
  The lane settings weren't changed.: Ustawień toru nie zmieniono.
  The lane that takes over when this one runs out: Tor, który przejmuje druk, gdy ten się skończy
  The last print may still be on the bed. Remove it before the toolhead moves, then tap Cleared.: Ostatni wydruk może być nadal na stole. Zdejmij go, zanim głowica się ruszy, potem dotknij Usunięto.
  The latch opens and {} can drop. Hold it before you continue, then put it in its dock.: Zatrzask się otworzy i {} może spaść. Przytrzymaj ją, zanim przejdziesz dalej, potem odłóż do doku.
  The left RFID reader in this CFS unit may need service: Lewy czytnik RFID w tej jednostce CFS może wymagać serwisu
  The linked spool says {}.: Powiązana szpula to {}.
  ? 'The load cell read {1} g on the bed: the nozzle hit the print or a part came loose. During a print the firmware stops the printer.'
  : 'Czujnik nacisku odczytał {1} g na stole: dysza uderzyła w wydruk albo część się oderwała. Podczas druku firmware zatrzymuje drukarkę.'
  The load cell would not zero: Nie udało się wyzerować czujnika nacisku
  The load failed without a more specific reason.: Ładowanie nie powiodło się bez bliższej przyczyny.
  The loaded slot is not known yet: Załadowany slot nie jest jeszcze znany
  ? The loaded spool is {}, but this file was sliced for {}. Filled filament runs at a lower flow rate and needs a hardened nozzle.
  : Załadowana szpula to {}, a plik pokrojono dla {}. Filament z wypełniaczem drukuje się z mniejszym przepływem i wymaga utwardzonej dyszy.
  ? The macro failed while running. A macro usually fails like this when it uses a parameter the slicer did not pass or an object the printer does not have.
  : Makro nie powiodło się w trakcie działania. Zwykle dzieje się tak, gdy używa parametru, którego slicer nie przekazał, albo obiektu, którego drukarka nie ma.
  ? 'The macro failed while running: {3}. A macro usually fails like this when it uses a parameter the slicer did not pass or an object the printer does not have.'
  : 'Makro nie powiodło się w trakcie działania: {3}. Zwykle dzieje się tak, gdy używa parametru, którego slicer nie przekazał, albo obiektu, którego drukarka nie ma.'
  The measured offset between toolheads is outside the allowed range.: Zmierzony offset między głowicami jest poza dozwolonym zakresem.
  The message your printer's macros show (M117): Komunikat wyświetlany przez makra drukarki (M117)
  ? The mounted nozzle heats to {} and cools again while the heater's safety model is fitted. Keep the part fan off and flammable material away from the head. This takes several minutes.
  : Zamontowana dysza nagrzeje się do {} i ostygnie, podczas gdy dopasowywany jest model bezpieczeństwa grzałki. Wentylator części ma być wyłączony, a materiały łatwopalne z dala od głowicy. Trwa to kilka minut.
  The new IPv4 settings could not be marked as kept, so the next start undoes them.: Nie udało się oznaczyć nowych ustawień IPv4 jako zachowanych, więc następny start je cofnie.
  The new dock position is too far from the current one.: Nowa pozycja doku jest za daleko od bieżącej.
  The nozzle cooled during the pause, so the firmware refused to resume.: Dysza ostygła podczas pauzy, więc firmware odmówiło wznowienia.
  The nozzle did not heat up at the expected rate.: Dysza nie grzała się w oczekiwanym tempie.
  The nozzle extrudes a few short test moves in a corner, away from the print area, and repeats until it agrees with itself.: Dysza wykonuje kilka krótkich ruchów testowych w rogu, z dala od obszaru druku, i powtarza je, aż wyniki będą zgodne.
  The nozzle hasn't moved since the power went out. Check that it sits just above the top of the print, then resume.: Dysza nie ruszyła się od zaniku zasilania. Sprawdź, czy jest tuż nad górą wydruku, potem wznów.
  ? The nozzle heats to {} while the part fan steps through its speeds. For an accurate fit, fit the duct as you print with it. This takes several minutes.
  : Dysza nagrzewa się do {}, a wentylator części przechodzi przez kolejne prędkości. Dla dokładnego dopasowania załóż dyszę wentylatora, której używasz przy druku. Trwa to kilka minut.
  The nozzle hit the print or the bed: Dysza uderzyła w wydruk lub stół
  The nozzle is below the lowest temperature allowed for extruding.: Dysza jest poniżej najniższej temperatury dozwolonej do ekstruzji.
  The nozzle is clear of the print: Dysza jest z dala od wydruku
  ? The nozzle is hot. Brush it clean with the wire brush that came with the printer and keep the docking position clean, then tap Next.
  : Dysza jest gorąca. Oczyść ją drucianą szczotką dołączoną do drukarki i utrzymuj miejsce dokowania w czystości, potem dotknij Dalej.
  The nozzle is lifted clear of the print and X and Y are homed. Resuming lowers it back to the height it stopped at.: Dysza jest uniesiona nad wydrukiem, a X i Y są zbazowane. Wznowienie opuści ją do wysokości, na której się zatrzymała.
  The nozzle target never arrived.: Dysza nie osiągnęła temperatury docelowej.
  The nozzle temperature asked for is outside the allowed range.: Żądana temperatura dyszy jest poza dozwolonym zakresem.
  'The nozzle temperature reading is out of range: its sensor is loose or damaged.': 'Odczyt temperatury dyszy poza zakresem: czujnik jest luźny lub uszkodzony.'
  The nozzle waited too long; start again.: Dysza czekała za długo; zacznij ponownie.
  The old filament would not purge: Nie udało się wypłukać starego filamentu
  The part on the bed is too tall to clear. Remove it, then tap Cleared.: Część na stole jest za wysoka, by ją ominąć. Zdejmij ją, potem dotknij Usunięto.
  ? The peak of {0} left the zone. Check that only {1}'s tensioner was turned. Not sure which is which? Tap the pencil to identify the belts.
  : Szczyt {0} wyszedł poza strefę. Sprawdź, czy kręcono tylko napinaczem {1}. Nie wiesz, który jest który? Dotknij ołówka, aby rozpoznać pasy.
  The peak of {} moved out of the zone. Widening it.: Szczyt {} wyszedł poza strefę. Poszerzam ją.
  The pick-up failed with a toolhead in an unknown position.: Pobranie nieudane, głowica w nieznanej pozycji.
  'The pick-up failed: every toolhead still reads as docked.': 'Pobranie nieudane: każda głowica nadal jest odczytywana jako zadokowana.'
  The plate and the spools are still hot. Use gloves.: Płyta i szpule są nadal gorące. Użyj rękawic.
  The plate finishes its current move, but drying will not start.: Płyta dokończy bieżący ruch, ale suszenie się nie rozpocznie.
  The plugin can't reach the camera, so this screen takes the photos.: Wtyczka nie ma dostępu do kamery, więc zdjęcia robi ten ekran.
  The plugin can't save its recovery data to disk.: Wtyczka nie może zapisać danych odzyskiwania na dysk.
  The plugin is turned off in moonraker.conf.: Wtyczka jest wyłączona w moonraker.conf.
  The previous IPv4 settings come back when the print ends.: Poprzednie ustawienia IPv4 wrócą po zakończeniu wydruku.
  'The previous IPv4 settings could not be checked: {} could not be read': 'Nie udało się sprawdzić poprzednich ustawień IPv4: nie można odczytać {}'
  'The previous IPv4 settings could not be restored, and the record of the change could not be updated: {}': 'Nie udało się przywrócić poprzednich ustawień IPv4 ani zaktualizować zapisu zmiany: {}'
  'The previous IPv4 settings could not be restored: {}': 'Nie udało się przywrócić poprzednich ustawień IPv4: {}'
  The previous settings come back in %d seconds unless you keep these.: Poprzednie ustawienia wrócą za %d s, chyba że zachowasz te.
  The print already moved to another toolhead: Wydruk już przeszedł na inną głowicę
  The print ended before any layer was printed. Nothing was changed.: Wydruk zakończył się przed wydrukowaniem jakiejkolwiek warstwy. Nic nie zmieniono.
  The print file is damaged: Plik wydruku jest uszkodzony
  The print is canceled and you judge what has printed so far.: Wydruk zostanie anulowany, a ty ocenisz to, co już się wydrukowało.
  The print is canceled and you pick the best band from what has printed so far.: Wydruk zostanie anulowany, a ty wybierzesz najlepsze pasmo z tego, co już się wydrukowało.
  The print is no longer paused: Wydruk nie jest już wstrzymany
  The print is on its last layer.: Wydruk jest na ostatniej warstwie.
  ? The print is paused. Changing tools now moves the toolhead and swaps the filament at the nozzle. Resume the print once the change finishes.
  : Wydruk jest wstrzymany. Zmiana narzędzia teraz przesunie głowicę i wymieni filament w dyszy. Wznów wydruk po zakończeniu zmiany.
  The print is still stuck to the bed: Wydruk jest nadal przyklejony do stołu
  The print is waiting for the chamber to reach {}, but the heater is not heating.: Wydruk czeka, aż komora osiągnie {}, ale grzałka nie grzeje.
  The print is waiting for the chamber, but the heater is not heating.: Wydruk czeka na komorę, ale grzałka nie grzeje.
  The print may have failed: Wydruk mógł się nie udać
  The print moved to {} but did not resume. Check {}, then press Resume.: Wydruk przeszedł na {}, ale się nie wznowił. Sprawdź {}, potem naciśnij Wznów.
  The print settings sent with the file could not be applied.: Nie udało się zastosować ustawień druku wysłanych z plikiem.
  The printable size in millimeters (X × Y × Z), from the axis limits in the printer's Klipper config.: Obszar roboczy w milimetrach (X × Y × Z), z limitów osi w konfiguracji Klippera drukarki.
  The printer applied this value and keeps it for this tool.: Drukarka zastosowała tę wartość i zachowuje ją dla tego narzędzia.
  The printer can draw a priming line before a print. HelixScreen offers it in the pre-print options.: Drukarka może narysować linię wstępną przed drukiem. HelixScreen oferuje to w opcjach przed drukiem.
  The printer can measure each tool's offset automatically. Run it on the tool offset calibration screen.: Drukarka może automatycznie zmierzyć offset każdego narzędzia. Uruchom to na ekranie kalibracji offsetów narzędzi.
  The printer can measure pressure advance on its own. Run it on the PA calibration screen.: Drukarka może sama zmierzyć pressure advance. Uruchom to na ekranie kalibracji PA.
  The printer can pause at a chosen layer, for a filament swap or an insert. Set the layer from the print preview.: Drukarka może zatrzymać się na wybranej warstwie, aby wymienić filament lub włożyć wkładkę. Ustaw warstwę w podglądzie wydruku.
  The printer could not connect to one of its boards at startup.: Drukarka nie połączyła się z jedną z płyt przy starcie.
  'The printer could not get the head ready: homing, picking up the head or heating the nozzle failed.': 'Drukarka nie przygotowała głowicy: bazowanie, pobranie głowicy lub grzanie dyszy nie powiodło się.'
  The printer could not start: Drukarka nie mogła wystartować
  The printer could not work out where to resume.: Drukarka nie ustaliła, skąd wznowić.
  The printer did not change its bed check: Drukarka nie zmieniła sprawdzania stołu
  'The printer did not change its bed check: {}': 'Drukarka nie zmieniła sprawdzania stołu: {}'
  'The printer did not confirm the print started ({}). It may still start: check the printer before starting it again.': 'Drukarka nie potwierdziła rozpoczęcia druku ({}). Może jeszcze wystartować: sprawdź drukarkę, zanim uruchomisz go ponownie.'
  The printer did not report its toolhead limits.: Drukarka nie podała limitów głowicy.
  The printer did not reset the filter: Drukarka nie zresetowała filtra
  The printer did not say whether it is printing. Try again.: Drukarka nie podała, czy drukuje. Spróbuj ponownie.
  The printer did not start the tower.: Drukarka nie uruchomiła wieży.
  The printer extrudes in a corner and repeats until the readings agree. You do not judge anything by eye.: Drukarka wytłacza w rogu i powtarza, aż odczyty będą zgodne. Niczego nie oceniasz na oko.
  The printer finishes this measurement on its own.: Drukarka sama dokończy ten pomiar.
  The printer halted this print and cannot resume it. Restart from the beginning?: Drukarka przerwała ten wydruk i nie może go wznowić. Zacząć od początku?
  The printer has not answered the cancel yet. It stops once its start sequence finishes.: Drukarka jeszcze nie odpowiedziała na anulowanie. Zatrzyma się po zakończeniu sekwencji startowej.
  The printer has not reported its axis limits yet.: Drukarka nie podała jeszcze limitów osi.
  The printer has not reported its maximum velocity yet.: Drukarka nie podała jeszcze maksymalnej prędkości.
  The printer has not reported whether Auto-Replenish is on: Drukarka nie podała, czy Auto-Replenish jest włączone
  ? The printer heats the nozzle, extrudes a few short test moves in a corner of the plate, and measures them itself. It repeats until the readings agree, then reports one number.
  : Drukarka grzeje dyszę, wykonuje kilka krótkich ruchów testowych w rogu płyty i sama je mierzy. Powtarza, aż odczyty będą zgodne, potem podaje jedną liczbę.
  The printer homes and sweeps the cutter (about 1 minute). Keep the filament path clear.: Drukarka bazuje i przemiata obcinak (około 1 minuty). Utrzymuj ścieżkę filamentu drożną.
  The printer homes if needed, then finds the cutter's position. Keep the filament path clear.: Drukarka bazuje w razie potrzeby, potem ustala pozycję obcinaka. Utrzymuj ścieżkę filamentu drożną.
  ? The printer homes, then moves the plate as far from the nozzle as it goes. Some spools are not heat-resistant enough and can deform. Nothing moves from this screen until you confirm the spools are off the bed; Mainsail, macros and prints sent from a slicer are not blocked.
  : Drukarka bazuje, potem odsuwa płytę maksymalnie od dyszy. Niektóre szpule nie są wystarczająco odporne na ciepło i mogą się odkształcić. Z tego ekranu nic się nie poruszy, dopóki nie potwierdzisz, że szpule są zdjęte ze stołu; Mainsail, makra i wydruki wysłane ze slicera nie są blokowane.
  The printer homes, then probes each screw position.: Drukarka bazuje, potem mierzy każdą pozycję śruby.
  The printer is already resuming the print: Drukarka już wznawia wydruk
  The printer is busy. Run the check when no print or other motion is in progress.: Drukarka jest zajęta. Uruchom sprawdzanie, gdy nie trwa druk ani inny ruch.
