  Check that the build plate is in place and nothing blocks the axis, clean the nozzle tip, then home again.: Sprawdź, czy płyta robocza jest na miejscu i nic nie blokuje osi, oczyść czubek dyszy, potem zbazuj ponownie.
  Check that the camera's live view works, or turn off timelapse for this print, then resume.: Sprawdź, czy podgląd na żywo z kamery działa, albo wyłącz timelapse dla tego wydruku, potem wznów.
  Check that the cutter cut fully and pull the filament back by hand if needed, then retry.: Sprawdź, czy obcinak przeciął filament do końca, w razie potrzeby cofnij filament ręcznie, potem ponów.
  Check that the cutter mechanism is properly installed: Sprawdź, czy mechanizm obcinaka jest poprawnie zamontowany
  ? Check that the model fits the bed and that the slicer's bed size matches this printer, and check macros that park or purge.
  : Sprawdź, czy model mieści się na stole i czy rozmiar stołu w slicerze odpowiada tej drukarce, oraz sprawdź makra parkowania lub płukania.
  Check that the printer is powered on and connected to the network: Sprawdź, czy drukarka jest włączona i podłączona do sieci
  Check that the spool turns freely and lane {1}'s tube is not kinked, and clear debris from the pinch roller.: Sprawdź, czy szpula obraca się swobodnie, a rurka toru {1} nie jest zagięta, i usuń zanieczyszczenia z rolki dociskowej.
  Check that the toolhead is really empty, then resume.: Sprawdź, czy głowica jest naprawdę pusta, potem wznów.
  Check the CAN wiring and bitrate and the host's load, then home again.: Sprawdź okablowanie CAN, bitrate i obciążenie hosta, potem zbazuj ponownie.
  Check the IFS cable, make sure the native screen is off, and power the printer off and on.: Sprawdź kabel IFS, upewnij się, że natywny ekran jest wyłączony, i wyłącz oraz włącz drukarkę.
  Check the PTFE tube: Sprawdź rurkę PTFE
  Check the PTFE tube along the drag chain for kinks, and the bend where it enters the extruder sensor: Sprawdź rurkę PTFE wzdłuż prowadnika kabli pod kątem zagięć oraz zgięcie przy wejściu do czujnika ekstrudera
  Check the PTFE tube from the Box to the toolhead and the toolhead entry, and clear any cut tip, then retry.: Sprawdź rurkę PTFE od Boxa do głowicy i wejście do głowicy, usuń ucięte końcówki, potem ponów.
  Check the RS-485 cable between printer and CFS: Sprawdź kabel RS-485 między drukarką a CFS
  ? Check the USB or CAN cable and its termination, keep it away from motor wires, check the host's load, then restart the firmware.
  : Sprawdź kabel USB lub CAN i jego terminację, trzymaj go z dala od przewodów silników, sprawdź obciążenie hosta, potem uruchom ponownie firmware.
  Check the accelerometer cable and the cs_pin in its configuration section, then run ACCELEROMETER_QUERY.: Sprawdź kabel akcelerometru i cs_pin w jego sekcji konfiguracji, potem uruchom ACCELEROMETER_QUERY.
  ? Check the active spool and its tube. If the slot is wrong, set it with SET_EXTRUDER_SLOT. For false alarms, raise detection_length of the IFS motion sensor (8 to 17).
  : Sprawdź aktywną szpulę i jej rurkę. Jeśli slot jest zły, ustaw go poleceniem SET_EXTRUDER_SLOT. Przy fałszywych alarmach zwiększ detection_length czujnika ruchu IFS (8 do 17).
  Check the bed temperature in the slicer's profile.: Sprawdź temperaturę stołu w profilu slicera.
  Check the belts and rails for debris or looseness, then home again.: Sprawdź paski i prowadnice pod kątem zanieczyszczeń lub luzów, potem zbazuj ponownie.
  ? Check the board's power and cable, and the serial or canbus_uuid setting in the printer's configuration, then restart the firmware.
  : Sprawdź zasilanie i kabel płyty oraz ustawienie serial lub canbus_uuid w konfiguracji drukarki, potem uruchom ponownie firmware.
  Check the board's power supply and look for damaged or shorted wiring, then restart the firmware.: Sprawdź zasilacz płyty i poszukaj uszkodzonych lub zwartych przewodów, potem uruchom ponownie firmware.
  Check the buffer unit on the back of the printer: Sprawdź jednostkę bufora z tyłu drukarki
  ? Check the cable, connectors and power of that board (often the toolhead board) and the CAN termination, then restart the firmware.
  : Sprawdź kabel, złącza i zasilanie tej płyty (często płyty głowicy) oraz terminację CAN, potem uruchom ponownie firmware.
  Check the chips, then save: Sprawdź etykiety, potem zapisz
  Check the dock for debris or a bent latch, guide the head into its dock, then home and resume.: Sprawdź dok pod kątem zanieczyszczeń lub wygiętego zatrzasku, wprowadź głowicę do doku, potem zbazuj i wznów.
  Check the fan for obstructions and its cable, then resume.: Sprawdź, czy nic nie blokuje wentylatora, i jego kabel, potem wznów.
  Check the filament path and try again.: Sprawdź ścieżkę filamentu i spróbuj ponownie.
  ? Check the heater and thermistor wiring and that the thermistor is seated, keep fans off the heater block and run PID tuning again, then restart the firmware.
  : Sprawdź okablowanie grzałki i termistora oraz osadzenie termistora, nie kieruj wentylatorów na blok grzejny i ponów strojenie PID, potem uruchom ponownie firmware.
  Check the lane's tube and the toolhead entry for a jam. For a load, check that the toolhead sensor works.: Sprawdź rurkę toru i wejście głowicy pod kątem zatoru. Przy ładowaniu sprawdź, czy działa czujnik głowicy.
  Check the motor cable, the driver's cooling and the motor power, then restart the firmware.: Sprawdź kabel silnika, chłodzenie sterownika i zasilanie silnika, potem uruchom ponownie firmware.
  Check the nozzle temperature in the slicer's filament profile.: Sprawdź temperaturę dyszy w profilu filamentu w slicerze.
  ? Check the path from the slot to the hub for a tangle or drag. If the slot feeds freely, the hub sensor or the feeder motor may have failed
  : Sprawdź drogę od slotu do huba pod kątem splątania lub oporu. Jeśli slot podaje swobodnie, mógł się uszkodzić czujnik huba albo silnik podajnika
  Check the power cable and outlet. When power is back, resume the print if the printer offers it.: Sprawdź kabel zasilający i gniazdko. Gdy zasilanie wróci, wznów druk, jeśli drukarka to proponuje.
  Check the print. Resume only if it looks fine; otherwise cancel and clean the plate.: Sprawdź wydruk. Wznów tylko, jeśli wygląda dobrze; w przeciwnym razie anuluj i oczyść płytę.
  Check the provided value and try again: Sprawdź podaną wartość i spróbuj ponownie
  Check the sensor leads at the amplifier board and the amplifier's wiring to the controller, then restart the firmware.: Sprawdź przewody czujnika przy płytce wzmacniacza oraz połączenie wzmacniacza ze sterownikiem, potem uruchom ponownie firmware.
  ? Check the sensor's wiring and connector, and that the room is not colder than the sensor's minimum. Let the printer cool, then restart the firmware.
  : Sprawdź okablowanie i złącze czujnika oraz czy w pomieszczeniu nie jest zimniej niż minimum czujnika. Pozwól drukarce ostygnąć, potem uruchom ponownie firmware.
  Check the spool and the filament path for a jam, then retry: Sprawdź szpulę i drogę filamentu pod kątem zatoru, potem ponów
  Check the spool for a tangle and the feed tube for a kink or a loose fitting, then load the head again.: Sprawdź, czy szpula nie jest splątana, a rurka podająca zagięta lub luźna, potem załaduj głowicę ponownie.
  Check the spool for a tangle or a stuck spool, clear the filament path, then resume.: Sprawdź, czy szpula nie jest splątana lub zablokowana, oczyść drogę filamentu, potem wznów.
  Check the spool, the feeder and the feed tube to this head, then load the head again.: Sprawdź szpulę, podajnik i rurkę podającą do tej głowicy, potem załaduj głowicę ponownie.
  ? Check the switch with QUERY_ENDSTOPS (or QUERY_PROBE) and its wiring and pin. For sensorless homing, tune the driver's stall threshold.
  : Sprawdź przełącznik poleceniem QUERY_ENDSTOPS (lub QUERY_PROBE) oraz jego okablowanie i pin. Przy bazowaniu bez krańcówek dostrój próg utknięcia sterownika.
  Check the tension of the motion belts: Sprawdź napięcie pasków ruchu
  ? Check this head's feeder for jammed filament, then load the head again. Restart the printer if the motor still does not turn.
  : Sprawdź podajnik tej głowicy pod kątem zablokowanego filamentu, potem załaduj głowicę ponownie. Jeśli silnik nadal się nie obraca, zrestartuj drukarkę.
  Check your heater's rating (typically 40-60W for hotends): Sprawdź moc grzałki (zwykle 40-60W dla hotendów)
