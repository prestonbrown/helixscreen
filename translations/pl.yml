  This file prints {0} and {1} through one nozzle. {0} can burn and clog the nozzle at {1} temperatures.: Ten plik drukuje {0} i {1} przez jedną dyszę. {0} może się przypalić i zatkać dyszę w temperaturach {1}.
  This file prints {0} and {1} together. The chamber and bed heat {1} needs can soften {0} and jam its nozzle.: Ten plik drukuje {0} i {1} razem. Temperatura komory i stołu potrzebna dla {1} może zmiękczyć {0} i zablokować jego dyszę.
  This file was sliced for {} but {} is loaded.: Ten plik pokrojono dla {}, a załadowano {}.
  This file was sliced for {}, but {} is loaded. It will print slower and hotter than the loaded spool needs.: Ten plik pokrojono dla {}, a załadowano {}. Będzie drukowany wolniej i goręcej, niż potrzebuje załadowana szpula.
  This firmware can only switch slots by loading them: To firmware może przełączać sloty tylko przez ich załadowanie
  The filament went into the toolhead past its feeder. Load it by hand.: Filament wszedł do głowicy z pominięciem podajnika. Załaduj go ręcznie.
  This toolhead has no automatic feeder. Load the filament by hand.: Ta głowica nie ma automatycznego podajnika. Załaduj filament ręcznie.
  This head until a tool change; Save after the print to apply it to every head: Ta głowica do zmiany narzędzia; Zapisz po wydruku, aby zastosować do każdej głowicy
