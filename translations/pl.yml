  ? Klipper has entered an error state. This is typically caused by an MCU connection failure or configuration error. Try a firmware restart.
  : Klipper jest w stanie błędu. Zwykle przyczyną jest utrata połączenia z MCU albo błąd konfiguracji. Spróbuj restartu firmware.
  Klipper has entered shutdown state.: Klipper przeszedł w stan wyłączenia.
  Klipper has entered shutdown state. This may be due to an emergency stop, thermal runaway, or configuration error.: Klipper przeszedł w stan wyłączenia. Przyczyną może być zatrzymanie awaryjne, ucieczka termiczna lub błąd konfiguracji.
  Klipper has no [virtual_sdcard] section.: Klipper nie ma sekcji [virtual_sdcard].
  'Klipper has not loaded the timelapse macros, so no frames are captured. Add this line to printer.cfg and restart Klipper:': 'Klipper nie wczytał makr timelapse, więc klatki nie są rejestrowane. Dodaj tę linię do printer.cfg i zrestartuj Klippera:'
