  ? There is not enough free memory to run this test. Klipper's analysis would run out of memory and leave the printer stuck until it is power-cycled.
  : Za mało wolnej pamięci na ten test. Analiza Klippera wyczerpałaby pamięć i zawiesiła drukarkę do wyłączenia zasilania.
  Thermocouple reader fault: Usterka czytnika termopary
  These readings aren't repeatable, so tuning can't be steered. Check the mechanics first.: Te odczyty nie są powtarzalne, więc strojenie nie może być prowadzone. Najpierw sprawdź mechanikę.
  'These tools have a different filament grade loaded:': 'Te narzędzia mają załadowany filament innego gatunku:'
  'These tools have incompatible materials loaded:': 'Te narzędzia mają załadowane niekompatybilne materiały:'
  'These tools have no filament loaded:': 'Te narzędzia nie mają załadowanego filamentu:'
  'These tools have no matching filament loaded:': 'Te narzędzia nie mają załadowanego pasującego filamentu:'
