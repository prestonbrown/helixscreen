  A: A
  ? A 0.2 mm nozzle can't print every filament, including PA, PC, TPU and carbon- or glass-filled types. If this head has one of them loaded, the printer clears its filament info and you'll need to set it again.
  : Dysza 0,2 mm nie wydrukuje każdego filamentu, m.in. PA, PC, TPU oraz z wypełnieniem węglowym lub szklanym. Jeśli ta głowica ma załadowany któryś z nich, drukarka wyczyści informacje o filamencie i trzeba będzie ustawić je ponownie.
  A board could not keep up with its timing and shut down.: Płyta sterująca nie nadążyła z taktowaniem i wyłączyła się.
  A board stopped answering while the printer was running.: Płyta sterująca przestała odpowiadać podczas pracy drukarki.
  A buzzer or speaker for alerts and sounds. Set what plays in the sound settings.: Brzęczyk lub głośnik do alertów i dźwięków. Co ma grać, ustawisz w ustawieniach dźwięku.
  A camera Moonraker streams. Add the camera widget to the home screen to watch it, and see it during a print.: Kamera, którą streamuje Moonraker. Dodaj widżet kamery na ekran główny, aby ją oglądać, także w trakcie druku.
  A cold pull is already running.: Zimne wyciąganie (cold pull) już trwa.
  A command is malformed or names a device that does not exist.: Polecenie jest błędne albo wskazuje urządzenie, które nie istnieje.
  A command is missing a value, or a value is out of its allowed range.: W poleceniu brakuje wartości albo wartość jest poza dozwolonym zakresem.
  A configuration file includes itself: Plik konfiguracji dołącza sam siebie
  A configuration file includes itself, directly or through another file it includes.: Plik konfiguracji dołącza sam siebie, bezpośrednio lub przez inny dołączany plik.
  A configuration file is missing: Brakuje pliku konfiguracji
  A controller board did not answer: Płyta sterująca nie odpowiedziała
  A controller board fell behind: Płyta sterująca nie nadąża
  A controller board missed a timed update: Płyta sterująca pominęła aktualizację czasową
  A controller board runs firmware that does not match the printer software.: Płyta sterująca ma firmware niezgodny z oprogramowaniem drukarki.
  A cooling fan stopped while its heater was on, so the firmware turned the heater off.: Wentylator chłodzący zatrzymał się przy włączonej grzałce, więc firmware wyłączył grzałkę.
  A delta printer can't home X and Y without moving Z, so a print can't be resumed.: Drukarka delta nie zbazuje X i Y bez ruchu Z, więc wydruku nie da się wznowić.
  A different toolhead than the one asked for is on the carriage.: Na karetce jest inna głowica niż żądana.
  ? 'A dock or grab sensor reads wrong: a head not seated in its dock, a dirty or failed switch, or the carriage still holding a head.'
  : 'Czujnik doku lub chwytu odczytuje błędnie: głowica nieosadzona w doku, brudny lub uszkodzony przełącznik albo karetka nadal trzyma głowicę.'
  A fan that pulls the enclosure air through a filter. Control it on the chamber temperature screen.: Wentylator, który przetłacza powietrze z obudowy przez filtr. Sterujesz nim na ekranie temperatury komory.
  A few minutes, nearly all of it heating. You judge nothing by eye.: Kilka minut, prawie w całości nagrzewanie. Nic nie oceniasz na oko.
  A first-layer offset and bed mesh for each material: Offset pierwszej warstwy i siatka stołu dla każdego materiału
  A folder name in moonraker.conf is unsafe.: Nazwa folderu w moonraker.conf jest niebezpieczna.
  A grid marks a material with a stored bed mesh, loaded at print start for prints that do not mesh.: Siatka oznacza materiał z zapisaną siatką stołu, wczytywaną na starcie wydruków, które nie mierzą stołu.
  ? A guided series of towers the firmware prints itself, each sweeping one value of the nonlinear model while you judge the slow and fast sides. Three towers for direct drive, four for Bowden.
  : Prowadzona seria wież drukowanych przez firmware, każda zmienia jedną wartość modelu nieliniowego, a ty oceniasz stronę wolną i szybką. Trzy wieże dla direct drive, cztery dla Bowdena.
  A heat soak macro is set up on the printer. HelixScreen detects it but does not run it.: Na drukarce jest makro wygrzewania (heat soak). HelixScreen je wykrywa, ale nie uruchamia.
  ? A heated bed expands with temperature, so each material can keep its own first-layer offset. The print-start macro applies it, and a Save during a print changes only that print's material.
  : Podgrzewany stół rozszerza się z temperaturą, więc każdy materiał może mieć własny offset pierwszej warstwy. Stosuje go makro startu wydruku, a Zapisz w trakcie druku zmienia tylko materiał tego wydruku.
  A heater did not warm up at the expected rate.: Grzałka nie nagrzewała się w oczekiwanym tempie.
  ? A heater or fan update from the host arrived too late. The USB or CAN connection to the board most likely dropped out for a moment, or the host stalled.
  : Aktualizacja grzałki lub wentylatora z hosta przyszła za późno. Najpewniej połączenie USB lub CAN z płytą na chwilę zanikło albo host się zawiesił.
  A heater that warms the air inside the enclosure. Set its temperature on the chamber temperature screen.: Grzałka, która ogrzewa powietrze w obudowie. Temperaturę ustawisz na ekranie temperatury komory.
  A height map of the bed that Klipper uses to make up for an uneven surface. View and calibrate it on the Bed Mesh screen.: Mapa wysokości stołu, którą Klipper kompensuje nierówną powierzchnię. Podgląd i kalibracja na ekranie Siatka stołu.
  A home-origin calibration point failed or stayed unstable.: Punkt kalibracji pozycji początkowej nie powiódł się lub był niestabilny.
  A hot bed changes shape. Probe at the temperature you print at.: Gorący stół zmienia kształt. Mierz w temperaturze, w której drukujesz.
  A left, B right: A po lewej, B po prawej
  A load was asked for while the toolhead holds filament the Box has no record of.: Zażądano ładowania, gdy głowica ma filament, którego Box nie ma w zapisach.
  A lower, B upper: A niżej, B wyżej
  'A macro printed stray template text ''{}'': check its Jinja tags': 'Makro wypisało zbędny tekst szablonu „{}”: sprawdź jego znaczniki Jinja'
  A macro that wipes the nozzle. HelixScreen can run it before a print from the pre-print options.: Makro wycierające dyszę. HelixScreen może je uruchomić przed drukiem z opcji przed drukiem.
  ? A material preset sets the bed and chamber along with the nozzle; off, it heats only the nozzle. A preheat macro that handles heating sets whatever heaters it sets
  : Preset materiału ustawia stół i komorę razem z dyszą; wyłączony grzeje tylko dyszę. Makro podgrzewania, które obsługuje grzanie, ustawia te grzałki, które samo ustawia
  A motor IO pin couldn't be restored. Power-cycle the printer to recover: Nie udało się przywrócić pinu IO silnika. Wyłącz i włącz drukarkę
  A motor driver reported a fault such as overheating or a short.: Sterownik silnika zgłosił usterkę, np. przegrzanie lub zwarcie.
  A motor's parameters couldn't be written. Power-cycle the printer to retry: Nie udało się zapisać parametrów silnika. Wyłącz i włącz drukarkę, aby ponowić
  A move command has an invalid speed or cannot be read.: Polecenie ruchu ma błędną prędkość albo nie da się go odczytać.
  A move to X {1}, Y {2}, Z {3} is outside the printer's travel.: Ruch do X {1}, Y {2}, Z {3} wychodzi poza zakres ruchu drukarki.
  A move was sent before that axis was homed.: Wysłano ruch, zanim oś została zbazowana.
  A move was sent before the axes were homed, often because the motors were turned off after the printer sat idle.: Wysłano ruch przed bazowaniem osi, często dlatego, że silniki zostały wyłączone po bezczynności drukarki.
  A move went outside the printer's travel.: Ruch wyszedł poza zakres ruchu drukarki.
  A move went past the printer's travel limits.: Ruch przekroczył granice ruchu drukarki.
  ? A move would push out far more filament than its length allows ({1} square mm against a limit of {2}), usually because the slicer and the start G-code disagree on relative or absolute extrusion.
  : Ruch wypchnąłby znacznie więcej filamentu, niż pozwala jego długość ({1} mm² przy limicie {2}), zwykle dlatego, że slicer i początkowy G-code różnią się w ekstruzji względnej/bezwzględnej.
  A new Print Status screen: Nowy ekran stanu druku
  A newer version of the helper macros is available: Dostępna jest nowsza wersja makr pomocniczych
  A picture of your printer: Zdjęcie twojej drukarki
  A piece of filament is already in this head's feed path.: W ścieżce podawania tej głowicy jest już kawałek filamentu.
  ? A pressure advance run was interrupted. The X/Y drivers were released and the motion limits and pressure advance reset; home the printer before moving it.
  : Przerwano pomiar pressure advance. Sterowniki X/Y zostały zwolnione, a limity ruchu i pressure advance zresetowane; przed ruchem drukarki wykonaj bazowanie.
  A print holds the printer.: Drukarka jest zajęta drukiem.
  A print is already running: Druk już trwa
  A print is already running.: Druk już trwa.
  A print is in progress - restart still pending: Trwa druk - restart nadal oczekuje
  A print is running on this gate. HelixScreen cleared its own copy; clear it again once the print finishes.: Na tym gate trwa druk. HelixScreen wyczyścił własną kopię; wyczyść ponownie po zakończeniu druku.
  A print is running. Apply the result after it ends.: Trwa druk. Zastosuj wynik po jego zakończeniu.
  A print started: Rozpoczęto druk
  A print started while spools are marked as on the bed. If they are still there, stop the printer now with the E-stop.: Rozpoczęto druk, gdy szpule są oznaczone jako leżące na stole. Jeśli nadal tam są, zatrzymaj drukarkę teraz przyciskiem E-stop.
  A print started, so the calibration did not start.: Rozpoczęto druk, więc kalibracja się nie zaczęła.
  A print took the printer.: Druk zajął drukarkę.
  A required setting is missing: Brakuje wymaganego ustawienia
  A restart is already in progress: Restart już trwa
  A right, B left: A po prawej, B po lewej
  A saturated filter stops trapping fumes and particles.: Nasycony filtr przestaje zatrzymywać opary i cząstki.
  ? A sensor that measures the distance to the bed. HelixScreen uses it for Z offset calibration and probe tests on the Probe screen.
  : Czujnik mierzący odległość od stołu. HelixScreen używa go do kalibracji offsetu Z i testów sondy na ekranie Sonda.
  A sensor that reads the air temperature inside the enclosure. Watch it on the chamber temperature screen.: Czujnik temperatury powietrza w obudowie. Obserwuj go na ekranie temperatury komory.
