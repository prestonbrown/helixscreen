  ? The filament did not reach the nozzle. The CFS reported no error, but the toolhead sensor still sees no filament. Check that the spool is seated and the path is clear, then try again.
  : Il filamento non ha raggiunto l'ugello. Il CFS non ha segnalato errori, ma il sensore della testina ancora non rileva filamento. Verifica che la bobina sia ben inserita e che il percorso sia libero, poi riprova.
  The filament system reported an error: Il sistema filamento ha segnalato un errore
  The heater will cycle on and off several times.: Il riscaldatore si accenderà e
    spegnerà diverse volte.
  ? The loaded spool is {}, but this file was sliced for {}. Filled filament runs at a lower flow rate and needs a hardened nozzle.
  : La bobina caricata è {}, ma questo file è stato sezionato per {}. Il filamento con cariche richiede un flusso più basso e un ugello indurito.
  ? "The motor vibrates the belt while a strobe light flashes at the same frequency. When the belt appears to stand still (frozen), you have found the resonant frequency.\n\nUse the frequency buttons to sweep through values until the belt looks stationary, then lock the reading."
  : "Il motore fa vibrare la cinghia mentre una luce stroboscopica lampeggia alla stessa frequenza. Quando la cinghia sembra ferma (immobile), hai trovato la frequenza di risonanza.\n\nUsa i pulsanti della frequenza per scorrere i valori finché la cinghia non appare ferma, poi blocca la lettura."
  ? The print is paused. Changing tools now moves the toolhead and swaps the filament at the nozzle. Resume the print once the change finishes.
  : La stampa è in pausa. Cambiare utensile ora muove la testina e sostituisce il
    filamento all'ugello. Riprendi la stampa al termine del cambio.
  The printer halted this print and cannot resume it. Restart from the beginning?: La
    stampante ha interrotto questa stampa e non può riprenderla. Riavviare dall'inizio?
  The printer is not homed. Continuing will home all axes, moving the toolhead. Make sure the bed is clear.: La stampante non ha eseguito l'homing. Continuando verrà eseguito l'homing di tutti gli assi, muovendo la testina. Assicurarsi che il piano sia libero.
  The printer lost power during a print. It can resume where it left off.: La stampante
    ha perso l'alimentazione durante una stampa. Può riprendere da dove si è interrotta.
  The printer lost power during a print. The resumed layer may not line up exactly.: La stampante ha perso l'alimentazione durante una stampa. Il layer ripreso potrebbe non allinearsi perfettamente.
  The printer lost power while printing {}. Resume where it left off?: La stampante ha
    perso l'alimentazione durante la stampa di {}. Riprendere da dove si è interrotta?
  The printer lost power while printing {}. The resumed layer may not line up exactly.: La stampante ha perso l'alimentazione durante la stampa di {}. Il layer ripreso potrebbe non allinearsi perfettamente.
  The printer rejected the filament configuration. The print was not started.: La
    stampante ha rifiutato la configurazione del filamento. La stampa non è stata
    avviata.
  The printer's firmware chooses the backup spool itself: Il firmware della stampante sceglie la bobina di riserva
