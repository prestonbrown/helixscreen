    использования помогают улучшить HelixScreen.
  Thanks! TOTALLY anonymous usage data helps improve HelixScreen.: Спасибо! ПОЛНОСТЬЮ
    анонимные данные использования помогают улучшить HelixScreen.
  That print is no longer paused: 'Эта печать больше не приостановлена'
  That reading jumped too far to trust. Re-measure without turning.: "Это показание скакнуло слишком сильно, чтобы ему доверять. Измерьте снова, не вращая."
  'That setting cannot be changed while a print is running': 'Этот параметр нельзя изменить во время печати'
  That slot cannot stand in for this one: Этот слот не может заменить текущий
  That tool is already loaded: Этот инструмент уже загружен
  That turn didn't register yet. Loosen {0} a little more.: "Этот поворот ещё не отразился. Ослабьте {0} ещё немного."
  That turn didn't register yet. Loosen {0} one more full turn.: "Этот поворот ещё не отразился. Ослабьте {0} ещё на один полный оборот."
  That turn didn't register yet. Tighten {0} a little more.: "Этот поворот ещё не отразился. Натяните {0} ещё немного."
  That turn didn't register yet. Tighten {0} one more full turn.: "Этот поворот ещё не отразился. Натяните {0} ещё на один полный оборот."
  The ACE pushes the loaded filament along with the extruder. The driver turns Feed Assist on after a load: "ACE проталкивает загруженный филамент вместе с экструдером. Драйвер включает помощь подачи после загрузки"
  The ACE state can't be read.: "Не удаётся прочитать состояние ACE."
  The CFS odometer hardware is faulty and needs repair or replacement: Оборудование одометра CFS неисправно и требует ремонта или замены
  The CFS ran out of filament in {}. Printing continues on what is left in the tube.: 'В CFS закончился филамент в {}. Печать продолжается остатком в трубке.'
  The CFS ran out of filament. Printing continues on what is left in the tube.: 'В CFS закончился филамент. Печать продолжается остатком в трубке.'
  ? The HelixPrint plugin enables fast G-code modifications directly on your printer—like
    skipping bed mesh for quick reprints.
  : Плагин HelixPrint позволяет быстро модифицировать G-code прямо на принтере — например,
    пропускать сетку стола для быстрых перепечаток.
  The IFS state file can't be read.: "Не удаётся прочитать файл состояния IFS."
  The Moonraker timelapse plugin is installed. Set how it records in the timelapse settings.: 'Плагин таймлапса Moonraker установлен. Способ записи задается в настройках таймлапса.'
  The PEI sheet is still on the bed. Take it off, then tap Next.: Лист PEI всё ещё на столе. Снимите его и нажмите «Далее».
  The Spoolman spool currently loaded: Текущая катушка Spoolman
  ? The animated screensaver has been turned off on this device to prevent it from
    interfering with prints. You can re-enable it in Settings > Display.
  : Анимированная заставка была отключена на данном устройстве, чтобы она не мешала
    печати. Вы можете снова включить её в Настройки > Дисплей.
  "The bed and nozzle heat together before anything moves, so the print re-grips and the nozzle lets go of it.": "Стол и сопло нагреваются вместе до любого движения, чтобы печать снова прилипла, а сопло отделилось от неё."
  The bed has cooled. Take the spools off the plate, then confirm.: Стол остыл. Снимите катушки со стола, затем подтвердите.

  The bed is too small for settling laps.: 'Стол слишком мал для кругов приработки.'
  The bed heater. Set its temperature and watch its graph on the bed temperature screen.: 'Нагреватель стола. Температура задается, а график виден на экране температуры стола.'
  The bed is too small for the test tower, or its size is unknown.: Стол слишком мал для тестовой башни, или его размер неизвестен.
  The bed turns off. The spools stay latched on the bed until you confirm they are off.: Стол выключится. Катушки считаются лежащими на столе, пока вы не подтвердите, что сняли их.

  The bed was reported dirty, so this print cannot resume.: 'Стол помечен как загрязнённый, поэтому печать не может быть продолжена.'
  The buffer may be disconnected, stuck, or faulty. Check it before retrying: Буфер может быть отключён, заклинен или неисправен. Проверьте его перед повтором
  The buffer saw no movement for 16 seconds. Check for a blockage between the CFS and the extruder, or a stuck buffer: Буфер не фиксировал движение 16 секунд. Проверьте засор между CFS и экструдером или заклинивший буфер
  ? The camera thought it saw something on the bed, so the printer stopped before printing. If the bed is clear, it was a false alarm.
  : 'Камере показалось, что на столе что-то есть, поэтому принтер остановился до начала печати. Если стол чист, это ложная тревога.'
  'The carriage was not put back: check which tool is mounted': 'Каретка не возвращена: проверьте, какой инструмент установлен'
  The chamber heater can run a filament drying cycle. Start one from the drying dialog.: 'Нагреватель камеры может запускать цикл сушки филамента. Запустите его из диалога сушки.'
  The chamber wait already ended; nothing was stopped.: 'Ожидание камеры уже закончилось; ничего не остановлено.'
  ? The change takes effect after Klipper restarts. This will restart Klipper firmware. Any active operations will be interrupted.
  : Изменение вступает в силу после перезапуска Klipper. Прошивка Klipper будет перезапущена. Активные операции будут прерваны.
  The connection to Klipper was lost: 'Связь с Klipper потеряна'
  The controller boards Klipper runs on. See their load in the system settings.: 'Платы контроллеров, на которых работает Klipper. Их загрузку можно посмотреть в системных настройках.'
  The cutter blade didn't return — check for filament wrapped around the cutting mechanism: Лезвие не вернулось. Проверьте, не намотался ли филамент на режущий механизм
  The cutter is out of alignment — recalibrate with CALIBRATE_CUT_POS: Резак смещён. Выполните повторную калибровку командой CALIBRATE_CUT_POS
  ? The exact stopping point could not be found. The print resumes at the start of the next layer and skips the rest of this one.
  : Точное место остановки не найдено. Печать продолжится с начала следующего слоя, остаток этого слоя будет пропущен.
  The extruder cannot pull it smoothly. Check the spool for a tangle or knot, and the PTFE tube for a severe bend: Экструдер не может тянуть равномерно. Проверьте катушку на запутывание или узел, а трубку PTFE на резкий изгиб
  ? The filament did not reach the nozzle. The CFS reported no error, but the toolhead sensor still sees no filament. Check that the spool is seated and the path is clear, then try again.
  : Филамент не дошёл до сопла. CFS не сообщила об ошибке, но датчик печатающей головки по-прежнему не видит филамент. Проверьте, что катушка установлена правильно и путь свободен, затем повторите попытку.
  The filament may not have fully retracted — try again or manually pull: Возможно, филамент втянут не полностью. Повторите или вытяните вручную
  The filament system needs attention: 'Системе подачи филамента требуется внимание'
  The filament system reported an error: Система филамента сообщила об ошибке
  The gap didn't close (moved {:.1f} Hz). Try a bigger turn.: "Разница не сократилась (сдвиг {:.1f} Гц). Поверните сильнее."
  The gap grew after loosening {0}. Check you turned {0}'s tensioner.: "Разница выросла после ослабления ({0}). Проверьте, что крутили натяжитель: {0}."
  The gap grew after tightening {0}. Check you turned {0}'s tensioner.: "Разница выросла после натяжения ({0}). Проверьте, что крутили натяжитель: {0}."
  The gap is not closing. Something besides tension may be shaping it.: "Разница не сокращается. Возможно, влияет что-то помимо натяжения."
  The heated bed and enclosure can dry spools placed on the bed. Start a cycle from the bed drying dialog.: 'Подогреваемый стол и корпус могут сушить катушки, лежащие на столе. Запустите цикл из диалога сушки на столе.'
  The heater can't be changed while the printer is waiting.: 'Нагреватель нельзя изменить, пока принтер ожидает.'
  The heater did not accept the printer's credentials.: 'Нагреватель не принял учётные данные принтера.'
  The heater didn't accept the command.: 'Нагреватель не принял команду.'
  The heater hasn't answered yet. Still trying.: 'Нагреватель ещё не ответил. Продолжаем попытки.'
  The heater is inhibited.: 'Нагреватель заблокирован.'
  The heater reports a fault.: 'Нагреватель сообщает о неисправности.'
  'The heater reports a fault: {}.': 'Нагреватель сообщает о неисправности: {}.'
  The heater took the target.: 'Нагреватель принял целевую температуру.'
  The heater was turned off at the heater.: 'Нагреватель был выключен на самом нагревателе.'
  The heater will cycle on and off several times.: Нагреватель будет несколько раз
    включаться и выключаться.
  The helper macros are installed and activate after Klipper restarts.: 'Вспомогательные макросы установлены и активируются после перезапуска Klipper.'
  The latch opens and {} can drop. Hold it before you continue, then put it in its dock.: Защелка откроется, и {} может упасть. Придержите его, прежде чем продолжить, затем поставьте в док.
  The left RFID reader in this CFS unit may need service: Левому RFID-считывателю этого блока CFS может требоваться обслуживание
  The loaded slot is not known yet: "Загруженный слот пока неизвестен"
  ? The loaded spool is {}, but this file was sliced for {}. Filled filament runs at a lower flow rate and needs a hardened nozzle.
  : Загружена катушка {}, но файл нарезан для {}. Филамент с наполнителем печатается с меньшим потоком и требует закалённого сопла.
  The message your printer's macros show (M117): 'Сообщение, которое показывают макросы принтера (M117)'
  ? The mounted nozzle heats to 200°C and cools again while the heater's safety model is fitted. Keep the part fan off and flammable material away from the head. This takes several minutes.
  : Установленное сопло нагреется до 200°C и снова остынет, пока определяется модель безопасности нагревателя. Держите обдув выключенным, а горючие материалы подальше от головки. Это займёт несколько минут.
  The nozzle extrudes a few short test moves in a corner, away from the print area, and repeats until it agrees with itself.: 'Сопло делает несколько коротких тестовых перемещений в углу, в стороне от зоны печати, и повторяет их до сходимости.'
  "The nozzle hasn't moved since the power went out. Check that it sits just above the top of the print, then resume.": "Сопло не двигалось с момента отключения питания. Убедитесь, что оно чуть выше верха печати, затем продолжите."
  ? The nozzle heats to 200°C while the part fan steps through its speeds. For an accurate fit, fit the duct as you print with it. This takes several minutes.
  : Сопло нагреется до 200°C, пока обдув перебирает скорости. Для точного результата установите воздуховод так же, как при печати. Это займёт несколько минут.
  The nozzle is clear of the print: Сопло не касается печати
  ? The nozzle is hot. Brush it clean with the wire brush that came with the printer and keep the docking position clean, then tap Next.
  : Сопло горячее. Очистите его металлической щёткой из комплекта, держите место парковки чистым и нажмите «Далее».
  The nozzle is lifted clear of the print and X and Y are homed. Resuming lowers it back to the height it stopped at.: "Сопло поднято над печатью, X и Y запаркованы. При продолжении оно опустится на высоту, где остановилось."
  The part on the bed is too tall to clear. Remove it, then tap Cleared.: 'Деталь на столе слишком высокая, над ней не пройти. Уберите её, затем нажмите «Очищено».'
  ? The peak of {0} left the zone. Check that only {1}'s tensioner was turned. Not sure which is which? Tap the pencil to identify the belts.
  : "Пик ({0}) вышел из зоны. Проверьте, что крутили только натяжитель: {1}. Не знаете, где какой? Коснитесь значка карандаша, чтобы определить ремни."
  The peak of {} moved out of the zone. Widening it.: "Пик ({}) вышел из зоны. Расширяем её."
  The plate and the spools are still hot. Use gloves.: Стол и катушки ещё горячие. Используйте перчатки.

  The plate finishes its current move, but drying will not start.: 'Стол завершит текущее перемещение, но сушка не начнётся.'
  The plugin can't reach the camera, so this screen takes the photos.: "Плагин не может подключиться к камере, поэтому фотографирует этот экран."
  The plugin can't save its recovery data to disk.: "Плагин не может сохранить данные для восстановления."
  The plugin couldn't install its Klipper module.: 'Плагину не удалось установить свой модуль Klipper.'
  The plugin couldn't remove its Klipper module.: 'Плагину не удалось удалить свой модуль Klipper.'
  The plugin is turned off in moonraker.conf.: "Плагин выключен в moonraker.conf."
  The print ended before any layer was printed. Nothing was changed.: Печать завершилась до первого слоя. Ничего не изменено.
  The print is canceled and you pick the best band from what has printed so far.: Печать будет отменена, и вы выберете лучшую полосу из уже напечатанного.
  The print is on its last layer.: 'Печатается последний слой.'
  ? The print is paused. Changing tools now moves the toolhead and swaps the filament at the nozzle. Resume the print once the change finishes.
  : Печать на паузе. Смена инструмента сейчас переместит печатающую головку и заменит филамент в сопле. Возобновите печать после завершения смены.
  The print is still stuck to the bed: Модель всё ещё держится на столе
  The print is waiting for the chamber to reach {}°C, but the heater is not heating.: 'Печать ждёт, пока камера нагреется до {}°C, но нагреватель не греет.'
  The print is waiting for the chamber, but the heater is not heating.: 'Печать ждёт камеру, но нагреватель не греет.'
  The printable size in millimeters (X × Y × Z), from the axis limits in the printer's Klipper config.: 'Размер области печати в миллиметрах (X × Y × Z) по пределам осей в конфигурации Klipper принтера.'
  The printer applied this value and keeps it for this tool.: 'Принтер применил это значение и сохранил его для этого инструмента.'
  The printer can draw a priming line before a print. HelixScreen offers it in the pre-print options.: 'Принтер может нарисовать линию прочистки перед печатью. HelixScreen предлагает ее в параметрах подготовки к печати.'
  The printer can measure each tool's offset automatically. Run it on the tool offset calibration screen.: 'Принтер может автоматически измерить смещение каждого инструмента. Запустите это на экране калибровки смещений инструментов.'
  The printer can measure pressure advance on its own. Run it on the PA calibration screen.: 'Принтер может сам измерить pressure advance. Запускается на экране «Калибровка PA».'
  The printer can pause at a chosen layer, for a filament swap or an insert. Set the layer from the print preview.: 'Принтер может встать на паузу на выбранном слое, для смены филамента или вставки детали. Слой задается в предпросмотре печати.'
  The printer could not work out where to resume.: Принтер не смог определить, откуда продолжить.
  The printer did not change its bed check: 'Принтер не изменил проверку стола'
  'The printer did not change its bed check: {}': 'Принтер не изменил проверку стола: {}'
  'The printer did not confirm the print started ({}). It may still start: check the printer before starting it again.': 'Принтер не подтвердил начало печати ({}). Печать ещё может начаться: проверьте принтер, прежде чем запускать её снова.'
  The printer extrudes in a corner and repeats until the readings agree. You do not judge anything by eye.: 'Принтер выдавливает пластик в углу и повторяет, пока показания не сойдутся. Ничего не нужно оценивать на глаз.'
  The printer finishes this measurement on its own.: 'Принтер завершит это измерение сам.'
  The printer halted this print and cannot resume it. Restart from the beginning?: Принтер
    остановил эту печать и не может её возобновить. Начать с начала?
  The printer has not answered the cancel yet. It stops once its start sequence finishes.: 'Принтер ещё не ответил на отмену. Он остановится, как только завершит стартовую последовательность.'
  The printer has not reported its axis limits yet.: 'Принтер ещё не сообщил пределы осей.'
  The printer has not reported its maximum velocity yet.: 'Принтер ещё не сообщил максимальную скорость.'
  ? The printer heats the nozzle, extrudes a few short test moves in a corner of the plate, and measures them itself. It repeats until the readings agree, then reports one number.
  : 'Принтер нагревает сопло, делает несколько коротких тестовых перемещений в углу стола и сам их измеряет. Он повторяет, пока показания не сойдутся, и затем сообщает одно число.'
  The printer homes and sweeps the cutter (about 1 minute). Keep the filament path clear.: Принтер ищет ноль и прощупывает резак (около 1 минуты). Держите путь филамента свободным.
  ? The printer homes, then moves the plate as far from the nozzle as it goes. Some spools are not heat-resistant enough and can deform. Nothing moves from this screen until you confirm the spools are off the bed; Mainsail, macros and prints sent from a slicer are not blocked.

  : Принтер выполнит парковку, затем отведёт стол как можно дальше от сопла. Некоторые катушки недостаточно термостойкие и могут деформироваться. С этого экрана ничего не будет двигаться, пока вы не подтвердите, что катушки сняты со стола; Mainsail, макросы и печать, отправленная из слайсера, не блокируются.

  The printer homes, then probes each screw position.: "Принтер выполняет парковку, затем измеряет каждую позицию винта."
  The printer is not homed. Continuing will home all axes, moving the toolhead. Make sure the bed is clear.: Принтер не запаркован. Продолжение выполнит парковку всех осей, печатающая головка переместится. Убедитесь, что стол свободен.
  The printer is shut down.: 'Принтер выключен.'
  ? The printer is waiting for the chamber to reach a temperature, and only an emergency stop and a firmware restart end that wait. The print stops at once and cannot be resumed.
  : 'Принтер ждёт, пока камера достигнет температуры, и прервать это ожидание могут только аварийная остановка и перезапуск прошивки. Печать остановится сразу, продолжить её будет нельзя.'
  The printer isn't detecting that any filament is currently loaded. What would you like to do?: Принтер не обнаруживает загруженный филамент. Что вы хотите сделать?
  The printer kept printing after the cancel.: 'Принтер продолжил печать после отмены.'
  The printer lost power during a print. It can resume where it left off.: Принтер потерял питание во время печати. Он может продолжить с места остановки.
  The printer lost power during a print. The resumed layer may not line up exactly.: Принтер потерял питание во время печати. Возобновлённый слой может не совпасть точно.
  The printer lost power while printing {}. Resume where it left off?: Принтер потерял питание при печати {}. Продолжить с места остановки?
  The printer lost power while printing {}. The resumed layer may not line up exactly.: Принтер потерял питание при печати {}. Возобновлённый слой может не совпасть точно.
  The printer moves the toolhead and measures its motors.: 'Принтер перемещает печатающую головку и измеряет моторы.'
  The printer no longer has a print to resume.: У принтера больше нет печати для продолжения.
  The printer reads the file up to the last saved position. A large file can take a minute.: Принтер читает файл до последней сохранённой позиции. Большой файл может занять минуту.
  The printer records lane {} in the toolhead, not this one: 'По записи принтера в печатающей головке канал {}, а не этот'
  'The printer refused that port: check the port (Moonraker is usually 7125).': "Принтер отклонил этот порт: проверьте порт (Moonraker обычно использует 7125)."
  The printer rejected the filament configuration. The print was not started.: Принтер
    отклонил конфигурацию филамента. Печать не была запущена.
  The printer reports measured fan speeds. HelixScreen shows them on the Fans screen.: 'Принтер сообщает измеренные скорости вентиляторов. HelixScreen показывает их на экране «Вентиляторы».'
  The printer reports no lane record, so only clearing the extruder can unload it.: 'Принтер не сообщает запись канала, поэтому выгрузить можно только очисткой экструдера.'
  The printer swaps between several toolheads. Manage the tools on the filament system screen.: 'Принтер переключается между несколькими печатающими головками. Инструментами можно управлять на экране системы филамента.'
  The printer's firmware chooses where to switch on runout: Прошивка принтера сама выбирает, на что переключиться при обрыве
  The requested position is outside the printer's bounds: 'Запрошенная позиция находится за пределами рабочей области принтера'
  The right RFID reader in this CFS unit may need service: Правому RFID-считывателю этого блока CFS может требоваться обслуживание
  The runout sensor indicates no filament is loaded. Start print anyway?: Датчик окончания
    филамента показывает, что филамент не загружен. Всё равно начать печать?
  The saved position is kept. Reconnect or restart the screen to be offered the resume again.: Сохранённая позиция остаётся. Переподключитесь или перезапустите экран, чтобы снова получить предложение продолжить.
  The sensor in this CFS unit cannot be read. Check its connection, or the unit may need service: Не удаётся считать датчик этого блока CFS. Проверьте подключение, иначе блоку требуется обслуживание
  The speed of one fan you choose: Скорость выбранного вентилятора
  The time, date, and system uptime: Время, дата и время работы системы
  The timelapse or logs folder overlaps a protected folder, so cleanup is off.: "Папка таймлапсов или журналов пересекается с защищённой папкой, поэтому очистка выключена."
  The tool change under way finished, and the tool was not parked: 'Текущая смена инструмента завершена, инструмент не припаркован'
  The tool change under way finished, and {} was not put back on the carriage: 'Текущая смена инструмента завершена, {} не возвращён на каретку'
  The toolhead has filament but no AMS slot reports it loaded. Pull it out manually before printing. Start anyway?: В печатающей головке есть филамент, но ни один слот AMS не сообщает о его загрузке. Извлеките его вручную перед печатью. Всё равно начать?
  ? The toolhead has filament but no AMS slot reports it loaded. The printer may refuse to load a slot until it is cleared. Start anyway?
  : 'В печатающей головке есть филамент, но ни один слот AMS не сообщает о его загрузке. Принтер может отказаться загружать слот, пока она не будет очищена. Всё равно начать?'
  The toolhead sensor indicates filament is already loaded. Proceed with load anyway?: Датчик
    печатающей головки показывает, что филамент уже загружен. Всё равно продолжить
    загрузку?
  The toolhead sensor indicates no filament is present. Proceed with unload anyway?: Датчик
    печатающей головки показывает, что филамент отсутствует. Всё равно продолжить
    выгрузку?
  The unit is already running another operation. Wait for it to finish, or reset the CFS if it stays stuck: Блок уже выполняет другую операцию. Дождитесь её завершения или сбросьте CFS, если он завис
  The unit reported a fault with no further detail. Restart the printer if it repeats: Блок сообщил о неисправности без подробностей. Если повторится, перезапустите принтер
  The unit's onboard storage has failed. The CFS mainboard needs replacing: Встроенная память блока вышла из строя. Требуется замена материнской платы CFS
  'The unload did not start: unload by hand, then start again': 'Выгрузка не началась: выгрузите вручную и начните заново'
  The unload finishes on its own, but the plate will not move.: 'Выгрузка завершится сама, но стол не будет перемещаться.'
  Theme: Тема
  Theme Colors: Цвета темы
  Theme Preset: Пресет темы
  Theme changes apply after restart.: Изменения темы применяются после перезапуска.
  Theme reset to defaults: Тема сброшена к настройкам по умолчанию
  'Theme: ': 'Тема: '
  There is no cycle to stop: 'Нет цикла для остановки'
  ? There is not enough free memory to run this test. Klipper's analysis would run out of memory and leave the printer stuck until it is power-cycled.
  : "Для этого теста недостаточно свободной памяти. Анализу Klipper не хватит памяти, и принтер зависнет, пока его не выключат и снова не включат."
  These readings aren't repeatable, so tuning can't be steered. Check the mechanics first.: "Эти показания не повторяются, поэтому настройкой нельзя управлять. Сначала проверьте механику."
  'These tools have a different filament grade loaded:': 'В этих инструментах загружен филамент другой марки:'
  'These tools have incompatible materials loaded:': 'В этих инструментах загружены
    несовместимые материалы:'
  'These tools have no filament loaded:': 'В эти инструменты не загружен филамент:'
  'These tools have no matching filament loaded:': 'В этих инструментах нет подходящего
    филамента:'
  This .3mf has no sliced plate to print.: 'В этом .3mf нет нарезанной пластины для печати.'
  This .3mf has to be converted to G-code before it can be queued. Print it from here instead.: 'Этот .3mf нужно преобразовать в G-code, прежде чем ставить в очередь. Напечатайте его отсюда.'
  This .3mf has to be converted to G-code on the printer before it can print.: 'Этот .3mf нужно преобразовать в G-code на принтере, прежде чем его можно будет напечатать.'
  This AFC system does not support bypass mode: 'Эта система AFC не поддерживает режим обхода'
  This CFS firmware exposes no external spool slot: 'Эта прошивка CFS не предоставляет слот для внешней катушки'
  This Happy Hare system does not support bypass mode: 'Эта система Happy Hare не поддерживает режим обхода'
  This Moonraker version can't hold uploads. Update Moonraker.: "Эта версия Moonraker не умеет задерживать загрузки. Обновите Moonraker."
  This button controls: Эта кнопка управляет
  This calibration uses the paper friction method to set your Z-offset.: Эта калибровка
    использует метод трения бумаги об сопло для установки Z-смещения.
  This cannot be undone.: Это действие нельзя отменить.
  This channel offers v{}, older than the installed v{}. Anything added since then will be removed.: 'Этот канал предлагает v{}, старее установленной v{}. Всё добавленное с тех пор будет удалено.'
  ? "This check runs Klipper's resonance test along each belt path and compares the two responses. Balanced belts give curves of the same shape, with peaks at the same frequencies.\n\nEach sweep takes a few minutes and moves the toolhead; keep clear of the printer while it runs."
  : "Эта проверка запускает резонансный тест Klipper по каждому пути ремня и сравнивает два отклика. Сбалансированные ремни дают кривые одинаковой формы с пиками на одних и тех же частотах.\n\nКаждый свип занимает несколько минут и перемещает печатающую головку; держитесь подальше от принтера во время работы."
  This clears every Endless Spool backup. The print will stop on runout until you set up Endless Spool again.: Это очистит все резервы бесконечной катушки. Печать будет останавливаться при окончании филамента, пока вы снова не настроите бесконечную катушку.
  This device has no wired network connection. If you turn WiFi off, it can only be turned back on from this screen.: У этого устройства нет проводного подключения к сети. Если выключить WiFi, включить его обратно можно будет только с этого экрана.
  ? This device has only {} MB of RAM. Resonance calibration is memory-intensive and can make the printer firmware report a "Timer Too Close" error or restart mid-test. Continue anyway?
  : На этом устройстве всего {} МБ ОЗУ. Калибровка резонансов требует много памяти и может привести к тому, что прошивка принтера сообщит об ошибке "Timer Too Close" или перезапустится во время теста. Всё равно продолжить?
  ? This device has very little RAM. Resonance calibration is memory-intensive and may cause a "Timer Too Close" error. Continue anyway?
  : На этом устройстве очень мало ОЗУ. Калибровка резонансов требует много памяти и может вызвать ошибку "Timer Too Close". Всё равно продолжить?
  This doesn't match the linked Spoolman spool. Add it as a new spool, or update the linked one to match?: Это не совпадает с привязанной катушкой Spoolman. Добавить как новую катушку или обновить привязанную?
  This dryer cannot run while filament from the unit is loaded: 'Сушилка не может работать, пока загружен филамент из этого узла'
  This feature failed to start. The Moonraker log says why.: "Эта функция не запустилась. Причина в журнале Moonraker."
  This feature requires different hardware or configuration: Для этой функции требуется другое оборудование или конфигурация
  This feature stopped. Restart Moonraker to start it again.: "Эта функция остановилась. Перезапустите Moonraker, чтобы запустить её снова."
  This filament system does not report buffer or flow data.: Эта система филамента не сообщает данные буфера и потока.
  This file prints {0} and {1} through one nozzle. {0} can burn and clog the nozzle at {1} temperatures.: 'Этот файл печатает {0} и {1} через одно сопло. При температурах {1} материал {0} может пригореть и забить сопло.'
  This file prints {0} and {1} together. The chamber and bed heat {1} needs can soften {0} and jam its nozzle.: 'Этот файл печатает {0} и {1} вместе. Нагрев камеры и стола, нужный для {1}, может размягчить {0} и забить его сопло.'
  This file was sliced for {} but {} is loaded.: Файл нарезан для {}, но загружен
    {}.
  This file was sliced for {}, but {} is loaded. It will print slower and hotter than the loaded spool needs.: Файл нарезан для {}, но загружен {}. Печать будет медленнее и горячее, чем требуется загруженной катушке.
  This firmware can only switch slots by loading them: 'Эта прошивка может переключать слоты только загрузкой'
  ? This installs the HelixScreen helper macros on the printer and adds them to printer.cfg. A print is running, so Klipper restarts after it finishes.
  : 'Это установит вспомогательные макросы HelixScreen на принтер и добавит их в printer.cfg. Идёт печать, поэтому Klipper перезапустится после её завершения.'
  This installs the HelixScreen helper macros on the printer, adds them to printer.cfg, and restarts Klipper.: 'Это установит вспомогательные макросы HelixScreen на принтер, добавит их в printer.cfg и перезапустит Klipper.'
  'This is an emergency stop: the printer halts and Klipper restarts.': 'Это аварийный останов: принтер останавливается, и Klipper перезапускается.'
  This is exactly the data that will be sent: Это именно те данные, которые будут
    отправлены
  This is what data would be sent if enabled: Эти данные были бы отправлены при включении
  This looks like a {}, but it is set up as a {}: Похоже, это {}, но принтер настроен как {}
  This may take up to 30 seconds: Это может занять до 30 секунд
  This needs the plugin's file analysis, which isn't running.: "Нужен анализ файлов плагина, но он не запущен."
  This plugin asks for no special permissions.: 'Этот плагин не запрашивает специальных разрешений.'
  This plugin lets HelixScreen control print start options like bed mesh and QGL.: 'Этот плагин позволяет HelixScreen управлять опциями начала печати, такими как сетка стола и QGL.'
  This print can't be resumed. Restart it, or turn off the bed check if it keeps happening.: 'Эту печать нельзя продолжить. Перезапустите её или отключите проверку стола, если это повторяется.'
  This print does not report layers, so no layer pause can be scheduled.: 'Эта печать не сообщает слои, поэтому паузу на слое запланировать нельзя.'
  This print needs about %.0fg but the spool has about %.0fg remaining. Start anyway?: Для
    этой печати нужно около %.0fг, но на катушке осталось около %.0fг. Всё равно начать?
  This print never reports layer {}.: 'Эта печать никогда не сообщает слой {}.'
  This printer cannot calibrate tool offsets automatically: Этот принтер не может калибровать смещения инструментов автоматически
  This printer fills its gates from Spoolman. HelixScreen cleared its own copy; remove the spool in Spoolman.: Этот принтер берёт данные шлюзов из Spoolman. HelixScreen очистил свою копию; удалите катушку в Spoolman.
  This printer fills its gates from Spoolman. Make color, material and spool changes in Spoolman.: Этот принтер берёт данные шлюзов из Spoolman. Меняйте цвет, материал и катушку в Spoolman.
  This printer has no IFS.: "У этого принтера нет IFS."
  This printer has no INDX LOAD_FILAMENT macro: "На этом принтере нет макроса INDX LOAD_FILAMENT"
  This printer has no automatic unload. Cut the filament at the head and pull it out by hand.: У этого принтера нет автоматической выгрузки. Отрежьте филамент у головки и вытащите его вручную.
  This printer has no nozzle force sensor.: 'У этого принтера нет датчика усилия на сопле.'
  ? This printer looks like a {} ({}% confidence), but it is set up as a {}. A wrong type applies incorrect pre-print options and presets.
  : Этот принтер похож на {} (уверенность {}%), но настроен как {}. Неверный тип применяет неправильные параметры перед печатью и пресеты.
  "This printer's INDX macros are missing: {}": "В макросах INDX этого принтера отсутствует: {}"
  This printer's network service controls the WiFi radio: WiFi-модулем управляет сетевая служба этого принтера
  This printer's network service manages saved WiFi networks: Сохранёнными сетями WiFi управляет сетевая служба этого принтера
  This printer's screen has not shared a layout: "Экран этого принтера не поделился раскладкой"
  ? This removes the plugin's Moonraker component and restarts Moonraker. The printer will briefly disconnect. If old phase-tracking lines are still in PRINT_START, they are removed too, with backups kept. A Klipper restart applies that.
  : Это удаляет компонент Moonraker плагина и перезапускает Moonraker. Принтер ненадолго отключится. Если в PRINT_START всё ещё остались старые строки отслеживания фаз, они также удаляются, при этом резервные копии сохраняются. Перезапуск Klipper применяет эти изменения.
  This replaces the printer's helper macros with the current version and restarts Klipper.: 'Это заменит вспомогательные макросы принтера текущей версией и перезапустит Klipper.'
  ? This replaces the printer's helper macros with the current version. A print is running, so Klipper restarts after it finishes.
  : 'Это заменит вспомогательные макросы принтера текущей версией. Идёт печать, поэтому Klipper перезапустится после её завершения.'
  This replaces this screen's home layout for this printer with the one on the printer's own screen.: "Раскладка главного экрана этого экрана для данного принтера будет заменена раскладкой с экрана самого принтера."
  This resume needs a newer version of HelixScreen.: Для этого продолжения нужна более новая версия HelixScreen.
  This slot feeds no tool: 'Этот слот не подаёт филамент ни в один инструмент'
  This spool's details haven't loaded from Spoolman yet. Try Save again.: 'Данные этой катушки ещё не загружены из Spoolman. Нажмите «Сохранить» ещё раз.'
  This system does not support bypass mode: 'Эта система не поддерживает режим обхода'
  This tool probes each bed screw and tells you how much to adjust.: Этот инструмент
    проверяет каждый винт стола и показывает, насколько его нужно отрегулировать.
  'This update asks for new permissions:': 'Это обновление запрашивает новые разрешения:'
  'This wait ends only at its temperature: canceling takes an emergency stop and a firmware restart.': 'Это ожидание заканчивается только по достижении температуры: для отмены нужны аварийная остановка и перезапуск прошивки.'
  ? This will apply the Z-offset to your endstop and restart Klipper to save the configuration.
    The printer will briefly disconnect.
  : Z-offset будет применён к вашему концевику, и Klipper перезапустится для сохранения
    конфигурации. Принтер ненадолго отключится.
  ? This will apply the Z-offset to your probe and restart Klipper to save the configuration.
    The printer will briefly disconnect.
  : Z-offset будет применён к вашему зонду, и Klipper перезапустится для сохранения
    конфигурации. Принтер ненадолго отключится.
  ? This will collect system info, logs, settings, and printer data to help diagnose
    issues. No passwords or sensitive data will be included.
  : Будут собраны системная информация, логи, настройки и данные принтера для диагностики.
    Пароли и конфиденциальные данные включены не будут.
  This will immediately halt all printer operations. The printer will require a restart to resume.: Это
    немедленно остановит все операции принтера. Для продолжения потребуется перезапуск.
  This will remove all custom pages and restore the default widget layout.: Все пользовательские
    страницы будут удалены, и будет восстановлен макет виджетов по умолчанию.
  This will remove all entries from the display.: Это удалит все записи с экрана.
  This will remove the Spoolman configuration from Moonraker and restart the service.: Конфигурация
    Spoolman будет удалена из Moonraker, и сервис будет перезапущен.
  This will reset all settings to defaults. This action cannot be undone.: Это сбросит
    все настройки к значениям по умолчанию. Это действие нельзя отменить.
  This will restart Klipper firmware. Any active operations will be interrupted.: Прошивка
    Klipper будет перезапущена. Активные операции будут прерваны.
  This will restart Klipper.: Это перезапустит Klipper.
  This will restore the default jog step distances for all three modes.: Это восстановит шаги перемещения по умолчанию для всех трёх режимов.
  This will save the Z-offset and restart Klipper to write the configuration. The printer will briefly disconnect.: Z-offset будет сохранён, и Klipper перезапустится для записи конфигурации. Принтер ненадолго отключится.
  ? This writes the tool offsets to the printer's config and restarts Klipper, which takes a few seconds. Until then they apply only to this session.
  : Смещения инструментов будут записаны в конфигурацию принтера, и Klipper перезапустится, это займёт несколько секунд. До этого они действуют только в текущем сеансе.
  ? This {0} is set up for {1}, but it looks stock ({2}% confidence). A wrong profile applies incorrect pre-print options and presets.
  : 'Этот {0} настроен для {1}, но выглядит стоковым (уверенность {2}%). Неверный профиль применяет неправильные параметры перед печатью и пресеты.'
  ? This {0} looks like it has {1} ({2}% confidence), but it is set up as stock. A wrong profile applies incorrect pre-print options and presets.
  : 'Похоже, на этом {0} есть {1} (уверенность {2}%), но он настроен как стоковый. Неверный профиль применяет неправильные параметры перед печатью и пресеты.'
  ? This {0} looks like it has {1} ({2}% confidence), but it is set up for {3}. A wrong profile applies incorrect pre-print options and presets.
  : 'Похоже, на этом {0} есть {1} (уверенность {2}%), но он настроен для {3}. Неверный профиль применяет неправильные параметры перед печатью и пресеты.'
