  ? "Matched belts give curves of the same shape. When the tallest peak on one path has no partner on the other, something besides tension is shaping the response:\n\n- a worn, frayed or mis-tracking belt\n- a loose or slipping pulley grub screw\n- an idler or bearing that binds\n- debris in the teeth, or a belt rubbing a flange\n- a loose accelerometer mount\n\nTuning still follows the zone that moved with the turn, but check these before chasing a perfect match."
  : "Gleich gespannte Riemen ergeben Kurven gleicher Form. Hat die höchste Spitze eines Pfads kein Gegenstück auf dem anderen, prägt etwas anderes als die Spannung die Antwort:\n\n- ein abgenutzter, ausgefranster oder schief laufender Riemen\n- eine lose oder rutschende Madenschraube am Pulley\n- eine klemmende Umlenkrolle oder ein Lager\n- Schmutz in den Zähnen oder ein Riemen, der an einem Bund schleift\n- eine lose Beschleunigungssensor-Halterung\n\nDie Einstellung folgt weiter der Zone, die sich mit der Drehung bewegt hat, aber prüfe diese Punkte, bevor du einem perfekten Abgleich nachjagst."
