  This tool probes each bed screw and tells you how much to adjust.: Cet outil palpe
    chaque vis du plateau et vous indique combien ajuster.
  ? This will apply the Z-offset to your endstop and restart Klipper to save the configuration.
    The printer will briefly disconnect.
  : Cela appliquera le Z-offset à votre butée et redémarrera Klipper pour enregistrer
    la configuration. L'imprimante se déconnectera brièvement.
  ? This will apply the Z-offset to your probe and restart Klipper to save the configuration.
    The printer will briefly disconnect.
  : Cela appliquera le Z-offset à votre sonde et redémarrera Klipper pour enregistrer
    la configuration. L'imprimante se déconnectera brièvement.
  ? This will collect system info, logs, settings, and printer data to help diagnose
    issues. No passwords or sensitive data will be included.
  : Cela collectera les infos système, journaux, paramètres et données de l'imprimante
    pour aider à diagnostiquer les problèmes. Aucun mot de passe ni donnée sensible
    ne sera inclus.
