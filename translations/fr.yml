  ? The HelixPrint plugin enables fast G-code modifications directly on your printer—like
    skipping bed mesh for quick reprints.
  : Le plugin HelixPrint permet des modifications rapides du G-code directement sur
    votre imprimante—comme ignorer le maillage du plateau pour des réimpressions rapides.
  ? The animated screensaver has been turned off on this device to prevent it from
    interfering with prints. You can re-enable it in Settings > Display.
  : L'économiseur d'écran animé a été désactivé sur cet appareil pour éviter qu'il
    n'interfère avec les impressions. Vous pouvez le réactiver dans Paramètres > Affichage
    et son.
  ? The filament did not reach the nozzle. The CFS reported no error, but the toolhead sensor still sees no filament. Check that the spool is seated and the path is clear, then try again.
  : Le filament n'est pas arrivé à la buse. Le CFS n'a signalé aucune erreur, mais le capteur de tête d'outil ne détecte toujours pas de filament. Vérifiez que la bobine est bien en place et que le chemin est dégagé, puis réessayez.
  The filament system reported an error: Le système de filament a signalé une erreur
  The heater will cycle on and off several times.: Le chauffage s'allumera et s'éteindra
    plusieurs fois.
  ? The loaded spool is {}, but this file was sliced for {}. Filled filament runs at a lower flow rate and needs a hardened nozzle.
  : La bobine chargée est {}, mais ce fichier a été tranché pour {}. Un filament chargé fonctionne à un débit plus faible et nécessite une buse durcie.
  ? "The motor vibrates the belt while a strobe light flashes at the same frequency. When the belt appears to stand still (frozen), you have found the resonant frequency.\n\nUse the frequency buttons to sweep through values until the belt looks stationary, then lock the reading."
  : "Le moteur fait vibrer la courroie tandis qu'un stroboscope clignote à la même fréquence. Lorsque la courroie semble immobile (figée), vous avez trouvé la fréquence de résonance.\n\nUtilisez les boutons de fréquence pour balayer les valeurs jusqu'à ce que la courroie paraisse immobile, puis verrouillez la lecture."
  ? The print is paused. Changing tools now moves the toolhead and swaps the filament at the nozzle. Resume the print once the change finishes.
  : L'impression est en pause. Changer d'outil maintenant déplace la tête d'impression et remplace le filament au niveau de la buse. Reprenez l'impression une fois le changement terminé.
  The printer halted this print and cannot resume it. Restart from the beginning?: L'imprimante
    a arrêté cette impression et ne peut pas la reprendre. Redémarrer depuis le début
    ?
  The printer is not homed. Continuing will home all axes, moving the toolhead. Make sure the bed is clear.: L'imprimante n'est pas référencée. Continuer référencera tous les axes et déplacera la tête d'outil. Assurez-vous que le plateau est dégagé.
  The printer lost power during a print. It can resume where it left off.: 'L''imprimante
    a été mise hors tension pendant une impression. Elle peut reprendre là où elle
    s''est arrêtée.'
  The printer lost power during a print. The resumed layer may not line up exactly.: L'imprimante a été mise hors tension pendant une impression. La couche reprise peut ne pas s'aligner exactement.
  The printer lost power while printing {}. Resume where it left off?: 'L''imprimante
    a été mise hors tension pendant l''impression de {}. Reprendre là où elle s''est
    arrêtée ?'
  The printer lost power while printing {}. The resumed layer may not line up exactly.: L'imprimante a été mise hors tension pendant l'impression de {}. La couche reprise peut ne pas s'aligner exactement.
  The printer rejected the filament configuration. The print was not started.: L'imprimante
    a rejeté la configuration du filament. L'impression n'a pas été démarrée.
  The printer's firmware chooses the backup spool itself: Le firmware de l'imprimante choisit lui-même la bobine de secours
  The runout sensor indicates no filament is loaded. Start print anyway?: Le capteur
    de fin de filament indique qu'aucun filament n'est chargé. Démarrer l'impression
    quand même ?
  The toolhead has filament but no AMS lane reports it loaded. Pull it out manually before printing. Start anyway?: La tête d'outil contient du filament mais aucune voie de l'AMS ne le signale comme chargé. Retirez-le manuellement avant d'imprimer. Démarrer quand même ?
  ? The toolhead has filament but no AMS lane reports it loaded. The printer may refuse to load a lane until it is cleared. Start anyway?
  : 'La tête d''outil contient du filament mais aucune voie de l''AMS ne le signale comme chargé. L''imprimante peut refuser de charger une voie tant qu''elle n''est pas vidée. Démarrer quand même ?'
  The toolhead sensor indicates filament is already loaded. Proceed with load anyway?: Le
    capteur de la tête d'outil indique que du filament est déjà chargé. Procéder au
    chargement quand même ?
  The toolhead sensor indicates no filament is present. Proceed with unload anyway?: Le
    capteur de la tête d'outil indique qu'aucun filament n'est présent. Procéder au
    déchargement quand même ?
