  ? "Matched belts give curves of the same shape. When the tallest peak on one path has no partner on the other, something besides tension is shaping the response:\n\n- a worn, frayed or mis-tracking belt\n- a loose or slipping pulley grub screw\n- an idler or bearing that binds\n- debris in the teeth, or a belt rubbing a flange\n- a loose accelerometer mount\n\nTuning still follows the zone that moved with the turn, but check these before chasing a perfect match."
  : "Des courroies égales donnent des courbes de même forme. Quand le pic le plus haut d'un chemin n'a pas d'équivalent sur l'autre, autre chose que la tension façonne la réponse :\n\n- une courroie usée, effilochée ou qui dévie\n- une vis sans tête de poulie desserrée ou qui patine\n- un galet ou un roulement qui accroche\n- des débris dans les dents, ou une courroie qui frotte une joue\n- un support d'accéléromètre desserré\n\nLe réglage suit la zone qui a bougé avec le tour, mais vérifiez ces points avant de viser un accord parfait."
