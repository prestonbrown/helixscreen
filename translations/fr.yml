  'This wait ends only at its temperature: canceling takes an emergency stop and a firmware restart.': 'Cette attente ne se termine qu''à sa température : l''annulation nécessite un arrêt d''urgence et un redémarrage du firmware.'
  ? This will apply the Z-offset to your endstop and restart Klipper to save the configuration.
    The printer will briefly disconnect.
  : Cela appliquera le Z-offset à votre butée et redémarrera Klipper pour enregistrer
    la configuration. L'imprimante se déconnectera brièvement.
  ? This will apply the Z-offset to your probe and restart Klipper to save the configuration.
    The printer will briefly disconnect.
  : Cela appliquera le Z-offset à votre sonde et redémarrera Klipper pour enregistrer
    la configuration. L'imprimante se déconnectera brièvement.
  ? This will collect system info, logs, settings, and printer data to help diagnose
    issues. No passwords or sensitive data will be included.
  : Cela collectera les infos système, journaux, paramètres et données de l'imprimante
    pour aider à diagnostiquer les problèmes. Aucun mot de passe ni donnée sensible
    ne sera inclus.
  This will immediately halt all printer operations. The printer will require a restart to resume.: Cela
    arrêtera immédiatement toutes les opérations de l'imprimante. L'imprimante nécessitera
    un redémarrage pour reprendre.
  This will remove all custom pages and restore the default widget layout.: Toutes
    les pages personnalisées seront supprimées et la disposition des widgets par défaut
    sera restaurée.
  This will remove all entries from the display.: Cela supprimera toutes les entrées
    de l'affichage.
  This will remove the Spoolman configuration from Moonraker and restart the service.: Cela
    supprimera la configuration Spoolman de Moonraker et redémarrera le service.
  This will reset all settings to defaults. This action cannot be undone.: Cela réinitialisera
    tous les paramètres par défaut. Cette action ne peut pas être annulée.
  This will restart Klipper firmware. Any active operations will be interrupted.: Le
    firmware Klipper sera redémarré. Les opérations actives seront interrompues.
  This will restart Klipper.: Cela redémarrera Klipper.
  This will restore the default jog step distances for all three modes.: Cela restaurera les distances de pas par défaut pour les trois modes.
  This will save the Z-offset and restart Klipper to write the configuration. The printer will briefly disconnect.: Cela enregistrera le Z-offset et redémarrera Klipper pour enregistrer la configuration. L'imprimante se déconnectera brièvement.
