  The gap grew after tightening {0}. Check you turned {0}'s tensioner.: "La diferencia creció tras tensar {0}. Comprueba que giraste el tensor de {0}."
  The gap is not closing. Something besides tension may be shaping it.: "La diferencia no se cierra. Algo distinto de la tensión puede estar influyendo."
  The heated bed and enclosure can dry spools placed on the bed. Start a cycle from the bed drying dialog.: 'La cama caliente y la cámara pueden secar bobinas colocadas sobre la cama. Inicia un ciclo desde el diálogo de secado de la cama.'
  The heater can't be changed while the printer is waiting.: 'No se puede cambiar el calentador mientras la impresora espera.'
  The heater did not accept the printer's credentials.: 'El calentador no aceptó las credenciales de la impresora.'
  The heater didn't accept the command.: 'El calentador no aceptó el comando.'
  The heater hasn't answered yet. Still trying.: 'El calentador aún no ha respondido. Sigue intentándolo.'
  The heater is inhibited.: 'El calentador está inhibido.'
  The heater reports a fault.: 'El calentador informa de un fallo.'
