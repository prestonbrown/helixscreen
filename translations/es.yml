  ? "Matched belts give curves of the same shape. When the tallest peak on one path has no partner on the other, something besides tension is shaping the response:\n\n- a worn, frayed or mis-tracking belt\n- a loose or slipping pulley grub screw\n- an idler or bearing that binds\n- debris in the teeth, or a belt rubbing a flange\n- a loose accelerometer mount\n\nTuning still follows the zone that moved with the turn, but check these before chasing a perfect match."
  : "Correas igualadas dan curvas de la misma forma. Cuando el pico más alto de una ruta no tiene pareja en la otra, algo distinto de la tensión está dando forma a la respuesta:\n\n- una correa gastada, deshilachada o desalineada\n- un prisionero de polea flojo o que patina\n- una polea loca o un rodamiento que se traba\n- suciedad en los dientes, o una correa que roza una pestaña\n- un soporte del acelerómetro flojo\n\nEl ajuste sigue la zona que se movió con el giro, pero revisa esto antes de buscar una igualación perfecta."
