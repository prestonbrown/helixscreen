    su impresora, como omitir la malla de cama para reimpresiones rápidas.
  ? The animated screensaver has been turned off on this device to prevent it from
    interfering with prints. You can re-enable it in Settings > Display.
  : El salvapantallas animado se ha desactivado en este dispositivo para evitar que
    interfiera con las impresiones. Puede volver a activarlo en Ajustes > Pantalla.
  ? The filament did not reach the nozzle. The CFS reported no error, but the toolhead sensor still sees no filament. Check that the spool is seated and the path is clear, then try again.
  : El filamento no llegó a la boquilla. El CFS no informó ningún error, pero el sensor del cabezal sigue sin detectar filamento. Compruebe que la bobina esté bien colocada y que el recorrido esté despejado, y vuelva a intentarlo.
  The filament system reported an error: El sistema de filamento informó un error
  The heater will cycle on and off several times.: El calentador se encenderá y apagará
    varias veces.
  ? The loaded spool is {}, but this file was sliced for {}. Filled filament runs at a lower flow rate and needs a hardened nozzle.
  : La bobina cargada es {}, pero este archivo se laminó para {}. El filamento con relleno funciona con un caudal menor y necesita una boquilla endurecida.
  ? "The motor vibrates the belt while a strobe light flashes at the same frequency. When the belt appears to stand still (frozen), you have found the resonant frequency.\n\nUse the frequency buttons to sweep through values until the belt looks stationary, then lock the reading."
  : "El motor hace vibrar la correa mientras una luz estroboscópica parpadea a la misma frecuencia. Cuando la correa parece quedarse quieta (congelada), has encontrado la frecuencia de resonancia.\n\nUsa los botones de frecuencia para recorrer los valores hasta que la correa parezca estar inmóvil, luego bloquea la lectura."
  ? The print is paused. Changing tools now moves the toolhead and swaps the filament at the nozzle. Resume the print once the change finishes.
  : La impresión está pausada. Cambiar de herramienta ahora mueve el cabezal y cambia
    el filamento en la boquilla. Reanude la impresión una vez que el cambio termine.
  The printer halted this print and cannot resume it. Restart from the beginning?: La
    impresora detuvo esta impresión y no puede reanudarla. ¿Reiniciar desde el principio?
  The printer is not homed. Continuing will home all axes, moving the toolhead. Make sure the bed is clear.: La impresora no está referenciada. Si continúa, se referenciarán todos los ejes y el cabezal se moverá. Asegúrese de que la cama esté despejada.
  The printer lost power during a print. It can resume where it left off.: La impresora
    perdió corriente durante una impresión. Puede reanudar donde se quedó.
  The printer lost power during a print. The resumed layer may not line up exactly.: La impresora perdió corriente durante una impresión. La capa reanudada puede no alinearse con exactitud.
  The printer lost power while printing {}. Resume where it left off?: La impresora
    perdió corriente mientras imprimía {}. ¿Reanudar donde se quedó?
  The printer lost power while printing {}. The resumed layer may not line up exactly.: La impresora perdió corriente mientras imprimía {}. La capa reanudada puede no alinearse con exactitud.
  The printer rejected the filament configuration. The print was not started.: La
    impresora rechazó la configuración de filamento. La impresión no se inició.
  The printer's firmware chooses the backup spool itself: El firmware de la impresora elige la bobina de respaldo
  The runout sensor indicates no filament is loaded. Start print anyway?: El sensor
    de agotamiento indica que no hay filamento cargado. ¿Iniciar la impresión de todos
    modos?
  The toolhead has filament but no AMS lane reports it loaded. Pull it out manually before printing. Start anyway?: El cabezal tiene filamento, pero ningún carril del AMS informa que esté cargado. Retírelo manualmente antes de imprimir. ¿Iniciar de todos modos?
  ? The toolhead has filament but no AMS lane reports it loaded. The printer may refuse to load a lane until it is cleared. Start anyway?
  : 'El cabezal tiene filamento, pero ningún carril del AMS informa que esté cargado. La impresora puede negarse a cargar un carril hasta que se vacíe. ¿Iniciar de todos modos?'
