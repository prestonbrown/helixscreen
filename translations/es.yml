    varias veces.
  The helper macros are installed and activate after Klipper restarts.: 'Las macros de ayuda están instaladas y se activan tras reiniciar Klipper.'
  The latch opens and {} can drop. Hold it before you continue, then put it in its dock.: El cierre se abre y {} puede caer. Sujétela antes de continuar y luego colóquela en su base.
  The left RFID reader in this CFS unit may need service: Puede que el lector RFID izquierdo de esta unidad CFS necesite servicio
  The loaded slot is not known yet: "La ranura cargada aún no se conoce"
  ? The loaded spool is {}, but this file was sliced for {}. Filled filament runs at a lower flow rate and needs a hardened nozzle.
  : La bobina cargada es {}, pero este archivo se laminó para {}. El filamento con relleno funciona con un caudal menor y necesita una boquilla endurecida.
  The message your printer's macros show (M117): 'El mensaje que muestran las macros de tu impresora (M117)'
  ? The mounted nozzle heats to 200°C and cools again while the heater's safety model is fitted. Keep the part fan off and flammable material away from the head. This takes several minutes.
  : La boquilla montada se calienta a 200°C y vuelve a enfriarse mientras se ajusta el modelo de seguridad del calentador. Mantenga apagado el ventilador de pieza y el material inflamable lejos del cabezal. Esto tarda varios minutos.
  The nozzle extrudes a few short test moves in a corner, away from the print area, and repeats until it agrees with itself.: 'La boquilla hace unos movimientos de prueba cortos en una esquina, lejos de la zona de impresión, y repite hasta que los valores coinciden.'
  "The nozzle hasn't moved since the power went out. Check that it sits just above the top of the print, then resume.": "La boquilla no se ha movido desde el corte de energía. Compruebe que quede justo por encima de la parte superior de la impresión y luego reanude."
  ? The nozzle heats to 200°C while the part fan steps through its speeds. For an accurate fit, fit the duct as you print with it. This takes several minutes.
  : La boquilla se calienta a 200°C mientras el ventilador de pieza recorre sus velocidades. Para un ajuste preciso, monte el conducto como imprime con él. Esto tarda varios minutos.
  The nozzle is clear of the print: La boquilla no toca la impresión
  ? The nozzle is hot. Brush it clean with the wire brush that came with the printer and keep the docking position clean, then tap Next.
  : La boquilla está caliente. Límpiala con el cepillo de alambre incluido, mantén limpia la posición de anclaje y pulsa Siguiente.
  The nozzle is lifted clear of the print and X and Y are homed. Resuming lowers it back to the height it stopped at.: "La boquilla está separada de la impresión y X e Y están posicionados. Al reanudar, baja de nuevo a la altura en que se detuvo."
  The part on the bed is too tall to clear. Remove it, then tap Cleared.: 'La pieza en la cama es demasiado alta para pasar por encima. Retírala y luego toca «Despejado».'
  ? The peak of {0} left the zone. Check that only {1}'s tensioner was turned. Not sure which is which? Tap the pencil to identify the belts.
  : "El pico de {0} salió de la zona. Comprueba que solo giraste el tensor de {1}. ¿No sabes cuál es cuál? Toca el lápiz para identificar las correas."
  The peak of {} moved out of the zone. Widening it.: "El pico de {} salió de la zona. Ampliándola."
  The plate and the spools are still hot. Use gloves.: La cama y las bobinas siguen calientes. Usa guantes.

  The plate finishes its current move, but drying will not start.: 'La cama termina su movimiento actual, pero el secado no empezará.'
  The plugin can't reach the camera, so this screen takes the photos.: "El plugin no llega a la cámara, así que esta pantalla toma las fotos."
  The plugin can't save its recovery data to disk.: "El plugin no puede guardar sus datos de recuperación."
  The plugin is turned off in moonraker.conf.: "El plugin está desactivado en moonraker.conf."
  The print ended before any layer was printed. Nothing was changed.: La impresión terminó antes de imprimir ninguna capa. No se cambió nada.
  The print is canceled and you pick the best band from what has printed so far.: La impresión se cancela y eliges la mejor franja de lo impreso hasta ahora.
  The print is on its last layer.: 'La impresión está en su última capa.'
  ? The print is paused. Changing tools now moves the toolhead and swaps the filament at the nozzle. Resume the print once the change finishes.
  : La impresión está pausada. Cambiar de herramienta ahora mueve el cabezal y cambia
    el filamento en la boquilla. Reanude la impresión una vez que el cambio termine.
  The print is still stuck to the bed: La impresión sigue pegada a la cama
  The print is waiting for the chamber to reach {}°C, but the heater is not heating.: 'La impresión espera a que la cámara alcance {}°C, pero el calentador no calienta.'
  The print is waiting for the chamber, but the heater is not heating.: 'La impresión espera a la cámara, pero el calentador no calienta.'
  The printable size in millimeters (X × Y × Z), from the axis limits in the printer's Klipper config.: 'El tamaño imprimible en milímetros (X × Y × Z), según los límites de los ejes en la configuración de Klipper de la impresora.'
  The printer applied this value and keeps it for this tool.: 'La impresora aplicó este valor y lo conserva para esta herramienta.'
  The printer can draw a priming line before a print. HelixScreen offers it in the pre-print options.: 'La impresora puede trazar una línea de purga antes de imprimir. HelixScreen la ofrece en las opciones previas a la impresión.'
  The printer can measure each tool's offset automatically. Run it on the tool offset calibration screen.: 'La impresora puede medir el desfase de cada herramienta automáticamente. Ejecútalo en la pantalla de calibración de desfases.'
  The printer can measure pressure advance on its own. Run it on the PA calibration screen.: 'La impresora puede medir el pressure advance por sí sola. Ejecútalo en la pantalla Calibración PA.'
  The printer can pause at a chosen layer, for a filament swap or an insert. Set the layer from the print preview.: 'La impresora puede pausar en una capa elegida, para cambiar de filamento o colocar un inserto. Define la capa desde la vista previa de impresión.'
  The printer could not work out where to resume.: La impresora no pudo determinar dónde reanudar.
  The printer did not change its bed check: 'La impresora no cambió su comprobación de cama'
  'The printer did not change its bed check: {}': 'La impresora no cambió su comprobación de cama: {}'
  'The printer did not confirm the print started ({}). It may still start: check the printer before starting it again.': 'La impresora no confirmó el inicio de la impresión ({}). Puede que aún empiece: revisa la impresora antes de iniciarla de nuevo.'
  The printer extrudes in a corner and repeats until the readings agree. You do not judge anything by eye.: 'La impresora extruye en una esquina y repite hasta que las lecturas coinciden. Tú no juzgas nada a ojo.'
  The printer finishes this measurement on its own.: 'La impresora termina esta medición por su cuenta.'
  The printer halted this print and cannot resume it. Restart from the beginning?: La
    impresora detuvo esta impresión y no puede reanudarla. ¿Reiniciar desde el principio?
  The printer has not answered the cancel yet. It stops once its start sequence finishes.: 'La impresora aún no ha respondido a la cancelación. Se detendrá en cuanto termine su secuencia de inicio.'
  The printer has not reported its axis limits yet.: 'La impresora aún no ha informado los límites de sus ejes.'
  The printer has not reported its maximum velocity yet.: 'La impresora aún no ha informado su velocidad máxima.'
  ? The printer heats the nozzle, extrudes a few short test moves in a corner of the plate, and measures them itself. It repeats until the readings agree, then reports one number.
  : 'La impresora calienta la boquilla, hace unos movimientos de prueba cortos en una esquina de la placa y los mide ella misma. Repite hasta que las lecturas coinciden y luego informa de un número.'
  The printer homes and sweeps the cutter (about 1 minute). Keep the filament path clear.: La impresora referencia y barre el cortador (unos 60 segundos). Mantenga despejada la ruta del filamento.
  ? The printer homes, then moves the plate as far from the nozzle as it goes. Some spools are not heat-resistant enough and can deform. Nothing moves from this screen until you confirm the spools are off the bed; Mainsail, macros and prints sent from a slicer are not blocked.

  : La impresora hace home y luego aleja la cama de la boquilla todo lo posible. Algunas bobinas no resisten suficiente calor y pueden deformarse. Nada se mueve desde esta pantalla hasta que confirmes que las bobinas no están en la cama; Mainsail, las macros y las impresiones enviadas desde un slicer no se bloquean.

  The printer homes, then probes each screw position.: "La impresora hace home y luego mide cada posición de tornillo."
  The printer is not homed. Continuing will home all axes, moving the toolhead. Make sure the bed is clear.: La impresora no está referenciada. Si continúa, se referenciarán todos los ejes y el cabezal se moverá. Asegúrese de que la cama esté despejada.
  The printer is shut down.: 'La impresora está apagada.'
  ? The printer is waiting for the chamber to reach a temperature, and only an emergency stop and a firmware restart end that wait. The print stops at once and cannot be resumed.
  : 'La impresora espera a que la cámara alcance una temperatura, y solo una parada de emergencia y un reinicio del firmware terminan esa espera. La impresión se detiene al instante y no se puede reanudar.'
  The printer isn't detecting that any filament is currently loaded. What would you like to do?: La impresora no detecta ningún filamento cargado. ¿Qué desea hacer?
  The printer kept printing after the cancel.: 'La impresora siguió imprimiendo después de la cancelación.'
  The printer lost power during a print. It can resume where it left off.: La impresora
    perdió corriente durante una impresión. Puede reanudar donde se quedó.
  The printer lost power during a print. The resumed layer may not line up exactly.: La impresora perdió corriente durante una impresión. La capa reanudada puede no alinearse con exactitud.
  The printer lost power while printing {}. Resume where it left off?: La impresora
    perdió corriente mientras imprimía {}. ¿Reanudar donde se quedó?
  The printer lost power while printing {}. The resumed layer may not line up exactly.: La impresora perdió corriente mientras imprimía {}. La capa reanudada puede no alinearse con exactitud.
  The printer moves the toolhead and measures its motors.: 'La impresora mueve el cabezal y mide sus motores.'
  The printer no longer has a print to resume.: La impresora ya no tiene una impresión para reanudar.
  The printer reads the file up to the last saved position. A large file can take a minute.: La impresora lee el archivo hasta la última posición guardada. Un archivo grande puede tardar un minuto.
  The printer records lane {} in the toolhead, not this one: 'La impresora registra el carril {} en el cabezal, no este'
  'The printer refused that port: check the port (Moonraker is usually 7125).': "La impresora rechazó ese puerto: comprueba el puerto (Moonraker suele usar el 7125)."
  The printer rejected the filament configuration. The print was not started.: La
    impresora rechazó la configuración de filamento. La impresión no se inició.
  The printer reports measured fan speeds. HelixScreen shows them on the Fans screen.: 'La impresora informa de las velocidades medidas de los ventiladores. HelixScreen las muestra en la pantalla Ventiladores.'
  The printer reports no lane record, so only clearing the extruder can unload it.: 'La impresora no informa ningún registro de carril, así que solo vaciar el extrusor puede descargar.'
  The printer swaps between several toolheads. Manage the tools on the filament system screen.: 'La impresora cambia entre varios cabezales. Gestiona las herramientas en la pantalla del sistema de filamento.'
  The printer's firmware chooses where to switch on runout: El firmware de la impresora elige a dónde cambiar al agotarse
  The requested position is outside the printer's bounds: 'La posición solicitada está fuera de los límites de la impresora'
  The right RFID reader in this CFS unit may need service: Puede que el lector RFID derecho de esta unidad CFS necesite servicio
  The runout sensor indicates no filament is loaded. Start print anyway?: El sensor
    de agotamiento indica que no hay filamento cargado. ¿Iniciar la impresión de todos
    modos?
  The saved position is kept. Reconnect or restart the screen to be offered the resume again.: La posición guardada se conserva. Vuelva a conectar o reinicie la pantalla para que se le ofrezca de nuevo la reanudación.
  The sensor in this CFS unit cannot be read. Check its connection, or the unit may need service: No se puede leer el sensor de esta unidad CFS. Compruebe su conexión o puede que la unidad necesite servicio
  The speed of one fan you choose: La velocidad de un ventilador elegido
  The time, date, and system uptime: Hora, fecha y tiempo de actividad
  The timelapse or logs folder overlaps a protected folder, so cleanup is off.: "La carpeta de timelapse o de registros se solapa con una carpeta protegida, por eso la limpieza está desactivada."
  The tool change under way finished, and the tool was not parked: 'El cambio de herramienta en curso terminó y la herramienta no se aparcó'
  The tool change under way finished, and {} was not put back on the carriage: 'El cambio de herramienta en curso terminó y {} no se volvió a poner en el carro'
  The toolhead has filament but no AMS slot reports it loaded. Pull it out manually before printing. Start anyway?: El cabezal tiene filamento, pero ninguna ranura del AMS informa que esté cargado. Retírelo manualmente antes de imprimir. ¿Iniciar de todos modos?
  ? The toolhead has filament but no AMS slot reports it loaded. The printer may refuse to load a slot until it is cleared. Start anyway?
  : El cabezal tiene filamento, pero ninguna ranura del AMS informa que esté cargado. La impresora puede negarse a cargar una ranura hasta que se vacíe. ¿Iniciar de todos modos?
  The toolhead sensor indicates filament is already loaded. Proceed with load anyway?: El
    sensor del cabezal indica que ya hay filamento cargado. ¿Continuar con la carga
    de todos modos?
  The toolhead sensor indicates no filament is present. Proceed with unload anyway?: El
    sensor del cabezal indica que no hay filamento presente. ¿Continuar con la descarga
    de todos modos?
  The unit is already running another operation. Wait for it to finish, or reset the CFS if it stays stuck: La unidad ya está ejecutando otra operación. Espere a que termine, o reinicie el CFS si se queda bloqueado
  The unit reported a fault with no further detail. Restart the printer if it repeats: La unidad informó de un fallo sin más detalles. Reinicie la impresora si se repite
  The unit's onboard storage has failed. The CFS mainboard needs replacing: El almacenamiento interno de la unidad ha fallado. Hay que sustituir la placa base del CFS
  'The unload did not start: unload by hand, then start again': 'La descarga no empezó: descarga a mano y vuelve a empezar'
  The unload finishes on its own, but the plate will not move.: 'La descarga termina por sí sola, pero la cama no se moverá.'
  Theme: Tema
  Theme Colors: Colores del Tema
  Theme Preset: Preajuste de Tema
  Theme changes apply after restart.: Los cambios de tema se aplican después de reiniciar.
  Theme reset to defaults: Tema restablecido a valores predeterminados
  'Theme: ': 'Tema: '
  There is no cycle to stop: 'No hay ningún ciclo que detener'
  ? There is not enough free memory to run this test. Klipper's analysis would run out of memory and leave the printer stuck until it is power-cycled.
  : "No hay suficiente memoria libre para esta prueba. El análisis de Klipper se quedaría sin memoria y dejaría la impresora bloqueada hasta apagarla y encenderla."
  These readings aren't repeatable, so tuning can't be steered. Check the mechanics first.: "Estas lecturas no se repiten, así que el ajuste no se puede guiar. Revisa primero la mecánica."
  'These tools have a different filament grade loaded:': 'Estas herramientas tienen cargado un filamento de grado diferente:'
  'These tools have incompatible materials loaded:': 'Estas herramientas tienen materiales
    incompatibles cargados:'
  'These tools have no filament loaded:': 'Estas herramientas no tienen filamento
    cargado:'
  'These tools have no matching filament loaded:': 'Estas herramientas no tienen filamento
    compatible cargado:'
  This .3mf has no sliced plate to print.: 'Este .3mf no tiene ninguna placa laminada para imprimir.'
  This .3mf has to be converted to G-code before it can be queued. Print it from here instead.: 'Este .3mf debe convertirse a G-code antes de poder ponerse en cola. Imprímelo desde aquí.'
  This .3mf has to be converted to G-code on the printer before it can print.: 'Este .3mf debe convertirse a G-code en la impresora antes de poder imprimirse.'
  This AFC system does not support bypass mode: 'Este sistema AFC no es compatible con el modo bypass'
  This CFS firmware exposes no external spool slot: 'Este firmware del CFS no ofrece una ranura para bobina externa'
  This Happy Hare system does not support bypass mode: 'Este sistema Happy Hare no es compatible con el modo bypass'
  This Moonraker version can't hold uploads. Update Moonraker.: "Esta versión de Moonraker no puede retener subidas. Actualiza Moonraker."
  This button controls: Este botón controla
  This calibration uses the paper friction method to set your Z-offset.: Esta calibración
    usa el método de fricción de papel para establecer su Z-offset.
  This cannot be undone.: Esta acción no se puede deshacer.
  This channel offers v{}, older than the installed v{}. Anything added since then will be removed.: 'Este canal ofrece la v{}, anterior a la v{} instalada. Todo lo añadido desde entonces se eliminará.'
  ? "This check runs Klipper's resonance test along each belt path and compares the two responses. Balanced belts give curves of the same shape, with peaks at the same frequencies.\n\nEach sweep takes a few minutes and moves the toolhead; keep clear of the printer while it runs."
  : "Esta comprobación ejecuta la prueba de resonancia de Klipper a lo largo de cada ruta de correa y compara las dos respuestas. Unas correas equilibradas dan curvas de la misma forma, con picos en las mismas frecuencias.\n\nCada barrido tarda unos minutos y mueve el cabezal; manténgase alejado de la impresora mientras se ejecuta."
  This clears every Endless Spool backup. The print will stop on runout until you set up Endless Spool again.: Esto borra todas las reservas de la bobina infinita. La impresión se detendrá al agotarse el filamento hasta que vuelvas a configurar la bobina infinita.
  This device has no wired network connection. If you turn WiFi off, it can only be turned back on from this screen.: Este dispositivo no tiene conexión de red por cable. Si desactiva WiFi, solo podrá volver a activarlo desde esta pantalla.
  ? This device has only {} MB of RAM. Resonance calibration is memory-intensive and can make the printer firmware report a "Timer Too Close" error or restart mid-test. Continue anyway?
  : Este dispositivo solo tiene {} MB de RAM. La calibración de resonancia consume mucha memoria y puede hacer que el firmware de la impresora informe un error "Timer Too Close" o se reinicie a mitad de la prueba. ¿Continuar de todos modos?
  ? This device has very little RAM. Resonance calibration is memory-intensive and may cause a "Timer Too Close" error. Continue anyway?
  : Este dispositivo tiene muy poca RAM. La calibración de resonancia consume mucha memoria y puede causar un error "Timer Too Close". ¿Continuar de todos modos?
  This doesn't match the linked Spoolman spool. Add it as a new spool, or update the linked one to match?: Esto no coincide con la bobina de Spoolman vinculada. ¿Añadirla como bobina nueva o actualizar la vinculada para que coincida?
  This dryer cannot run while filament from the unit is loaded: 'Este secador no puede funcionar mientras haya filamento de la unidad cargado'
  This feature failed to start. The Moonraker log says why.: "Esta función no se pudo iniciar. El registro de Moonraker indica el motivo."
  This feature requires different hardware or configuration: Esta función requiere otro hardware u otra configuración
  This feature stopped. Restart Moonraker to start it again.: "Esta función se detuvo. Reinicia Moonraker para iniciarla de nuevo."
  This filament system does not report buffer or flow data.: Este sistema de filamento no informa datos de búfer ni de flujo.
  This file prints {0} and {1} through one nozzle. {0} can burn and clog the nozzle at {1} temperatures.: 'Este archivo imprime {0} y {1} por una sola boquilla. {0} puede quemarse y obstruir la boquilla a las temperaturas de {1}.'
  This file prints {0} and {1} together. The chamber and bed heat {1} needs can soften {0} and jam its nozzle.: 'Este archivo imprime {0} y {1} juntos. El calor de cámara y cama que necesita {1} puede ablandar {0} y atascar su boquilla.'
  This file was sliced for {} but {} is loaded.: Este archivo fue laminado para {}
    pero se ha cargado {}.
  This file was sliced for {}, but {} is loaded. It will print slower and hotter than the loaded spool needs.: Este archivo se laminó para {}, pero hay {} cargado. Se imprimirá más lento y a una temperatura más alta de lo que necesita la bobina cargada.
  This firmware can only switch slots by loading them: 'Este firmware solo puede cambiar de ranura cargándola'
  ? This installs the HelixScreen helper macros on the printer and adds them to printer.cfg. A print is running, so Klipper restarts after it finishes.
  : 'Esto instala las macros de ayuda de HelixScreen en la impresora y las añade a printer.cfg. Hay una impresión en curso, así que Klipper se reiniciará al terminar.'
  This installs the HelixScreen helper macros on the printer, adds them to printer.cfg, and restarts Klipper.: 'Esto instala las macros de ayuda de HelixScreen en la impresora, las añade a printer.cfg y reinicia Klipper.'
  'This is an emergency stop: the printer halts and Klipper restarts.': 'Esto es una parada de emergencia: la impresora se detiene y Klipper se reinicia.'
  This is exactly the data that will be sent: Estos son exactamente los datos que
    se enviarán
  This is what data would be sent if enabled: Estos son los datos que se enviarían
    si se activa
  This looks like a {}, but it is set up as a {}: Esta impresora parece una {}, pero está configurada como {}
  This may take up to 30 seconds: Esto puede tardar hasta 30 segundos
  This needs the plugin's file analysis, which isn't running.: "Esto necesita el análisis de archivos del plugin, que no está en marcha."
  This plugin asks for no special permissions.: 'Este plugin no pide permisos especiales.'
  This plugin lets HelixScreen control print start options like bed mesh and QGL.: 'Este plugin permite que HelixScreen controle opciones de inicio de impresión como malla de cama y QGL.'
  This print can't be resumed. Restart it, or turn off the bed check if it keeps happening.: 'Esta impresión no se puede reanudar. Reiníciala o desactiva la comprobación de cama si sigue ocurriendo.'
  This print does not report layers, so no layer pause can be scheduled.: 'Esta impresión no informa capas, así que no se puede programar una pausa en una capa.'
  This print needs about %.0fg but the spool has about %.0fg remaining. Start anyway?: Esta
    impresión necesita aproximadamente %.0fg pero la bobina tiene aproximadamente
    %.0fg restantes. ¿Iniciar de todos modos?
  This print never reports layer {}.: 'Esta impresión nunca informa la capa {}.'
  This printer cannot calibrate tool offsets automatically: Esta impresora no puede calibrar los offsets de herramienta automáticamente
  This printer fills its gates from Spoolman. HelixScreen cleared its own copy; remove the spool in Spoolman.: Esta impresora llena sus gates desde Spoolman. HelixScreen borró su propia copia; quita la bobina en Spoolman.
  This printer fills its gates from Spoolman. Make color, material and spool changes in Spoolman.: Esta impresora llena sus gates desde Spoolman. Haz los cambios de color, material y bobina en Spoolman.
  This printer has no IFS.: "Esta impresora no tiene IFS."
  This printer has no INDX LOAD_FILAMENT macro: "Esta impresora no tiene la macro LOAD_FILAMENT de INDX"
  This printer has no automatic unload. Cut the filament at the head and pull it out by hand.: Esta impresora no tiene descarga automática. Corte el filamento en el cabezal y sáquelo a mano.
  ? This printer looks like a {} ({}% confidence), but it is set up as a {}. A wrong type applies incorrect pre-print options and presets.
  : Esta impresora parece una {} ({}% de confianza), pero está configurada como {}. Un tipo erróneo aplica opciones y preajustes de preimpresión incorrectos.
  "This printer's INDX macros are missing: {}": "A las macros de INDX de esta impresora les falta: {}"
  This printer's Moonraker rejected its API key. Check the key in Settings > Connection.: 'El Moonraker de esta impresora rechazó su clave API. Revisa la clave en Ajustes > Conexión.'
  This printer's Moonraker requires a login. Add its API key in Settings > Connection.: 'El Moonraker de esta impresora requiere inicio de sesión. Añade su clave API en Ajustes > Conexión.'
  This printer's network service controls the WiFi radio: El servicio de red de esta impresora controla la radio WiFi
  This printer's network service manages saved WiFi networks: El servicio de red de esta impresora gestiona las redes WiFi guardadas
  This printer's screen has not shared a layout: "La pantalla de esta impresora no ha compartido un diseño"
  ? This removes the plugin's Moonraker component and restarts Moonraker. The printer will briefly disconnect. If old phase-tracking lines are still in PRINT_START, they are removed too, with backups kept. A Klipper restart applies that.
  : Esto elimina el componente de Moonraker del plugin y reinicia Moonraker. La impresora se desconectará brevemente. Si aún hay líneas de seguimiento de fases antiguas en PRINT_START, también se eliminan, conservando copias de seguridad. Un reinicio de Klipper aplica eso.
  This replaces the printer's helper macros with the current version and restarts Klipper.: 'Esto reemplaza las macros de ayuda de la impresora por la versión actual y reinicia Klipper.'
  ? This replaces the printer's helper macros with the current version. A print is running, so Klipper restarts after it finishes.
  : 'Esto reemplaza las macros de ayuda de la impresora por la versión actual. Hay una impresión en curso, así que Klipper se reiniciará al terminar.'
  This replaces this screen's home layout for this printer with the one on the printer's own screen.: "Esto reemplaza el diseño de la pantalla de inicio de esta pantalla para esta impresora por el de la pantalla de la propia impresora."
  This resume needs a newer version of HelixScreen.: Esta reanudación necesita una versión más reciente de HelixScreen.
  This slot feeds no tool: 'Esta ranura no alimenta ninguna herramienta'
  This spool's details haven't loaded from Spoolman yet. Try Save again.: 'Los detalles de esta bobina aún no se han cargado desde Spoolman. Vuelve a pulsar Guardar.'
  This system does not support bypass mode: 'Este sistema no es compatible con el modo bypass'
  This tool probes each bed screw and tells you how much to adjust.: Esta herramienta
    sondea cada tornillo de cama y le indica cuánto ajustar.
  'This update asks for new permissions:': 'Esta actualización pide nuevos permisos:'
  'This wait ends only at its temperature: canceling takes an emergency stop and a firmware restart.': 'Esta espera solo termina al alcanzar su temperatura: cancelar requiere una parada de emergencia y un reinicio del firmware.'
  ? This will apply the Z-offset to your endstop and restart Klipper to save the configuration.
    The printer will briefly disconnect.
  : Esto aplicará el Z-offset a su endstop y reiniciará Klipper para guardar la configuración.
    La impresora se desconectará brevemente.
  ? This will apply the Z-offset to your probe and restart Klipper to save the configuration.
    The printer will briefly disconnect.
  : Esto aplicará el Z-offset a su sonda y reiniciará Klipper para guardar la configuración.
    La impresora se desconectará brevemente.
  ? This will collect system info, logs, settings, and printer data to help diagnose
    issues. No passwords or sensitive data will be included.
  : Se recopilarán datos del sistema, registros, ajustes y datos de la impresora.
    No se incluyen contraseñas ni datos sensibles.
  This will immediately halt all printer operations. The printer will require a restart to resume.: Esto
    detendrá inmediatamente todas las operaciones de la impresora. La impresora requerirá
    un reinicio para reanudar.
  This will remove all custom pages and restore the default widget layout.: Esto eliminará
    todas las páginas personalizadas y restaurará el diseño de widgets predeterminado.
  This will remove all entries from the display.: Esto eliminará todas las entradas
    de la pantalla.
  This will remove the Spoolman configuration from Moonraker and restart the service.: Esto
    eliminará la configuración de Spoolman de Moonraker y reiniciará el servicio.
  This will reset all settings to defaults. This action cannot be undone.: Esto restablecerá
    todos los ajustes a los valores predeterminados. Esta acción no se puede deshacer.
  This will restart Klipper firmware. Any active operations will be interrupted.: Se
    reiniciará el firmware de Klipper. Las operaciones activas se interrumpirán.
  This will restart Klipper.: Esto reiniciará Klipper.
  This will restore the default jog step distances for all three modes.: Esto restablecerá las distancias de paso predeterminadas para los tres modos.
  This will save the Z-offset and restart Klipper to write the configuration. The printer will briefly disconnect.: Esto guardará el Z-offset y reiniciará Klipper para escribir la configuración. La impresora se desconectará brevemente.
  ? This writes the tool offsets to the printer's config and restarts Klipper, which takes a few seconds. Until then they apply only to this session.
  : Esto escribe los offsets de herramienta en la configuración de la impresora y reinicia Klipper, lo que tarda unos segundos. Hasta entonces solo se aplican a esta sesión.
  ? This {0} is set up for {1}, but it looks stock ({2}% confidence). A wrong profile applies incorrect pre-print options and presets.
