#
# HelixScreen on a home server (docs/user/guide/install-docker.md).
# Edit PRINTER_URL, then: docker compose -f docker-compose.homeserver.yml up -d
# The screen opens in a browser at http://<this server>:7130/
services:
  helixscreen:
    # The tag names a channel (stable, beta, dev), latest, or one release. To
    # run an image you built yourself, name that one here instead.
    image: ghcr.io/prestonbrown/helixscreen-homeserver:latest
    container_name: helixscreen
    restart: unless-stopped
    environment:
      PRINTER_URL: 192.168.1.50:7125
      # PAIR_CODE: "123456"
      # SCREEN_SIZE: 1024x600
    ports:
      - "7130:7130"
    volumes:
      - helixscreen-config:/config

volumes:
  helixscreen-config:
