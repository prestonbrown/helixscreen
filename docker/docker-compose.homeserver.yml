#
# HelixScreen on a home server (docs/user/guide/install-docker.md).
# Edit MOONRAKER_URL, then: docker compose -f docker-compose.homeserver.yml up -d
# The screen opens in a browser at http://<this server>:7130/
services:
  helixscreen:
    # Build it here (docker build -f docker/Dockerfile.homeserver docker), or use
    # the image name you pushed it under.
    image: helixscreen/homeserver:latest
    build:
      context: .
      dockerfile: Dockerfile.homeserver
      args:
        CHANNEL: stable
    container_name: helixscreen
    restart: unless-stopped
    environment:
      MOONRAKER_URL: 192.168.1.50:7125
      # HELIX_PAIR_CODE: "123456"
      # HELIX_SCREEN_SIZE: 1024x600
    ports:
      - "7130:7130"
    volumes:
      - helixscreen-config:/config

volumes:
  helixscreen-config:
