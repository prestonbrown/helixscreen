<!--
  Tap-to-tag authoring tool for assets/images/printers/regions.json: the
  per-image points the home-panel printer image widget pins its live callouts
  to (prestonbrown/helixscreen#1397).

  Serve the repo root and open this page:
    python3 -m http.server -d . 8000
    http://localhost:8000/tools/printer-regions-tagger.html

  Points are normalized 0..1 over the source PNG. The prerendered .bin is an
  aspect-preserving resize of that PNG, so the same numbers hold at every size.
  Progress is kept in this browser; paste the output into regions.json to ship.

  Window review: tools/printer-regions-server.py, then open this page with ?windows
  to drag the corners of each enclosure window (front, side, top: one region each). Every approval writes regions.json.
-->
<meta charset="utf-8">
<title>Printer regions tagger</title>
<style>
  body{margin:0;padding:20px;background:#1b1f26;color:#e8eaed;font-family:system-ui,sans-serif}
  .tg{display:grid;grid-template-columns:230px 1fr;gap:18px}
  .tg-list{display:flex;flex-direction:column;gap:2px;font-size:12px;max-height:88vh;overflow:auto}
  .tg-list div{padding:4px 7px;border-radius:5px;cursor:pointer;color:#8b93a0}
  .tg-list div.cur{background:#2b313b;color:#e8eaed}
  .tg-list div.done{color:#3fb950}
  .tg-prompt{font-size:20px;font-weight:700;margin:0 0 4px}
  .tg-hint{font-size:13px;color:#8b93a0;margin-bottom:10px;min-height:18px}
  .tg-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  button{background:#2b313b;color:#e8eaed;border:1px solid #3a424e;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer}
  button.pri{background:#4a9eff;color:#0d1117;border-color:#4a9eff;font-weight:700}
  .tg-stage{position:relative;display:inline-block;background:#fff;border-radius:6px;cursor:crosshair;max-width:100%}
  .tg-stage img{display:block;max-width:min(900px,100%);max-height:72vh;user-select:none}
  .mk{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);
      border:2px solid #fff;box-shadow:0 0 0 1px #000;pointer-events:none}
  .mk-l{position:absolute;transform:translate(8px,-50%);font-size:11px;font-weight:700;color:#000;
      background:rgba(255,255,255,.85);padding:0 3px;border-radius:3px;pointer-events:none;white-space:nowrap}
  .chip{position:absolute;transform:translate(-50%,-50%);display:flex;gap:2px;align-items:center;background:rgba(20,24,30,.88);
      border:1px solid #3a424e;border-radius:9px;padding:2px 6px;font-size:12px;font-weight:600;color:#e8eaed;pointer-events:none;white-space:nowrap}
  .chip.hot{border-color:#e5484d;color:#ffb3b5}.chip.ok{border-color:#3fb950;color:#9be9a8}
  .glow{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,110,40,.6),rgba(255,110,40,0) 70%)}
  .quad{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  .quad polygon{fill:rgba(255,110,40,.35);stroke:#ff6e28;stroke-width:2;vector-effect:non-scaling-stroke}
  body.review .tg-stage{cursor:default;touch-action:none}
  body.review .tg-stage img{max-width:min(1100px,100%);max-height:84vh}
  body.review .quad polygon{fill:rgba(229,72,77,.22);stroke:#ffe14d}
  .hd{position:absolute;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,225,77,.35);
      border:2px solid #ffe14d;box-shadow:0 0 0 1px #000;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;
      font-size:9px;font-weight:700;color:#fff;text-shadow:0 0 2px #000;user-select:none}
  .tg-list div.cur.done{color:#3fb950}
  .xb{position:absolute;transform:translate(-50%,-50%);background:#e5484d;color:#fff;border:0;border-radius:50%;width:24px;height:24px;padding:0;font-weight:700;cursor:pointer}
  .tg-out{width:100%;height:160px;margin-top:8px;background:#11151a;color:#8b93a0;border:1px solid #333a45;border-radius:6px;font:11px monospace}
  .tg-foot{margin-top:14px;display:flex;gap:8px;align-items:center;font-size:12px;color:#8b93a0}
</style>

<div class="tg">
  <div class="tg-list" id="list"></div>
  <div>
    <div class="tg-prompt" id="prompt">Loading…</div>
    <div class="tg-hint" id="hint"></div>
    <div class="tg-bar" id="bar"></div>
    <div class="tg-stage" id="stage"><img id="img" draggable="false"></div>
    <div class="tg-foot">
      <button id="copy">Copy regions.json</button>
      <span>Save as <code>assets/images/printers/regions.json</code></span>
    </div>
    <textarea class="tg-out" id="out" readonly></textarea>
  </div>
</div>

<script>
// Tagging order: unique devices per detected model in telemetry, most first.
// Images not named here follow alphabetically.
const POPULAR = [
  "flashforge-adventurer-5x", "voron-v2", "creality-k2-plus", "flashforge-adventurer-5m-pro",
  "voron-trident", "flashforge-creator-5-pro", "creality-k1c", "snapmaker-u1",
  "creality-k1-max", "voron-v0", "creality-k1", "qidi-q2",
  "creality-ender-3-v3-ke", "elegoo-centauri-carbon", "sovol-sv08", "artillery-m1-pro",
  "qidi-x-max-3", "lemontron", "rh3d-e3ng", "creality-ender-3",
  "flashforge-adventurer-5m", "creality-cr10", "creality-ender-5", "anycubic-kobra-s1",
  "ratrig-vcore4",
];
const STEPS = [
  {k:"nozzle",  p:"Tap the NOZZLE tip", h:"The very bottom of the hotend, where plastic comes out."},
  {k:"part_fan",p:"Tap the PART FAN", h:"The part-cooling fan / duct on the toolhead. Skip if you can't see one.", skip:1},
  {k:"bed_l",   p:"Tap the bed's FRONT-LEFT corner", h:"As you see it in the picture: the plate corner nearest you, on the LEFT of the image."},
  {k:"bed_r",   p:"Tap the bed's FRONT-RIGHT corner", h:"Same near edge of the plate, RIGHT end of the image."},
  {k:"bed_fr",  p:"Tap the bed's BACK-RIGHT corner", h:"The far edge of the plate's top surface, RIGHT end. If it is hidden, tap where it would be in perspective.", skip:1, sl:"Skip (estimate the far edge)"},
  {k:"bed_fl",  p:"Tap the bed's BACK-LEFT corner", h:"The far edge of the plate's top surface, LEFT end. If it is hidden, tap where it would be in perspective.", skip:1, sl:"Skip (estimate the far edge)"},
  {k:"chamber", p:"Tap an EMPTY SPOT inside the enclosure", h:"Where a chamber-temp chip can sit without hiding anything. Skip for open-frame printers.", skip:1},
  {k:"win_tl",  p:"Tap the WINDOW's TOP-LEFT corner", h:"The see-through opening on the enclosure's front, inside its frame. Chamber heat and light stay inside these four corners. Skip for open-frame printers.", skip:1},
  {k:"win_tr",  p:"Tap the WINDOW's TOP-RIGHT corner", h:"Inside the frame.", skip:1},
  {k:"win_br",  p:"Tap the WINDOW's BOTTOM-RIGHT corner", h:"Inside the frame.", skip:1},
  {k:"win_bl",  p:"Tap the WINDOW's BOTTOM-LEFT corner", h:"Inside the frame.", skip:1},
  {k:"light",   p:"Tap the LIGHT", h:"The chamber / case light, or where it would be mounted. Skip if the printer has none.", skip:1},
];
const IMG_DIR = "../assets/images/printers/";
const KEY = "hx1397-regions";
let IMAGES = [], data = {}, cur = 0, taps = {}, step = 0;

const $ = id => document.getElementById(id);
const r3 = v => Math.round(v * 1000) / 1000;

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  // One line per image keeps regions.json diffs to the image that changed.
  const lines = Object.keys(data).sort().map(k => `  "${k}": ${JSON.stringify(data[k]).replace(/,/g, ", ").replace(/:/g, ": ")}`);
  $("out").value = "{\n" + lines.join(",\n") + "\n}\n";
}
function toRegions(t) {
  const o = {};
  for (const k of ["nozzle", "part_fan", "chamber", "light"]) if (t[k]) o[k] = t[k];
  // Plate quad, going around the top surface: near-left, near-right, far-right, far-left.
  if (t.bed_l && t.bed_r) o.bed = t.bed_fr && t.bed_fl ? [t.bed_l, t.bed_r, t.bed_fr, t.bed_fl] : [t.bed_l, t.bed_r];
  // Clockwise from the top-left, as pictured.
  if (t.win_tl && t.win_tr && t.win_br && t.win_bl) o.windows = [[t.win_tl, t.win_tr, t.win_br, t.win_bl]];
  return o;
}
function renderList() {
  $("list").innerHTML = "";
  IMAGES.forEach((f, i) => {
    const d = document.createElement("div");
    d.className = (i === cur ? "cur " : "") + (data[f] ? "done" : "");
    d.textContent = (data[f] ? "✓ " : "") + f;
    d.onclick = () => load(i, false);
    $("list").appendChild(d);
  });
}
function clearMarks() { $("stage").querySelectorAll(".mk,.mk-l,.chip,.glow,.quad,.hd,.xb").forEach(e => e.remove()); }
function addQuad(pts) {
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"), poly = document.createElementNS(ns, "polygon");
  svg.setAttribute("class", "quad"); svg.setAttribute("viewBox", "0 0 1 1"); svg.setAttribute("preserveAspectRatio", "none");
  poly.setAttribute("points", pts.map(([x, y]) => `${x},${y}`).join(" "));
  svg.appendChild(poly); $("stage").appendChild(svg); return poly;
}
function add(cls, x, y, html, style) {
  const e = document.createElement("div"); e.className = cls;
  e.style.left = (x * 100) + "%"; e.style.top = (y * 100) + "%"; if (style) Object.assign(e.style, style);
  if (html) e.textContent = html; $("stage").appendChild(e); return e;
}
function drawTaps() {
  clearMarks();
  const col = {nozzle:"#3fb950", part_fan:"#4a9eff", bed_l:"#e5484d", bed_r:"#e5484d", bed_fr:"#ff9f43", bed_fl:"#ff9f43", chamber:"#f0a020", win_tl:"#e5484d", win_tr:"#e5484d", win_br:"#e5484d", win_bl:"#e5484d", light:"#f5d76e"};
  for (const [k, [x, y]] of Object.entries(taps)) { add("mk", x, y, "", {background: col[k]}); add("mk-l", x, y, k); }
}
function drawPreview(reg) {
  clearMarks();
  if (reg.bed) {
    const [[x1, y1], [x2, y2]] = reg.bed, w = Math.abs(x2 - x1);
    if (reg.bed.length >= 4) addQuad(reg.bed);
    else add("glow", Math.min(x1, x2), (y1 + y2) / 2 - w * 0.12, "", {width: (w * 100) + "%", height: (w * 24) + "%"});
    add("chip hot", (x1 + x2) / 2, (y1 + y2) / 2 + 0.05, "▭ 58/60°");
  }
  (reg.windows || []).forEach(addQuad);
  if (reg.nozzle)   add("chip ok", reg.nozzle[0], reg.nozzle[1], "▼ 220°");
  if (reg.part_fan) add("chip", reg.part_fan[0], reg.part_fan[1], "✣ 80%");
  if (reg.chamber)  add("chip", reg.chamber[0], reg.chamber[1], "⌂ 34°");
  if (reg.light)    add("chip", reg.light[0], reg.light[1], "☀");
}
function bar(buttons) {
  $("bar").innerHTML = "";
  for (const [label, fn, pri] of buttons) {
    const b = document.createElement("button"); b.textContent = label; if (pri) b.className = "pri";
    b.onclick = e => { e.stopPropagation(); fn(); }; $("bar").appendChild(b);
  }
}
function showStep() {
  if (step >= STEPS.length) return showReview();
  const s = STEPS[step];
  $("prompt").textContent = `${step + 1}/${STEPS.length} · ${s.p}`;
  $("hint").textContent = s.h;
  const b = [];
  if (s.skip) b.push([s.sl || "Skip (not on this printer)", () => { step++; showStep(); }]);
  if (step > 0) b.push(["Undo", () => { step--; delete taps[STEPS[step].k]; drawTaps(); showStep(); }]);
  bar(b); drawTaps();
}
function nextUntagged(after) {
  const n = IMAGES.findIndex((f, j) => j > after && !data[f]);
  return n >= 0 ? n : IMAGES.findIndex(f => !data[f]);
}
function showReview() {
  const reg = toRegions(taps);
  $("prompt").textContent = "Check it: do the chips land in the right places?";
  $("hint").textContent = "Pinned-chip layout at these points. Leader lines start from the same points.";
  drawPreview(reg);
  bar([
    ["Looks right → next printer", () => {
      // The source PNG's size lets a test catch a re-cropped image whose points no longer line up.
      data[IMAGES[cur]] = {size: [$("img").naturalWidth, $("img").naturalHeight], ...reg};
      save(); load(nextUntagged(cur), true);
    }, 1],
    ["Redo this printer", () => load(cur, true)],
  ]);
}
function load(i, fresh) {
  if (i < 0) {
    $("prompt").textContent = "All done: every image is tagged."; $("hint").textContent = "";
    bar([]); clearMarks(); renderList(); return;
  }
  cur = i; taps = {}; step = 0;
  $("img").src = IMG_DIR + IMAGES[i] + ".png";
  renderList();
  if (!fresh && data[IMAGES[i]]) {
    step = STEPS.length;
    drawPreview(data[IMAGES[i]]);
    $("prompt").textContent = IMAGES[i] + ": tagged"; $("hint").textContent = "";
    bar([["Redo", () => load(i, true)], ["Next untagged", () => load(nextUntagged(i), true), 1]]);
    return;
  }
  showStep();
}

// Window review: every image with a chamber tag, its corners draggable.
const REVIEW = new URLSearchParams(location.search).has("windows");
const OK_KEY = "hx-window-ok";
const CORNERS = ["TL", "TR", "BR", "BL"];
const DEFAULT_WINDOW = [[.2, .2], [.8, .2], [.8, .8], [.2, .8]];
let approved = new Set(), quads = null;
try { approved = new Set(JSON.parse(localStorage.getItem(OK_KEY) || "[]")); } catch (e) {}

function persist() {
  save();
  try { localStorage.setItem(OK_KEY, JSON.stringify([...approved])); } catch (e) {}
  fetch("/__regions", {method: "POST", body: $("out").value})
    .then(r => { $("hint").textContent = r.ok ? "Saved to regions.json" : `NOT saved: server said ${r.status}`; })
    .catch(() => { $("hint").textContent = "NOT saved: run tools/printer-regions-server.py"; });
}
function renderReviewList() {
  $("list").innerHTML = "";
  IMAGES.forEach((f, i) => {
    const d = document.createElement("div");
    d.className = (i === cur ? "cur " : "") + (approved.has(f) ? "done" : "");
    d.textContent = (approved.has(f) ? "✓ " : "") + f + (data[f].windows ? (data[f].windows.length > 1 ? ` (${data[f].windows.length})` : "") : " (no window)");
    d.onclick = () => loadReview(i);
    $("list").appendChild(d);
  });
}
function drawCorners() {
  clearMarks();
  quads.forEach((quad, q) => {
    const poly = addQuad(quad);
    quad.forEach(([x, y], n) => {
      const h = add("hd", x, y, CORNERS[n]);
      h.onpointerdown = e => { e.preventDefault(); h.setPointerCapture(e.pointerId); h.style.cursor = "grabbing"; };
      h.onpointermove = e => {
        if (!h.hasPointerCapture(e.pointerId)) return;
        const r = $("img").getBoundingClientRect();
        quad[n] = [r3(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))), r3(Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)))];
        h.style.left = (quad[n][0] * 100) + "%"; h.style.top = (quad[n][1] * 100) + "%";
        poly.setAttribute("points", quad.map(([a, b]) => `${a},${b}`).join(" "));
      };
      h.onpointerup = () => { h.style.cursor = "grab"; };
    });
    if (quads.length > 1) {
      const xb = document.createElement("button");
      xb.className = "xb"; xb.textContent = "×"; xb.title = "Remove this region";
      xb.style.left = (quad.reduce((s, p) => s + p[0], 0) / 4 * 100) + "%";
      xb.style.top = (quad.reduce((s, p) => s + p[1], 0) / 4 * 100) + "%";
      xb.onclick = () => { quads.splice(q, 1); drawCorners(); };
      $("stage").appendChild(xb);
    }
  });
}
/// A new region starts in the free space right of the rightmost one.
function addRegion() {
  const right = Math.max(...quads.flat().map(p => p[0]));
  const x0 = right < .9 ? right + .02 : .3, x1 = right < .9 ? Math.min(.98, right + .25) : .7;
  quads.push([[r3(x0), .25], [r3(x1), .2], [r3(x1), .75], [r3(x0), .8]]);
  drawCorners();
}
function nextReview(after) {
  const n = IMAGES.findIndex((f, j) => j > after && !approved.has(f));
  return n >= 0 ? n : IMAGES.findIndex(f => !approved.has(f));
}
function approve() {
  const f = IMAGES[cur];
  data[f].windows = quads.map(q => q.map(p => [...p]));
  approved.add(f); persist(); loadReview(nextReview(cur));
}
function loadReview(i) {
  if (i < 0) { $("prompt").textContent = `All ${IMAGES.length} windows approved.`; bar([]); clearMarks(); renderReviewList(); return; }
  cur = i;
  const f = IMAGES[i];
  $("img").src = IMG_DIR + f + ".png";
  quads = (data[f].windows || [DEFAULT_WINDOW]).map(q => q.map(p => [...p]));
  $("prompt").textContent = `${approved.size}/${IMAGES.length} approved · ${f}`;
  $("hint").textContent = "Drag the corners inside each window frame. + Add region for a side or top window. Enter approves.";
  bar([
    ["Approve → next", approve, 1],
    ["+ Add region", addRegion],
    ["No window here", () => { delete data[f].windows; approved.add(f); persist(); loadReview(nextReview(cur)); }],
    ["Reset this one", () => loadReview(i)],
    ["← Prev", () => loadReview(Math.max(0, i - 1))],
    ["Next →", () => loadReview(Math.min(IMAGES.length - 1, i + 1))],
  ]);
  drawCorners(); renderReviewList();
}
document.addEventListener("keydown", e => { if (REVIEW && e.key === "Enter" && cur >= 0 && quads) { e.preventDefault(); approve(); } });

$("stage").addEventListener("click", e => {
  if (REVIEW || step >= STEPS.length) return;
  const r = $("img").getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if (x < 0 || x > 1 || y < 0 || y > 1) return;
  taps[STEPS[step].k] = [r3(x), r3(y)]; step++; showStep();
});
$("copy").onclick = () => { $("out").select(); navigator.clipboard?.writeText($("out").value); };

(async () => {
  const getJson = async p => { try { const r = await fetch(p); return r.ok ? r.json() : null; } catch (e) { return null; } };
  const db = await getJson("../assets/config/printer_database.json");
  if (!db) { $("prompt").textContent = "Serve the repo root over HTTP (see the comment at the top of this file)."; return; }
  const printers = Array.isArray(db.printers) ? db.printers : Object.values(db.printers || {});
  const all = [...new Set(printers.map(p => (p.image || "").replace(/\.png$/, "")).filter(Boolean))];
  IMAGES = [...POPULAR.filter(f => all.includes(f)), ...all.filter(f => !POPULAR.includes(f)).sort()];
  data = (await getJson(IMG_DIR + "regions.json")) || {};
  if (REVIEW) {
    document.body.classList.add("review");
    IMAGES = IMAGES.filter(f => data[f] && data[f].chamber);
    for (const d of Object.values(data)) if (d.window) { d.windows = [d.window]; delete d.window; }
    save();
    loadReview(Math.max(0, nextReview(-1)));
    return;
  }
  try { Object.assign(data, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  save();
  load(Math.max(0, nextUntagged(-1)), true);
})();
</script>
