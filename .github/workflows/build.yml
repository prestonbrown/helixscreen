name: Build

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

jobs:
  compile-ubuntu:
    name: Compile (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    # The two build steps below budget 75 + 70 minutes, so a 120-minute job cap
    # could kill the job before either step reached its own timeout — and did
    # come within 30 seconds of it on a cold cache. Sized to cover the step
    # budgets plus setup rather than silently undercutting them.
    timeout-minutes: 165

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Initialize submodules
      uses: ./.github/actions/init-submodules

    - name: Prepare apt
      uses: ./.github/actions/apt-prepare

    - name: Install dependencies
      uses: nick-fields/retry@v4
      with:
        # The window is a backstop, not the fix. When apt wedges on a bad
        # mirror, retry@v4 cannot rescue it: apt runs under sudo, so the
        # timeout's process.kill returns EPERM and the step dies with
        # "Error: kill EPERM" instead of retrying. Widening the cap only moves
        # the failure later -- Compile hit the ceiling at 10 minutes and then
        # again at 20. The Prepare apt step above is what actually prevents the
        # hang, by dropping the azure mirror and capping apt's own timeouts.
        timeout_minutes: 20
        max_attempts: 3
        command: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            clang \
            make \
            python3 \
            python3-venv \
            npm \
            libssl-dev \
            pkg-config \
            libfmt-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libpng-dev \
            libjpeg-dev \
            libnl-3-dev \
            libnl-genl-3-dev \
            libxml2-utils \
            libusb-1.0-0-dev \
            libsystemd-dev \
            libbluetooth-dev \
            ccache

    - name: Cache compiled dependencies
      uses: actions/cache@v5
      id: cache-deps
      with:
        path: |
          build/lib/
          lib/libhv/lib/
          lib/libhv/include/hv/

        key: deps-ubuntu-22.04-${{ hashFiles('lib/libhv/**/*.c', 'lib/libhv/**/*.cpp', 'lib/libhv/**/*.h', 'lib/wpa_supplicant/src/**/*.c', 'lib/wpa_supplicant/src/**/*.h', 'Makefile', 'mk/deps.mk') }}
        restore-keys: |
          deps-ubuntu-22.04-

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache
        key: ccache-ubuntu-22.04-${{ github.sha }}
        restore-keys: |
          ccache-ubuntu-22.04-

    - name: Verify submodules
      run: |
        echo "Checking submodule status..."
        git submodule status
        echo "Submodules initialized"

    - name: Install Node.js dependencies
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 2
        max_attempts: 3
        command: npm install

    - name: Configure ccache
      run: |
        ccache --set-config=max_size=2G
        ccache --set-config=compression=true
        # Depend mode: resolve cache entries from the compiler's own -MMD
        # dependency output instead of preprocessing each TU first. Worth
        # enabling only now that the git hash is out of the global flags (see
        # scripts/gen-git-hash.sh), so direct-mode hits are the common case
        # rather than the exception. Trade-off: it disables the preprocessed-mode
        # fallback, so a direct miss is a full compile with no second chance.
        ccache --set-config=depend_mode=true
        ccache -z  # Reset stats for this run

    - name: Setup Python venv for translations
      run: make venv-setup

    - name: Build HelixScreen
      timeout-minutes: 75
      env:
        CC: ccache clang
        CXX: ccache clang++
      run: |
        make -j$(nproc)
        echo "HelixScreen built successfully"
        ccache -s

    - name: Build tests
      timeout-minutes: 70
      env:
        CC: ccache clang
        CXX: ccache clang++
      run: |
        make test -j$(nproc)
        echo "Tests built successfully"
        ccache -s

    - name: Verify binary
      run: |
        ./build/bin/helix-screen --help || true
        echo "Binary verified"

    # Actually run the UI. --help only proves the binary links; this boots the
    # real application headless (SDL dummy driver + software renderer), builds a
    # few panels over the control socket, captures a screenshot and requires a
    # clean exit. Catches startup/shutdown crashes and broken panels that a
    # compile-only check cannot see.
    - name: Headless smoke test
      timeout-minutes: 5
      run: ./scripts/smoke-headless.sh

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: helix-screen-ubuntu-22.04
        path: |
          build/bin/helix-screen
          build/bin/helix-tests
        retention-days: 7

  test-ubuntu:
    name: Test (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    needs: compile-ubuntu
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Initialize submodules
      uses: ./.github/actions/init-submodules

    - name: Prepare apt
      uses: ./.github/actions/apt-prepare

    # This job only ever gets the -dev-free runtime closure, so every library the
    # compile job picked up transitively via a -dev package has to be named here.
    # libgles2 is the one that is easy to miss: ENABLE_GLES_3D links -lGLESv2 for
    # the 3D G-code renderer, and on the compile runner libsdl2-dev drags it in.
    # Without it helix-screen never reaches main() — ld.so exits 127 before the
    # first log line, which surfaces as every pytest UI test erroring in setup.
    - name: Install runtime dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-2.0-0 libgles2 libfmt-dev libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libpng16-16 libjpeg8

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: helix-screen-ubuntu-22.04
        path: build/bin/

    - name: Make binaries executable
      run: chmod +x build/bin/helix-screen build/bin/helix-tests

    # Fail here, with the library name, rather than 200 lines into a pytest run
    # that reports 38 identical "exited with 127 during boot" setup errors.
    - name: Verify the runtime library closure is complete
      run: |
        missing=$(ldd build/bin/helix-screen build/bin/helix-tests | grep 'not found' | sort -u || true)
        if [ -n "$missing" ]; then
          echo "::error::Missing runtime libraries — add the providing packages to 'Install runtime dependencies'"
          echo "$missing"
          exit 1
        fi
        echo "All shared libraries resolve"

    - name: Run unit tests
      timeout-minutes: 10
      run: |
        NPROCS=$(( $(nproc) * 2 ))
        echo "Running $NPROCS test shards in parallel..."
        pids=""
        for i in $(seq 0 $((NPROCS-1))); do
          # Subshell + pipefail: without both, $! is the sed at the end of the
          # pipeline and `wait` collects sed's status, so a failing shard exits 0.
          (set -o pipefail; ./build/bin/helix-tests "~[.] ~[slow]" --shard-count $NPROCS --shard-index $i 2>&1 | sed "s/^/[shard $i] /") &
          pids="$pids $!"
        done
        failed=0
        for pid in $pids; do
          wait $pid || failed=1
        done
        if [ $failed -eq 1 ]; then
          echo "One or more test shards failed!"
          exit 1
        fi
        echo "All tests passed"

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install Python test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Invoked directly rather than through `make test-ui-pytest`: that target's
    # .venv check exists to catch a local dev who forgot `make venv-setup`, which
    # doesn't apply here — this runner's Python comes from actions/setup-python,
    # not a repo-local .venv, so requiring one would just be a false failure.
    #
    # --ignore=tests/ui/test_screens.py excludes the 8 golden-image tests. The
    # other 38 tests assert on behavior (navigation, wait_idle, text reading,
    # capture mechanics, screen state) and are portable across machines; the
    # goldens compare pixels, and cross-machine font rasterization is exactly the
    # golden-portability risk the design spec calls out (see
    # docs/devel/UI_TESTING.md § "Out-of-Process Tests" / the design spec's Risks
    # section). Goldens stay a local-only gate until someone deliberately captures
    # them inside a fixed container with pinned fonts — don't "fix" this by
    # dropping the --ignore; that trades a green build for flaky pixel diffs
    # unrelated to whatever change actually broke it.
    # The Moonraker plugin runs on the printer inside Moonraker, so no C++ test
    # reaches it and these are its only coverage. They need no binary and no
    # printer -- the Moonraker component surface is mocked -- which is why they
    # can run here rather than in a hardware job. Previously nothing ran them at
    # all, and moonraker-plugin/install.sh sat pointing at a config file that had
    # been deleted for months (prestonbrown/helixscreen#1268).
    - name: Run Moonraker plugin tests (pytest)
      timeout-minutes: 2
      run: pytest moonraker-plugin/tests/ -v

    - name: Run out-of-process UI tests (pytest, excluding goldens)
      timeout-minutes: 5
      run: pytest tests/ui/ -v --ignore=tests/ui/test_screens.py

  build-macos:
    name: Build (macOS 14)
    runs-on: macos-14
    timeout-minutes: 65

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Initialize submodules
      uses: ./.github/actions/init-submodules

    - name: Install dependencies
      run: |
        brew install sdl2 libusb ccache
        # node/npm usually pre-installed on GitHub Actions macOS runners

    - name: Cache compiled dependencies
      uses: actions/cache@v5
      id: cache-deps
      with:
        path: |
          build/lib/
          lib/libhv/lib/
          lib/libhv/include/hv/

        key: deps-macos-14-${{ hashFiles('lib/libhv/**/*.c', 'lib/libhv/**/*.cpp', 'lib/libhv/**/*.h') }}
        restore-keys: |
          deps-macos-14-

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/ccache
        key: ccache-macos-14-${{ github.sha }}
        restore-keys: |
          ccache-macos-14-

    - name: Verify submodules
      run: |
        echo "Checking submodule status..."
        git submodule status
        echo "Submodules initialized"

    - name: Install Node.js dependencies
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 2
        max_attempts: 3
        command: npm install

    - name: Configure ccache
      run: |
        ccache --set-config=max_size=2G
        ccache --set-config=compression=true
        ccache -z  # Reset stats for this run

    - name: Setup Python venv for translations
      run: make venv-setup

    - name: Build HelixScreen
      # 45 min covers a fully cold build (both deps-cache and ccache missing).
      # Warm-cache builds finish in a few minutes; this only bites on a cache miss.
      timeout-minutes: 45
      env:
        CC: ccache clang
        CXX: ccache clang++
      run: |
        make -j$(sysctl -n hw.ncpu)
        echo "HelixScreen built successfully"
        ccache -s

    - name: Verify binary
      run: |
        ./build/bin/helix-screen --help || true
        echo "Binary verified"

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: helix-screen-macos-14
        path: build/bin/helix-screen
        retention-days: 7

  build-android:
    name: Build (Android)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Initialize submodules
      uses: ./.github/actions/init-submodules

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android NDK
      run: |
        yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" || true

    - name: Cache Gradle
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-

    - name: Apply submodule patches
      run: make apply-patches

    - name: Build Android APK (debug)
      working-directory: android
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: helix-screen-android-debug
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 7

  # =========================================================================
  # Shell / BATS tests (installer, hooks, lint rules) — fast (<2 min)
  # Runs per-PR/push so installer & lint regressions block merge instead of
  # surfacing in nightly hours later.
  # =========================================================================
  # helix-splash and helix-watchdog link DISPLAY_LIB with -Wl,--whole-archive, so
  # every object in that archive is a hard link dependency of both binaries even
  # though neither calls into most of it. The embedded targets build -flto
  # -ffunction-sections and drop the unreachable callers before symbol resolution;
  # pi, pi32 and x86 do not, so a new call added to any DISPLAY_LIB source breaks
  # exactly those three and nothing else. Nothing else in this workflow links
  # either binary — the desktop build is SDL, which skips them outright — so
  # before this job the release workflow was the first place they were ever
  # linked, i.e. on tag push. v0.99.104 died that way (redact::mac, #1191).
  #
  # x86-fbdev is the cheapest configuration that reproduces it: native x86_64,
  # no LTO, DISPLAY_BACKEND=fbdev so both binaries build, and no EGL/GLES/DRM
  # packages needed. This is a link check, not a release artifact — the runner's
  # glibc is newer than the Bullseye container the real x86 build uses.
  link-aux-binaries:
    name: Link splash + watchdog (non-LTO)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Initialize submodules
      uses: ./.github/actions/init-submodules

    - name: Prepare apt
      uses: ./.github/actions/apt-prepare

    - name: Install dependencies
      uses: nick-fields/retry@v4
      with:
        # See the note on the first Install dependencies step above.
        timeout_minutes: 20
        max_attempts: 3
        command: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            make \
            python3 \
            python3-venv \
            npm \
            libssl-dev \
            pkg-config \
            libfmt-dev \
            libnl-3-dev \
            libnl-genl-3-dev \
            libusb-1.0-0-dev \
            libsystemd-dev \
            libbluetooth-dev \
            ccache

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache
        key: ccache-x86-fbdev-${{ github.sha }}
        restore-keys: |
          ccache-x86-fbdev-

    - name: Install Node.js dependencies
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 2
        max_attempts: 3
        command: npm install

    - name: Configure ccache
      run: |
        ccache --set-config=max_size=2G
        ccache --set-config=compression=true

    - name: Setup Python venv for translations
      run: make venv-setup

    - name: Link helix-splash and helix-watchdog
      timeout-minutes: 45
      env:
        CC: ccache clang
        CXX: ccache clang++
      run: |
        make PLATFORM_TARGET=x86-fbdev SKIP_OPTIONAL_DEPS=1 -j$(nproc) splash watchdog

    - name: Verify both binaries were actually produced
      run: |
        # The splash/watchdog targets print "not built (SDL/desktop build)" and
        # exit 0 when DISPLAY_BACKEND is neither drm nor fbdev. Without this
        # check a misconfigured target would make the job pass by doing nothing.
        for bin in helix-splash helix-watchdog; do
          path="build/x86-fbdev/bin/$bin"
          if [ ! -x "$path" ]; then
            echo "::error::$path missing — the link check did not link anything"
            exit 1
          fi
          echo "OK: $path ($(stat -c%s "$path") bytes)"
        done

  test-shell:
    name: Shell Tests (BATS)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Install bats
      run: sudo npm install -g bats

    - name: Run shell tests
      run: bats tests/shell/

  test-telemetry-worker:
    name: Telemetry Worker Tests (vitest)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    # `npm install`, not `npm ci`: package-lock.json is gitignored repo-wide
    # (.gitignore "Dependencies" block), so there is no lockfile to install
    # from and nothing to key a cache on.
    - name: Install dependencies
      working-directory: server/telemetry-worker
      run: npm install

    - name: Run worker tests
      working-directory: server/telemetry-worker
      run: npm test

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [compile-ubuntu, test-ubuntu, build-macos, build-android, link-aux-binaries, test-shell, test-telemetry-worker]
    if: always()

    steps:
    - name: Check build results
      run: |
        if [ "${{ needs.compile-ubuntu.result }}" != "success" ]; then
          echo "Ubuntu compile failed"
          exit 1
        fi
        if [ "${{ needs.test-ubuntu.result }}" != "success" ]; then
          echo "Ubuntu tests failed"
          exit 1
        fi
        if [ "${{ needs.build-macos.result }}" != "success" ]; then
          echo "macOS build failed"
          exit 1
        fi
        if [ "${{ needs.build-android.result }}" != "success" ]; then
          echo "Android build failed"
          exit 1
        fi
        if [ "${{ needs.test-shell.result }}" != "success" ]; then
          echo "Shell tests failed"
          exit 1
        fi
        if [ "${{ needs.test-telemetry-worker.result }}" != "success" ]; then
          echo "Telemetry worker tests failed"
          exit 1
        fi
        if [ "${{ needs.link-aux-binaries.result }}" != "success" ]; then
          echo "splash/watchdog link check failed"
          exit 1
        fi
        echo "All builds passed"
