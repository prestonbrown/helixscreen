name: Weekly ratchet report

# No count ratchet blocks a landing (prestonbrown/helixscreen#2004), so nothing
# at a gate stops them drifting. This prints each count against a week ago and
# against its baseline into the job summary, and lists every new design-ratchet
# site (scripts/design_ratchets.py) with the commit that added it and the reason
# that commit stated. It never fails on a trend; only a count it cannot take
# fails the job. By hand: scripts/ratchet_report.py.

on:
  schedule:
    # Off the hour, like nightly.yml: GitHub queues on-the-hour schedules longest.
    - cron: '41 22 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: "Compare HEAD against this many days ago"
        default: "7"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        # The report reads the commit from a week ago, and blames each new
        # design-ratchet site back to the commit that wrote it.
        fetch-depth: 0
        submodules: false

    # The LVGL 9.6 rule reads the deprecated names from LVGL's own headers.
    - name: Fetch lib/lvgl
      run: git submodule update --init --depth 1 lib/lvgl

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Ratchet report
      env:
        DAYS: ${{ inputs.days || '7' }}
      run: |
        set -o pipefail
        python3 scripts/ratchet_report.py --days "$DAYS" --markdown | tee -a "$GITHUB_STEP_SUMMARY"
